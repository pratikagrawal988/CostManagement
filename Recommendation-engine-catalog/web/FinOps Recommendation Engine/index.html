      function ReadinessKpi({ label, value, sub, accent }) {
        return (
          <div style={{ background:"rgba(15,22,41,0.8)", border:"1px solid rgba(99,102,241,0.12)", borderRadius:10, padding:14 }}>
            <div style={{ fontSize:10, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:4 }}>{label}</div>
            <div style={{ fontSize:24, fontWeight:700, color:accent }}>{value}</div>
            <div style={{ fontSize:10, color:"#64748b", marginTop:3 }}>{sub}</div>
          </div>
        );
      }

      function RecommendationLibraryView({ onImport }) {
        const [rows, setRows] = useState([]);
        const [error, setError] = useState("");
        const [selectedId, setSelectedId] = useState("");
        const [search, setSearch] = useState("");
        const [category, setCategory] = useState("All");
        const [provider, setProvider] = useState("All");
        const [action, setAction] = useState("All");
        const [priority, setPriority] = useState("All");
        const [group, setGroup] = useState("All");
        const [advisorySource, setAdvisorySource] = useState("All");
        const [statusFilter, setStatusFilter] = useState("All");
        const [importedMsg, setImportedMsg] = useState("");

        useEffect(() => {
          fetch(CATALOG_CSV_PATH, { cache:"no-store" })
            .then(r => {
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return r.text();
            })
            .then(text => {
              const parsed = parseCsv(text);
              setRows(parsed);
              setSelectedId(parsed[0]?.id || "");
            })
            .catch(e => setError(`Unable to load ${CATALOG_CSV_PATH}: ${e.message}`));
        }, []);

        const simulated = useMemo(() => rows.map(r => ({ row:r, sim:simulateCatalogTemplate(r) })), [rows]);
        const summary = useMemo(() => {
          const total = simulated.length;
          const configurable = simulated.filter(x => x.sim.gaps.length === 0).length;
          const actionGaps = simulated.filter(x => x.sim.gaps.some(g => g.includes("Action"))).length;
          const resourceGaps = simulated.filter(x => x.sim.gaps.some(g => g.includes("resource type"))).length;
          const groupGaps = simulated.filter(x => x.sim.gaps.some(g => g.includes("compatibility"))).length;
          return { total, configurable, actionGaps, resourceGaps, groupGaps };
        }, [simulated]);

        const categories = ["All", ...Array.from(new Set(rows.map(r => r.category))).sort()];
        const providers = ["All", ...Array.from(new Set(rows.map(r => r.provider_scope))).sort()];
        const actions = ["All", ...Array.from(new Set(rows.map(r => r.recommendation_type))).sort()];
        const priorities = ["All", ...Array.from(new Set(rows.map(r => r.priority))).sort()];
        const groups = ["All", ...Array.from(new Set(rows.map(r => r.compatibility_group))).sort()];
        const advisorySources = ["All","Seed","CostVars","Global native"];
        const advisoryBucket = (row) => row.advisory_id?.startsWith("CVAR-") ? "CostVars" : row.advisory_id?.startsWith("GLOBAL-") ? "Global native" : "Seed";

        const visible = simulated.filter(({ row, sim }) => {
          if (category !== "All" && row.category !== category) return false;
          if (provider !== "All" && row.provider_scope !== provider) return false;
          if (action !== "All" && row.recommendation_type !== action) return false;
          if (priority !== "All" && row.priority !== priority) return false;
          if (group !== "All" && row.compatibility_group !== group) return false;
          if (advisorySource !== "All" && advisoryBucket(row) !== advisorySource) return false;
          if (statusFilter === "Configurable" && sim.gaps.length) return false;
          if (statusFilter === "Needs work" && !sim.gaps.length) return false;
          if (search && !`${row.id} ${row.recommendation_name} ${row.primary_metrics} ${row.baseline_thresholds} ${row.compatibility_group} ${row.recommendation_definition} ${row.expected_benefits} ${row.configurator_showcase} ${row.advisory_id} ${row.advisory_source} ${row.advisory_layer}`.toLowerCase().includes(search.toLowerCase())) return false;
          return true;
        });

        const selected = simulated.find(x => x.row.id === selectedId) || visible[0] || simulated[0];

        function importSelected(row) {
          appendCustomRec(templateToRecommendation(row));
          setImportedMsg(`${row.id} imported as a draft recommendation. Open Recommendations to review it.`);
          if (onImport) onImport();
        }

        return (
          <div>
            <h2 style={{ fontSize:20, fontWeight:700, color:"#f1f5f9", margin:"0 0 4px" }}>Global Recommendation Library</h2>
            <p style={{ fontSize:12, color:"#64748b", margin:"0 0 20px" }}>All Basic catalog rows are loaded from the expanded global CSV and validated against the UI configuration flow: definition, benefits, advisory mapping, action type, resource type, metrics, thresholds, formula, Product Catalog dependency, and compatibility group.</p>

            {error && <div style={{ padding:12, borderRadius:8, background:"rgba(239,68,68,0.08)", border:"1px solid rgba(239,68,68,0.2)", color:"#fca5a5", fontSize:12, marginBottom:14 }}>{error}</div>}
            {importedMsg && <div style={{ padding:12, borderRadius:8, background:"rgba(16,185,129,0.08)", border:"1px solid rgba(16,185,129,0.2)", color:"#86efac", fontSize:12, marginBottom:14 }}>{importedMsg}</div>}

            <div style={{ display:"grid", gridTemplateColumns:"repeat(5, 1fr)", gap:12, marginBottom:16 }}>
              <ReadinessKpi label="CSV rows loaded" value={fmt(summary.total)} accent="#a5b4fc" sub="expected 1,030" />
              <ReadinessKpi label="Configurable via UI" value={fmt(summary.configurable)} accent="#34d399" sub="after current fixes" />
              <ReadinessKpi label="Action gaps" value={fmt(summary.actionGaps)} accent={summary.actionGaps?"#f59e0b":"#34d399"} sub="action picker coverage" />
              <ReadinessKpi label="Resource gaps" value={fmt(summary.resourceGaps)} accent={summary.resourceGaps?"#f59e0b":"#34d399"} sub="wizard resource mapping" />
              <ReadinessKpi label="Group gaps" value={fmt(summary.groupGaps)} accent={summary.groupGaps?"#f59e0b":"#34d399"} sub="compatibility coverage" />
            </div>

            <div style={{ background:"linear-gradient(135deg, rgba(15,22,41,0.95), rgba(30,41,59,0.72))", border:"1px solid rgba(99,102,241,0.22)", borderRadius:12, padding:16, marginBottom:16 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
                <div>
                  <div style={{ fontSize:13, fontWeight:800, color:"#f1f5f9" }}>Recommendation Filters</div>
                  <div style={{ fontSize:11, color:"#64748b" }}>Use these to inspect the seed catalog, CostVars advisories, global native recommendations, and configuration readiness.</div>
                </div>
                <button onClick={() => { setSearch(""); setCategory("All"); setProvider("All"); setAction("All"); setPriority("All"); setGroup("All"); setAdvisorySource("All"); setStatusFilter("All"); }}
                  style={{ padding:"6px 10px", borderRadius:7, border:"1px solid rgba(148,163,184,0.22)", background:"rgba(255,255,255,0.03)", color:"#94a3b8", cursor:"pointer", fontSize:11 }}>Reset filters</button>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1.4fr repeat(3, 1fr)", gap:10, marginBottom:10 }}>
                <div>
                  <label style={{ fontSize:10, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.06em", display:"block", marginBottom:4 }}>Search</label>
                  <input value={search} onChange={e => setSearch(e.target.value)} placeholder="BR-0011, CVAR-030, benefits, p95_cpu, model_route, compatibility group"
                    style={{ width:"100%", padding:"8px 10px", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(99,102,241,0.18)", borderRadius:7, color:"#e2e8f0", fontSize:12 }} />
                </div>
                <CatalogSelect label="Category" value={category} onChange={setCategory} options={categories} />
                <CatalogSelect label="Provider" value={provider} onChange={setProvider} options={providers} />
                <CatalogSelect label="Action" value={action} onChange={setAction} options={actions} />
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gap:10 }}>
                <CatalogSelect label="Priority" value={priority} onChange={setPriority} options={priorities} />
                <CatalogSelect label="Compatibility Group" value={group} onChange={setGroup} options={groups} />
                <CatalogSelect label="Advisory Source" value={advisorySource} onChange={setAdvisorySource} options={advisorySources} />
                <CatalogSelect label="UI Status" value={statusFilter} onChange={setStatusFilter} options={["All","Configurable","Needs work"]} />
              </div>
            </div>

            <div style={{ display:"grid", gridTemplateColumns:"1.2fr 0.8fr", gap:16 }}>
              <div style={{ background:"rgba(15,22,41,0.8)", border:"1px solid rgba(99,102,241,0.1)", borderRadius:12, overflow:"hidden" }}>
                <div style={{ padding:"12px 16px", borderBottom:"1px solid rgba(99,102,241,0.08)", display:"flex", justifyContent:"space-between" }}>
                  <div style={{ fontSize:13, fontWeight:700, color:"#f1f5f9" }}>Catalog Rows</div>
                  <div style={{ fontSize:11, color:"#64748b" }}>{visible.length} shown</div>
                </div>
                <div style={{ maxHeight:620, overflow:"auto" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse" }}>
                    <thead style={{ position:"sticky", top:0, background:"#0f1629", zIndex:1 }}>
                      <tr>
                        {["ID","Recommendation","Advisory","Action","Metrics","Thresholds","Group","Status"].map(h => <th key={h} style={{ padding:"9px 10px", textAlign:"left", fontSize:10, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.06em", borderBottom:"1px solid rgba(99,102,241,0.08)" }}>{h}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {visible.map(({ row, sim }) => {
                        const active = selected?.row.id === row.id;
                        return (
                          <tr key={row.id} onClick={() => setSelectedId(row.id)} style={{ cursor:"pointer", background:active?"rgba(99,102,241,0.1)":"transparent", borderTop:"1px solid rgba(99,102,241,0.04)" }}>
                            <td style={{ padding:"9px 10px", color:"#a5b4fc", fontSize:11, fontFamily:"monospace", fontWeight:700 }}>{row.id}</td>
                            <td style={{ padding:"9px 10px", color:"#e2e8f0", fontSize:11, minWidth:220 }}><div style={{ fontWeight:700 }}>{row.recommendation_name}</div><div style={{ color:"#64748b", fontSize:10 }}>{row.provider_scope} · {row.category} / {row.sub_category} · {row.priority}</div></td>
                            <td style={{ padding:"9px 10px", color:row.advisory_id?"#fbbf24":"#64748b", fontSize:10, fontFamily:row.advisory_id?"monospace":"inherit", fontWeight:row.advisory_id?700:500 }}>{row.advisory_id || "Seed"}</td>
                            <td style={{ padding:"9px 10px", color:"#94a3b8", fontSize:10 }}>{actionById(sim.actionId).label}</td>
                            <td style={{ padding:"9px 10px", color:"#94a3b8", fontSize:10 }}>{sim.metrics.slice(0,3).join(", ")}{sim.metrics.length>3?"…":""}</td>
                            <td style={{ padding:"9px 10px", color:"#fbbf24", fontSize:10 }}>{sim.thresholds.slice(0,2).join("; ")}{sim.thresholds.length>2?"…":""}</td>
                            <td style={{ padding:"9px 10px", color:"#c4b5fd", fontSize:10, maxWidth:180 }}>{row.compatibility_group}</td>
                            <td style={{ padding:"9px 10px" }}><span style={{ padding:"2px 7px", borderRadius:4, background:sim.gaps.length?"rgba(245,158,11,0.12)":"rgba(16,185,129,0.12)", color:sim.gaps.length?"#fbbf24":"#34d399", fontSize:10, fontWeight:700 }}>{sim.status}</span></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>

              {selected && (
                <div style={{ background:"rgba(15,22,41,0.8)", border:"1px solid rgba(99,102,241,0.12)", borderRadius:12, padding:16, alignSelf:"start", position:"sticky", top:16 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", gap:10, alignItems:"flex-start", marginBottom:10 }}>
                    <div>
                      <div style={{ fontSize:11, color:"#a5b4fc", fontFamily:"monospace", fontWeight:800 }}>{selected.row.id}</div>
                      <div style={{ fontSize:15, color:"#f1f5f9", fontWeight:800, lineHeight:1.35 }}>{selected.row.recommendation_name}</div>
                    </div>
                    <button onClick={() => importSelected(selected.row)}
                      style={{ padding:"7px 10px", borderRadius:7, border:"none", background:"linear-gradient(135deg,#6366f1,#8b5cf6)", color:"#fff", cursor:"pointer", fontSize:11, fontWeight:700, whiteSpace:"nowrap" }}>
                      Create Draft
                    </button>
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:12 }}>
                    <MiniConfig label="Action" value={actionById(selected.sim.actionId).label} />
                    <MiniConfig label="Resource Type" value={selected.sim.resourceType || "Manual only"} />
                    <MiniConfig label="Priority" value={`${selected.row.priority} · ${selected.row.end_user_value}`} />
                    <MiniConfig label="Complexity" value={selected.row.implementation_complexity} />
                  </div>
                  <ConfigBlock title="Definition" value={selected.row.recommendation_definition || "Not defined"} />
                  <ConfigBlock title="Benefits" value={selected.row.expected_benefits || "Not defined"} tone="#34d399" />
                  <ConfigBlock title="Configurator Should Show" value={selected.row.configurator_showcase || "Metric bindings, thresholds, savings formula, product catalog dependency, compatibility group, guardrails, approval, and audit history."} />
                  <ConfigBlock title="Advisory Mapping" value={selected.row.advisory_id ? `${selected.row.advisory_id} · ${selected.row.advisory_source} · ${selected.row.advisory_layer}` : "Seed catalog row without external advisory mapping"} tone="#fbbf24" />
                  <ConfigBlock title="Metrics" value={selected.sim.metrics.join("; ")} />
                  <ConfigBlock title="Thresholds" value={selected.row.baseline_thresholds} tone="#fbbf24" />
                  <ConfigBlock title="Savings Formula" value={selected.sim.formula} tone="#34d399" />
                  <ConfigBlock title="Product Catalog Dependency" value={selected.row.product_catalog_dependency} />
                  <ConfigBlock title="Compatibility Group" value={selected.row.compatibility_group} tone="#c4b5fd" />
                  <ConfigBlock title="Data Sources" value={selected.sim.dataSources.join(", ")} />
                  <ConfigBlock title="Onboarding" value={selected.row.onboarding_to_engine} />
                  <ConfigBlock title="Guardrails" value={selected.row.notes_and_guardrails} />
                  <div style={{ marginTop:12, padding:10, borderRadius:8, background:selected.sim.gaps.length?"rgba(245,158,11,0.08)":"rgba(16,185,129,0.08)", border:`1px solid ${selected.sim.gaps.length?"rgba(245,158,11,0.22)":"rgba(16,185,129,0.22)"}` }}>
                    <div style={{ fontSize:11, fontWeight:800, color:selected.sim.gaps.length?"#fbbf24":"#34d399", marginBottom:5 }}>UI Flow Simulation</div>
                    {selected.sim.gaps.length ? (
                      selected.sim.gaps.map(g => <div key={g} style={{ fontSize:11, color:"#fbbf24", marginBottom:3 }}>• {g}</div>)
                    ) : (
                      <div style={{ fontSize:11, color:"#86efac", lineHeight:1.5 }}>Pass: a human can configure this template through the UI using action selection, resource type, manual/custom Signal Catalog metrics if needed, thresholds, savings formula, Product Catalog dependency, and compatibility group.</div>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      function MiniConfig({ label, value }) {
        return (
          <div style={{ padding:8, borderRadius:7, background:"rgba(255,255,255,0.03)", border:"1px solid rgba(99,102,241,0.08)" }}>
            <div style={{ fontSize:9, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.06em" }}>{label}</div>
            <div style={{ fontSize:11, color:"#e2e8f0", fontWeight:700, marginTop:2 }}>{value || "—"}</div>
          </div>
        );
      }

      function ConfigBlock({ title, value, tone }) {
        return (
          <div style={{ marginBottom:9 }}>
            <div style={{ fontSize:10, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:3 }}>{title}</div>
            <div style={{ fontSize:11, color:tone || "#94a3b8", lineHeight:1.5, background:"rgba(255,255,255,0.025)", border:"1px solid rgba(99,102,241,0.08)", borderRadius:7, padding:"7px 8px", wordBreak:"break-word" }}>{value || "—"}</div>
          </div>
        );
      }

      // ─── STEP 3 – METRIC PICKER ──────────────────────────────────────────

              <div style={{ marginBottom:16, background:"rgba(15,22,41,0.6)", borderRadius:10, border:"1px solid rgba(99,102,241,0.1)", overflow:"hidden" }}>
                <div style={{ display:"flex", gap:0, borderBottom:"1px solid rgba(99,102,241,0.08)", background:"rgba(10,14,26,0.4)", padding:"0 4px", overflowX:"auto" }}>
                  {formData.dataSources.map(dsId => {
                    const ds = DATA_SOURCE_TYPES.find(d => d.id === dsId);
                    const isActive = activeConfig === dsId;
                    const accentColor = ds?.color || "#6366f1";
                    return (
                      <button key={dsId} onClick={() => setActiveConfig(isActive ? null : dsId)} style={{ padding:"9px 14px", border:"none", borderBottom:isActive?`2px solid ${accentColor}`:"2px solid transparent", background:"none", color:isActive?accentColor:"#64748b", fontSize:11, fontWeight:isActive?600:400, cursor:"pointer", whiteSpace:"nowrap", display:"flex", alignItems:"center", gap:5, transition:"all 0.15s" }}>
                        {ds?.icon} {ds?.label}
                      </button>
                    );
                  })}
                </div>
                <div style={{ padding:16 }}>
                  {activeConfig === "csp_api"     && <CSPApiConfig     config={formData.sourceConfigs.csp_api||{csps:{}}}  onChange={c => updateConfig("csp_api",c)} />}
                  {activeConfig === "finops_obs" && <FinOpsObsConfig config={formData.sourceConfigs.finops_obs||{}}     onChange={c => updateConfig("finops_obs",c)} />}
                  {activeConfig && !["csp_api","finops_obs"].includes(activeConfig) && <GenericSourceConfig dsId={activeConfig} config={formData.sourceConfigs[activeConfig]||{}} onChange={c => updateConfig(activeConfig,c)} />}
                  {!activeConfig && (
                    <div style={{ fontSize:11, color:"#475569", textAlign:"center", padding:"16px 0" }}>
                      Click a tab above to configure that source's connection details and available fields
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Metric definitions */}
            <div>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                <span style={{ fontSize:11, color:"#94a3b8", fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Metric Definitions & Field Mapping</span>
                {formData.dataSources.length === 0 && <span style={{ fontSize:10, color:"#475569" }}>Select and configure a data source first</span>}
              </div>
              {formData.metrics.map((m,i) => (
                <MetricMappingRow key={i} idx={i} metric={m} dataSources={formData.dataSources} sourceConfigs={formData.sourceConfigs} getAvailableFields={getAvailableFields}
                  onChange={updated => { const ms=[...formData.metrics]; ms[i]=updated; updateField("metrics",ms); }}
                  onRemove={() => updateField("metrics", formData.metrics.filter((_,j) => j !== i))}
                />
              ))}
              <button onClick={() => updateField("metrics",[...formData.metrics,{displayName:"",sourceType:formData.dataSources[0]||"",cspId:"aws",field:"",aggregation:"avg",unit:""}])} style={{ padding:"6px 12px", borderRadius:6, border:"1px dashed rgba(99,102,241,0.3)", background:"none", color:"#6366f1", cursor:"pointer", fontSize:11, width:"100%", marginTop:4 }}>
                + Add Metric
              </button>
            </div>

            <div style={{ marginTop:16 }}>
              <FormField label="Trend Window (days)" value={formData.trendDays} onChange={v => updateField("trendDays",parseInt(v)||0)} type="number" />
            </div>
          </div>
        );
      }

      function CSPApiConfig({ config, onChange }) {
        const [activeCsp, setActiveCsp] = useState(() => Object.keys(config.csps||{})[0] || "aws");

        // Default first dimension per CSP — the typical resource-scoping dimension
        const DEFAULT_DIMENSIONS = {
          aws:   [{key:"InstanceId",      value:"{resource_id}"}],
          azure: [{key:"resource_id",     value:"{resource_id}"}],
          gcp:   [{key:"instance_id",     value:"{resource_id}"}],
          oci:   [{key:"resourceId",      value:"{resource_id}"}],
        };

        const toggleCsp = cspId => {
          const csps = { ...(config.csps||{}) };
          if (csps[cspId]) {
            delete csps[cspId];
            const remaining = Object.keys(csps);
            if (activeCsp === cspId) setActiveCsp(remaining[0] || "aws");
          } else {
            const def = CSP_API_CATALOG[cspId]?.namespaces[0];
            csps[cspId] = { namespace:def?.id||"", selectedFields:[], dimensions:DEFAULT_DIMENSIONS[cspId]||[], period:"PT1H" };
            setActiveCsp(cspId);
          }
          onChange({ ...config, csps });
        };

        const updateCsp = (cspId, updates) => onChange({
          ...config, csps:{ ...(config.csps||{}), [cspId]:{ ...(config.csps?.[cspId]||{}), ...updates } }
        });

        const enabledCsps = Object.keys(config.csps||{});
        const cspConf     = config.csps?.[activeCsp] || {};
        const nsDef       = CSP_API_CATALOG[activeCsp]?.namespaces.find(n => n.id === cspConf.namespace);

        const toggleField = name => {
          const cur = cspConf.selectedFields||[];
          updateCsp(activeCsp, { selectedFields: cur.includes(name) ? cur.filter(f=>f!==name) : [...cur,name] });
        };

        return (
          <div>
            <div style={{ fontSize:11, fontWeight:600, color:"#0ea5e9", marginBottom:12 }}>☁️ CSP Native API — select providers, then configure namespace and fields to pull</div>

            {/* Provider toggle row */}
            <div style={{ display:"flex", gap:6, marginBottom:12, flexWrap:"wrap" }}>
              {CSP_LIST.map(csp => {
                const enabled = !!config.csps?.[csp.id];
                return (
                  <button key={csp.id} onClick={() => toggleCsp(csp.id)} style={{ padding:"5px 16px", borderRadius:6, border:`1px solid ${enabled?csp.color+"50":"rgba(99,102,241,0.1)"}`, background:enabled?csp.color+"12":"transparent", color:enabled?csp.color:"#64748b", fontSize:11, fontWeight:600, cursor:"pointer", transition:"all 0.15s" }}>
                    {enabled?"✓ ":""}{csp.label}
                  </button>
                );
              })}
            </div>

            {enabledCsps.length > 0 && (
              <div style={{ borderRadius:8, border:"1px solid rgba(99,102,241,0.12)", overflow:"hidden" }}>
                {/* CSP config tabs */}
                <div style={{ display:"flex", background:"rgba(10,14,26,0.4)", borderBottom:"1px solid rgba(99,102,241,0.08)" }}>
                  {enabledCsps.map(id => {
                    const csp = CSP_LIST.find(c=>c.id===id);
                    return (
                      <button key={id} onClick={() => setActiveCsp(id)} style={{ padding:"7px 16px", border:"none", borderBottom:activeCsp===id?`2px solid ${csp?.color}`:"2px solid transparent", background:"none", color:activeCsp===id?csp?.color:"#64748b", fontSize:11, fontWeight:activeCsp===id?600:400, cursor:"pointer" }}>
                        {csp?.label}
                      </button>
                    );
                  })}
                </div>

                <div style={{ padding:14 }}>
                  {/* Namespace selector */}
                  <div style={{ marginBottom:12 }}>
                    <div style={{ fontSize:10, color:"#64748b", marginBottom:4, textTransform:"uppercase", letterSpacing:"0.05em" }}>Service / Metric Namespace</div>
                    <select value={cspConf.namespace||""} onChange={e => updateCsp(activeCsp,{namespace:e.target.value, selectedFields:[], dimensions:(cspConf.dimensions?.length?cspConf.dimensions:DEFAULT_DIMENSIONS[activeCsp]||[]), period:cspConf.period||"PT1H"})} style={{ width:"100%", padding:"6px 10px", borderRadius:6, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.8)", color:"#e2e8f0", fontSize:11, outline:"none" }}>
                      <option value="">— Select namespace —</option>
                      {CSP_API_CATALOG[activeCsp]?.namespaces.map(ns => <option key={ns.id} value={ns.id}>{ns.label} · {ns.id}</option>)}
                    </select>
                  </div>

                  {/* Field selector */}
                  {nsDef && (
                    <div>
                      <div style={{ fontSize:10, color:"#64748b", marginBottom:6, textTransform:"uppercase", letterSpacing:"0.05em", display:"flex", alignItems:"center", gap:8 }}>
                        <span>Metric Fields to Pull <span style={{ textTransform:"none", fontSize:9, letterSpacing:0, color:"#475569" }}>({(cspConf.selectedFields||[]).length}/{nsDef.fields.length} selected)</span></span>
                        <button onClick={() => updateCsp(activeCsp,{selectedFields:nsDef.fields.map(f=>f.name)})} style={{ padding:"1px 7px", borderRadius:3, border:"1px solid rgba(99,102,241,0.2)", background:"none", color:"#6366f1", cursor:"pointer", fontSize:9 }}>Select All</button>
                        <button onClick={() => updateCsp(activeCsp,{selectedFields:[]})} style={{ padding:"1px 7px", borderRadius:3, border:"1px solid rgba(99,102,241,0.12)", background:"none", color:"#64748b", cursor:"pointer", fontSize:9 }}>Clear</button>
                      </div>
                      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:4, marginBottom:14 }}>
                        {nsDef.fields.map(f => {
                          const sel = (cspConf.selectedFields||[]).includes(f.name);
                          return (
                            <div key={f.name} onClick={() => toggleField(f.name)} style={{ padding:"6px 10px", borderRadius:5, border:`1px solid ${sel?"rgba(99,102,241,0.3)":"rgba(99,102,241,0.07)"}`, background:sel?"rgba(99,102,241,0.08)":"rgba(99,102,241,0.02)", cursor:"pointer", display:"flex", gap:6, alignItems:"flex-start", transition:"all 0.12s" }}>
                              <span style={{ fontSize:11, color:sel?"#a5b4fc":"#475569", flexShrink:0 }}>{sel?"☑":"☐"}</span>
                              <div>
                                <div style={{ fontSize:11, color:sel?"#e2e8f0":"#94a3b8", fontFamily:"monospace", fontWeight:sel?600:400, lineHeight:1.3 }}>{f.name}</div>
                                <div style={{ fontSize:9, color:"#475569" }}>{f.type} · {f.unit||"—"} · {f.desc}</div>
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      {/* Dimensions — runtime filters scoping the API call to a specific resource */}
                      <div style={{ marginBottom:12 }}>
                        <div style={{ fontSize:10, color:"#64748b", marginBottom:5, textTransform:"uppercase", letterSpacing:"0.05em", display:"flex", alignItems:"center", gap:8 }}>
                          <span>Dimensions <span style={{ textTransform:"none", fontSize:9, letterSpacing:0, color:"#475569" }}>— API call filters, e.g. InstanceId = {"{resource_id}"}</span></span>
                          <button onClick={() => updateCsp(activeCsp,{dimensions:[...(cspConf.dimensions||[]),{key:"",value:"{resource_id}"}]})} style={{ padding:"1px 7px", borderRadius:3, border:"1px dashed rgba(14,165,233,0.3)", background:"none", color:"#0ea5e9", cursor:"pointer", fontSize:9 }}>+ Add</button>
                        </div>
                        {(cspConf.dimensions||[]).length === 0 && (
                          <div style={{ fontSize:10, color:"#475569", padding:"6px 0" }}>No dimensions. Add at least one to scope queries to a specific resource (e.g. InstanceId, ResourceId).</div>
                        )}
                        {(cspConf.dimensions||[]).map((dim, di) => (
                          <div key={di} style={{ display:"flex", gap:6, alignItems:"center", marginBottom:5 }}>
                            <input value={dim.key} onChange={e => { const d=[...(cspConf.dimensions||[])]; d[di]={...d[di],key:e.target.value}; updateCsp(activeCsp,{dimensions:d}); }} placeholder={activeCsp==="azure"?"filter (e.g. resource_id)":activeCsp==="gcp"?"label key":"Dimension key (e.g. InstanceId)"} style={{ flex:1, padding:"4px 8px", borderRadius:5, border:"1px solid rgba(14,165,233,0.2)", background:"rgba(10,14,26,0.8)", color:"#7dd3fc", fontSize:11, fontFamily:"monospace", outline:"none" }} />
                            <span style={{ color:"#475569", fontSize:12 }}>=</span>
                            <input value={dim.value} onChange={e => { const d=[...(cspConf.dimensions||[])]; d[di]={...d[di],value:e.target.value}; updateCsp(activeCsp,{dimensions:d}); }} placeholder="{resource_id}" style={{ flex:1, padding:"4px 8px", borderRadius:5, border:"1px solid rgba(99,102,241,0.2)", background:"rgba(10,14,26,0.8)", color:"#a5b4fc", fontSize:11, fontFamily:"monospace", outline:"none" }} />
                            <button onClick={() => updateCsp(activeCsp,{dimensions:(cspConf.dimensions||[]).filter((_,j)=>j!==di)})} style={{ background:"none", border:"none", color:"#475569", cursor:"pointer", fontSize:12, padding:"0 4px" }}>✕</button>
                          </div>
                        ))}
                        <div style={{ fontSize:9, color:"#3b4a65", marginTop:3, lineHeight:1.5 }}>
                          Use <code style={{ color:"#a5b4fc", background:"rgba(99,102,241,0.08)", padding:"0 3px", borderRadius:2 }}>{"{resource_id}"}</code>, <code style={{ color:"#a5b4fc", background:"rgba(99,102,241,0.08)", padding:"0 3px", borderRadius:2 }}>{"{subscription_id}"}</code>, <code style={{ color:"#a5b4fc", background:"rgba(99,102,241,0.08)", padding:"0 3px", borderRadius:2 }}>{"{project_id}"}</code> for runtime-injected values.
                        </div>
                      </div>

                      {/* Period / granularity */}
                      <div>
                        <div style={{ fontSize:10, color:"#64748b", marginBottom:5, textTransform:"uppercase", letterSpacing:"0.05em" }}>
                          Metric Period / Granularity
                        </div>
                        <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                          <select value={cspConf.period||"PT1H"} onChange={e => updateCsp(activeCsp,{period:e.target.value})} style={{ padding:"5px 10px", borderRadius:5, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.8)", color:"#e2e8f0", fontSize:11, outline:"none" }}>
                            <option value="PT1M">1 minute (PT1M)</option>
                            <option value="PT5M">5 minutes (PT5M)</option>
                            <option value="PT15M">15 minutes (PT15M)</option>
                            <option value="PT1H">1 hour (PT1H) — default</option>
                            <option value="PT6H">6 hours (PT6H)</option>
                            <option value="P1D">1 day (P1D)</option>
                          </select>
                          <span style={{ fontSize:10, color:"#475569" }}>ISO 8601 duration — how often the metric is sampled</span>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      function FinOpsObsConfig({ config, onChange }) {
        const [newField, setNewField] = useState({ name:"", type:"float", unit:"", desc:"" });

        const detectVars = pat => (pat||"").match(/\{([^}]+)\}/g)?.map(m => m.slice(1,-1)) || [];

        const applyTemplate = tplId => {
          if (tplId === "custom") { onChange({ ...config, templateId:"custom" }); return; }
          const t = FINOPS_INDEX_TEMPLATES.find(x => x.id === tplId);
          if (t) onChange({ templateId:t.id, indexPattern:t.pattern, variables:JSON.parse(JSON.stringify(t.variables)), fields:JSON.parse(JSON.stringify(t.fields)) });
        };

        const handlePattern = pat => {
          const detected = detectVars(pat);
          const vars = detected.map(name => (config.variables||[]).find(v => v.name === name) || { name, desc:"", source:"execution_context" });
          onChange({ ...config, templateId:"custom", indexPattern:pat, variables:vars });
        };

        const updateVar  = (i, upd) => { const vs=[...(config.variables||[])]; vs[i]={...vs[i],...upd}; onChange({...config,variables:vs}); };
        const addField   = () => { if (!newField.name.trim()) return; onChange({...config,fields:[...(config.fields||[]),{...newField}]}); setNewField({name:"",type:"float",unit:"",desc:""}); };
        const removeField = i => onChange({...config, fields:(config.fields||[]).filter((_,j) => j !== i)});

        const detectedVars = detectVars(config.indexPattern);

        return (
          <div>
            <div style={{ fontSize:11, fontWeight:600, color:"#ec4899", marginBottom:12 }}>📊 FinOps Observability (Elasticsearch) — configure index pattern, runtime variables & field schema</div>

            {/* Template picker */}
            <div style={{ marginBottom:12 }}>
              <div style={{ fontSize:10, color:"#64748b", marginBottom:4, textTransform:"uppercase", letterSpacing:"0.05em" }}>Quick Template</div>
              <select value={config.templateId||""} onChange={e => applyTemplate(e.target.value)} style={{ width:"100%", padding:"6px 10px", borderRadius:6, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.8)", color:"#e2e8f0", fontSize:11, outline:"none" }}>
                <option value="">— Select a template or configure manually —</option>
                {FINOPS_INDEX_TEMPLATES.map(t => <option key={t.id} value={t.id}>{t.label}{t.pattern ? ` · ${t.pattern}` : ""}</option>)}
              </select>
            </div>

            {/* Index pattern */}
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:10, color:"#64748b", marginBottom:4, textTransform:"uppercase", letterSpacing:"0.05em" }}>
                Index Pattern &nbsp;
                <span style={{ color:"#7c3aed", fontFamily:"monospace", textTransform:"none", fontSize:9, letterSpacing:0 }}>use {"{variable}"} for runtime substitution</span>
              </div>
              <input value={config.indexPattern||""} onChange={e => handlePattern(e.target.value)} placeholder="e.g., finops-{customer_id}-vm-metrics-{year}.{month}" style={{ width:"100%", padding:"7px 12px", borderRadius:6, border:"1px solid rgba(236,72,153,0.3)", background:"rgba(10,14,26,0.8)", color:"#f9a8d4", fontSize:12, fontFamily:"monospace", outline:"none", boxSizing:"border-box" }} />
              {detectedVars.length > 0 && (
                <div style={{ marginTop:5, display:"flex", gap:4, flexWrap:"wrap" }}>
                  {detectedVars.map(v => <span key={v} style={{ padding:"1px 6px", borderRadius:4, fontSize:10, background:"rgba(139,92,246,0.12)", color:"#c4b5fd", border:"1px solid rgba(139,92,246,0.2)", fontFamily:"monospace" }}>{"{"+v+"}"}</span>)}
                </div>
              )}
            </div>

            {/* Runtime variables table */}
            {(config.variables||[]).length > 0 && (
              <div style={{ marginBottom:14 }}>
                <div style={{ fontSize:10, color:"#64748b", marginBottom:5, textTransform:"uppercase", letterSpacing:"0.05em" }}>
                  Runtime Variables <span style={{ textTransform:"none", fontSize:9, letterSpacing:0, fontWeight:400, color:"#475569" }}>— auto-detected from pattern, describe each below</span>
                </div>
                <div style={{ borderRadius:7, border:"1px solid rgba(139,92,246,0.15)", overflow:"hidden" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse" }}>
                    <thead>
                      <tr style={{ background:"rgba(139,92,246,0.07)" }}>
                        {["Variable","Description (what it represents)","Resolved At"].map(h => <th key={h} style={{ padding:"7px 10px", textAlign:"left", fontSize:9, fontWeight:600, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.06em" }}>{h}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {(config.variables||[]).map((v,i) => (
                        <tr key={i} style={{ borderTop:"1px solid rgba(139,92,246,0.06)" }}>
                          <td style={{ padding:"6px 10px", fontFamily:"monospace", fontSize:11, color:"#c4b5fd", whiteSpace:"nowrap" }}>{"{"+v.name+"}"}</td>
                          <td style={{ padding:"6px 10px" }}>
                            <input value={v.desc} onChange={e => updateVar(i,{desc:e.target.value})} placeholder="e.g., Customer tenant ID from execution context" style={{ width:"100%", padding:"3px 8px", borderRadius:4, border:"1px solid rgba(99,102,241,0.12)", background:"rgba(10,14,26,0.7)", color:"#e2e8f0", fontSize:11, outline:"none", boxSizing:"border-box" }} />
                          </td>
                          <td style={{ padding:"6px 10px" }}>
                            <select value={v.source} onChange={e => updateVar(i,{source:e.target.value})} style={{ padding:"3px 8px", borderRadius:4, border:"1px solid rgba(99,102,241,0.12)", background:"rgba(10,14,26,0.7)", color:"#94a3b8", fontSize:10, outline:"none" }}>
                              <option value="execution_context">Execution context</option>
                              <option value="static">Static value</option>
                              <option value="resource_attribute">Resource attribute</option>
                            </select>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* Index fields */}
            <div>
              <div style={{ fontSize:10, color:"#64748b", marginBottom:5, textTransform:"uppercase", letterSpacing:"0.05em" }}>
                Index Fields <span style={{ textTransform:"none", fontSize:9, letterSpacing:0, fontWeight:400, color:"#475569" }}>— available fields for metric mapping (edit or add custom fields)</span>
              </div>
              {(config.fields||[]).length > 0 && (
                <div style={{ borderRadius:7, border:"1px solid rgba(236,72,153,0.12)", overflow:"hidden", marginBottom:8 }}>
                  <table style={{ width:"100%", borderCollapse:"collapse" }}>
                    <thead>
                      <tr style={{ background:"rgba(236,72,153,0.05)" }}>
                        {["Field Name","Type","Unit","Description",""].map(h => <th key={h} style={{ padding:"6px 10px", textAlign:"left", fontSize:9, fontWeight:600, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.06em" }}>{h}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {(config.fields||[]).map((f,i) => (
                        <tr key={i} style={{ borderTop:"1px solid rgba(236,72,153,0.05)" }}>
                          <td style={{ padding:"5px 10px", fontFamily:"monospace", fontSize:11, color:"#f9a8d4" }}>{f.name}</td>
                          <td style={{ padding:"5px 10px" }}><span style={{ padding:"1px 5px", borderRadius:3, fontSize:9, background:"rgba(236,72,153,0.08)", color:"#ec4899" }}>{f.type}</span></td>
                          <td style={{ padding:"5px 10px", fontSize:10, color:"#64748b", fontFamily:"monospace" }}>{f.unit||"—"}</td>
                          <td style={{ padding:"5px 10px", fontSize:10, color:"#94a3b8", maxWidth:200, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{f.desc}</td>
                          <td style={{ padding:"5px 10px" }}><button onClick={() => removeField(i)} style={{ background:"none", border:"none", color:"#475569", cursor:"pointer", fontSize:12, padding:0, lineHeight:1 }}>✕</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
              {/* Add field row */}
              <div style={{ display:"flex", gap:5, alignItems:"stretch" }}>
                <input value={newField.name} onChange={e=>setNewField(f=>({...f,name:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addField()} placeholder="field_name" style={{ flex:2, padding:"5px 8px", borderRadius:5, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.8)", color:"#f9a8d4", fontSize:11, fontFamily:"monospace", outline:"none" }} />
                <select value={newField.type} onChange={e=>setNewField(f=>({...f,type:e.target.value}))} style={{ flex:1, padding:"5px 7px", borderRadius:5, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.8)", color:"#e2e8f0", fontSize:10, outline:"none" }}>
                  {["float","long","int","keyword","date","boolean","text"].map(t => <option key={t} value={t}>{t}</option>)}
                </select>
                <input value={newField.unit} onChange={e=>setNewField(f=>({...f,unit:e.target.value}))} placeholder="unit (%, bytes…)" style={{ flex:1, padding:"5px 8px", borderRadius:5, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.8)", color:"#e2e8f0", fontSize:11, outline:"none" }} />
                <input value={newField.desc} onChange={e=>setNewField(f=>({...f,desc:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addField()} placeholder="description" style={{ flex:3, padding:"5px 8px", borderRadius:5, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.8)", color:"#e2e8f0", fontSize:11, outline:"none" }} />

      function MetricMappingRow({ idx, metric, dataSources, sourceConfigs, getAvailableFields, onChange, onRemove }) {
        const srcType  = metric.sourceType || "";
        const cspId    = metric.cspId || "aws";
        const configuredCsps = srcType === "csp_api" ? Object.keys(sourceConfigs?.csp_api?.csps||{}) : [];
        const availFields    = getAvailableFields(srcType, cspId);
        const selectedField  = availFields.find(f => f.name === metric.field);

        const gridCols = srcType === "csp_api" ? "1fr 72px 1fr 110px" : "1fr 1fr 110px";

        return (
          <div style={{ padding:11, background:"rgba(99,102,241,0.03)", border:"1px solid rgba(99,102,241,0.1)", borderRadius:8, marginBottom:7 }}>
            {/* Name row */}
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
              <div style={{ width:22, height:22, borderRadius:5, background:"rgba(99,102,241,0.15)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, color:"#a5b4fc", fontWeight:700, flexShrink:0 }}>M{idx+1}</div>
              <input value={metric.displayName||""} onChange={e=>onChange({...metric,displayName:e.target.value})} placeholder="Metric display name (e.g., CPU Utilization %)" style={{ flex:1, padding:"5px 10px", borderRadius:6, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.7)", color:"#e2e8f0", fontSize:12, outline:"none" }} />
              <button onClick={onRemove} style={{ background:"none", border:"none", color:"#475569", cursor:"pointer", fontSize:13, padding:"0 4px", flexShrink:0 }}>✕</button>
            </div>

            {/* Selectors */}
            <div style={{ display:"grid", gridTemplateColumns:gridCols, gap:7 }}>
              <div>
                <div style={{ fontSize:9, color:"#64748b", marginBottom:3, textTransform:"uppercase", letterSpacing:"0.05em" }}>Source</div>
                <select value={srcType} onChange={e=>onChange({...metric,sourceType:e.target.value,cspId:"aws",field:"",unit:""})} style={{ width:"100%", padding:"5px 8px", borderRadius:5, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.8)", color:"#e2e8f0", fontSize:11, outline:"none" }}>
                  <option value="">— Select —</option>
                  {dataSources.map(id => { const d=DATA_SOURCE_TYPES.find(x=>x.id===id); return <option key={id} value={id}>{d?.label||id}</option>; })}
                </select>
              </div>

              {srcType === "csp_api" && (
                <div>
                  <div style={{ fontSize:9, color:"#64748b", marginBottom:3, textTransform:"uppercase", letterSpacing:"0.05em" }}>CSP</div>
                  <select value={cspId} onChange={e=>onChange({...metric,cspId:e.target.value,field:"",unit:""})} style={{ width:"100%", padding:"5px 8px", borderRadius:5, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.8)", color:"#e2e8f0", fontSize:11, outline:"none" }}>
                    {configuredCsps.length===0 ? <option>Configure CSP ↑</option> : configuredCsps.map(id => <option key={id} value={id}>{id.toUpperCase()}</option>)}
                  </select>
                </div>
              )}

              <div>
                <div style={{ fontSize:9, color:"#64748b", marginBottom:3, textTransform:"uppercase", letterSpacing:"0.05em" }}>Source Field</div>
                <select value={metric.field||""} onChange={e => { const f=availFields.find(x=>x.name===e.target.value); onChange({...metric,field:e.target.value,unit:f?.unit||metric.unit}); }} style={{ width:"100%", padding:"5px 8px", borderRadius:5, border:`1px solid ${metric.field?"rgba(99,102,241,0.3)":"rgba(99,102,241,0.15)"}`, background:"rgba(10,14,26,0.8)", color:metric.field?"#a5b4fc":"#64748b", fontSize:11, fontFamily:metric.field?"monospace":"inherit", outline:"none" }}>
                  <option value="">— Select field —</option>
                  {availFields.map(f => <option key={f.name} value={f.name}>{f.name} ({f.unit||f.type})</option>)}
                </select>
              </div>

              <div>
                <div style={{ fontSize:9, color:"#64748b", marginBottom:3, textTransform:"uppercase", letterSpacing:"0.05em" }}>Aggregation</div>
                <select value={metric.aggregation||"avg"} onChange={e=>onChange({...metric,aggregation:e.target.value})} style={{ width:"100%", padding:"5px 8px", borderRadius:5, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.8)", color:"#e2e8f0", fontSize:11, outline:"none" }}>
                  {AGGREGATION_FUNCTIONS.map(a => <option key={a.id} value={a.id}>{a.label}</option>)}
                </select>
              </div>
            </div>

            {/* Field info chip */}
            {selectedField && (

              </div>
            )}
          </div>
        );
      }

      function GenericSourceConfig({ dsId, config, onChange }) {
        const ds  = DATA_SOURCE_TYPES.find(d => d.id === dsId);
        const upd = (k,v) => onChange({ ...config, [k]:v });
        return (
          <div>
            <div style={{ fontSize:11, fontWeight:600, color:ds?.color||"#a5b4fc", marginBottom:12 }}>{ds?.icon} {ds?.label} — connection details &amp; field schema</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
              <FormField label="Endpoint / Connection URL" value={config.endpoint||""} onChange={v=>upd("endpoint",v)} placeholder="https://… or host:port" />
              <FormField label="Auth Method" value={config.auth||""} onChange={v=>upd("auth",v)} placeholder="API Key / Bearer Token / Vault / mTLS" />
            </div>
            <div>
              <label style={{ display:"block", fontSize:11, color:"#94a3b8", marginBottom:4, fontWeight:600 }}>

              <textarea value={config.fieldsRaw||""} onChange={e=>upd("fieldsRaw",e.target.value)} rows={4} placeholder={"cpu_utilization_pct float % — CPU utilization\nnetwork_in_bytes long bytes — Network bytes in\npod_name keyword — Pod identifier"} style={{ width:"100%", padding:"8px 12px", borderRadius:6, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.8)", color:"#e2e8f0", fontSize:11, fontFamily:"monospace", resize:"vertical", outline:"none", boxSizing:"border-box" }} />
              <div style={{ fontSize:10, color:"#475569", marginTop:4 }}>Defined fields will be available for metric mapping in the section below.</div>

                            <option value="">— pick a SKU to preview alternatives —</option>

                                  <tr style={{ borderBottom:"1px solid rgba(255,255,255,0.08)" }}>

                                      <th key={h} style={{ padding:"5px 8px", textAlign:"left", color:"#64748b", fontWeight:600, fontSize:10 }}>{h}</th>

                                  {previewAlternatives.map(alt => {

                                    const savAmt = curSku ? ((curSku.costPerHr - alt.costPerHr) * 720).toFixed(2) : "—";
                                    const cpuColor = alt.projectedCpuPct != null ? (alt.projectedCpuPct > alt.maxTargetPct ? "#f87171" : alt.projectedCpuPct > alt.maxTargetPct - 10 ? "#fbbf24" : "#10b981") : "#475569";
                                    const memColor = alt.projectedMemPct != null ? (alt.projectedMemPct > alt.maxTargetPct ? "#f87171" : alt.projectedMemPct > alt.maxTargetPct - 10 ? "#fbbf24" : "#10b981") : "#475569";
                                    return (
                                      <tr key={alt.type} style={{ borderBottom:"1px solid rgba(255,255,255,0.04)" }}>
                                        <td style={{ padding:"5px 8px", fontFamily:"monospace", color:"#e2e8f0" }}>{alt.type}</td>
                                        <td style={{ padding:"5px 8px", color:"#94a3b8" }}>{alt.vcpu}</td>
                                        <td style={{ padding:"5px 8px", color:"#94a3b8" }}>{alt.mem} GiB</td>
                                        <td style={{ padding:"5px 8px", fontFamily:"monospace", color:"#10b981" }}>${alt.costPerHr.toFixed(4)}</td>
                                        <td style={{ padding:"5px 8px" }}>
                                          <span style={{ background:"rgba(16,185,129,0.1)", color:"#10b981", padding:"2px 6px", borderRadius:4, fontSize:10, fontWeight:700 }}>↓ {savPct}%</span>
                                        </td>
                                        <td style={{ padding:"5px 8px", color:"#64748b", fontSize:10 }}>${savAmt}/mo</td>
                                        <td style={{ padding:"5px 8px" }}>
                                          {alt.projectedCpuPct != null && (
                                            <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                                              <div style={{ width:40, height:5, borderRadius:3, background:"rgba(255,255,255,0.06)", overflow:"hidden" }}>
                                                <div style={{ width:`${Math.min(alt.projectedCpuPct, 100)}%`, height:"100%", background:cpuColor, borderRadius:3 }} />
                                              </div>
                                              <span style={{ fontSize:10, fontWeight:600, color:cpuColor, fontFamily:"monospace" }}>{alt.projectedCpuPct}%</span>
                                            </div>
                                          )}
                                        </td>
                                        <td style={{ padding:"5px 8px" }}>
                                          {alt.projectedMemPct != null && (
                                            <div style={{ display:"flex", alignItems:"center", gap:4 }}>

                                              </div>
                                              <span style={{ fontSize:10, fontWeight:600, color:memColor, fontFamily:"monospace" }}>{alt.projectedMemPct}%</span>
                                            </div>
                                          )}
                                        </td>
                                        <td style={{ padding:"5px 8px" }}>
                                          <span style={{ fontSize:10, fontWeight:700, color:"#10b981" }}>✓ ≤{alt.maxTargetPct}%</span>
                                        </td>
                                      </tr>

                                </tbody>
                              </table>
                              <div style={{ marginTop:8, fontSize:10, color:"#475569", lineHeight:1.6, fontStyle:"italic" }}>
                                Projected utilization is estimated assuming ~50% CPU and ~60% memory usage on the current SKU. Actual projections use real metric data at runtime. Alternatives exceeding the {100 - (group.constraints.bufferPct ?? 20)}% target are filtered out.

                      </div>
                    </div>
                  );
                })}

                <button onClick={addGroup}
                  style={{ width:"100%", padding:"8px", borderRadius:8, border:"1px dashed rgba(99,102,241,0.3)", background:"none", color:"#6366f1", cursor:"pointer", fontSize:12, marginTop:4 }}>
                  + Add SKU Group
                </button>
              </div>
            )}
          </div>
        );
      }

      // ─── BACKTEST-ON-PUBLISH PREVIEW ─────────────────────────────────────
      // Runs the in-progress Hypothesis against a synthetic 30-day sample and shows the
      // projected hits / savings / noise profile inline in Step 6 before submission.
      function BacktestPreview({ formData }) {
        const [busy, setBusy]       = useState(false);
        const [result, setResult]   = useState(null);
        const [sampleSize, setSampleSize] = useState(300);
        const hasRules = (formData.ruleGroups || []).some(g => (g.conditions || []).length > 0);
        function run() {
          setBusy(true);
          setTimeout(() => {
            setResult(runBacktest(formData, sampleSize));
            setBusy(false);
          }, 600);
        }
        return (
          <div style={{ marginTop:16, padding:16, background:"rgba(139,92,246,0.05)", border:"1px solid rgba(139,92,246,0.2)", borderRadius:10 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
              <div style={{ fontSize:11, fontWeight:700, color:"#c4b5fd", textTransform:"uppercase", letterSpacing:"0.06em" }}>Backtest-on-Publish</div>
              <div style={{ fontSize:10, color:"#64748b" }}>Mandatory before submission — simulates 30 days of historical data</div>
            </div>
            <div style={{ fontSize:11, color:"#94a3b8", marginBottom:12, lineHeight:1.5 }}>
              Runs your rule logic against a synthetic sample of {sampleSize} resources drawn from the same CSP / resource-type cohort as production. Shows projected hits, projected 30-day savings, suppressions, and failure reasons so you can catch overly-tight or overly-loose thresholds before publishing.
            </div>
            <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:12 }}>
              <label style={{ fontSize:11, color:"#94a3b8" }}>Sample size</label>
              <select value={sampleSize} onChange={e => setSampleSize(Number(e.target.value))}
                style={{ padding:"6px 10px", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(139,92,246,0.2)", borderRadius:6, color:"#e2e8f0", fontSize:11 }}>
                <option value={100} style={{ background:"#0f1629" }}>100 resources</option>
                <option value={300} style={{ background:"#0f1629" }}>300 resources</option>
                <option value={1000} style={{ background:"#0f1629" }}>1,000 resources</option>
              </select>
              <button onClick={run} disabled={!hasRules || busy}
                style={{ padding:"7px 16px", borderRadius:6, border:"none", background: hasRules ? "linear-gradient(135deg, #8b5cf6, #6366f1)" : "rgba(100,116,139,0.2)", color:"#fff", cursor: hasRules && !busy ? "pointer":"not-allowed", fontSize:11, fontWeight:600, opacity: hasRules ? 1 : 0.5 }}>
                {busy ? "Simulating…" : "▶ Run Backtest"}
              </button>
              {!hasRules && <div style={{ fontSize:10, color:"#f59e0b" }}>⚠ Add at least one rule in Step 4 to enable backtest.</div>}
            </div>
            {result && (
              <div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:8, marginBottom:10 }}>
                  <div style={{ padding:10, background:"rgba(16,185,129,0.08)", border:"1px solid rgba(16,185,129,0.2)", borderRadius:6, textAlign:"center" }}>
                    <div style={{ fontSize:20, fontWeight:700, color:"#10b981" }}>{result.hits}</div>
                    <div style={{ fontSize:10, color:"#64748b" }}>matched</div>
                  </div>
                  <div style={{ padding:10, background:"rgba(245,158,11,0.08)", border:"1px solid rgba(245,158,11,0.2)", borderRadius:6, textAlign:"center" }}>
                    <div style={{ fontSize:20, fontWeight:700, color:"#f59e0b" }}>{result.failed}</div>
                    <div style={{ fontSize:10, color:"#64748b" }}>did not match</div>
                  </div>
                  <div style={{ padding:10, background:"rgba(239,68,68,0.08)", border:"1px solid rgba(239,68,68,0.2)", borderRadius:6, textAlign:"center" }}>
                    <div style={{ fontSize:20, fontWeight:700, color:"#fca5a5" }}>{result.suppressed}</div>
                    <div style={{ fontSize:10, color:"#64748b" }}>suppressed (savings ≤ 0)</div>
                  </div>
                  <div style={{ padding:10, background:"rgba(99,102,241,0.08)", border:"1px solid rgba(99,102,241,0.2)", borderRadius:6, textAlign:"center" }}>
                    <div style={{ fontSize:20, fontWeight:700, color:"#a5b4fc" }}>${Math.round(result.savings30d).toLocaleString()}</div>
                    <div style={{ fontSize:10, color:"#64748b" }}>projected 30d savings</div>
                  </div>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, fontSize:11, color:"#94a3b8" }}>
                  <div style={{ padding:"8px 10px", background:"rgba(15,22,41,0.6)", border:"1px solid rgba(99,102,241,0.1)", borderRadius:6 }}>
                    Hit rate: <strong style={{ color:"#e2e8f0" }}>{(result.hitRate * 100).toFixed(1)}%</strong>
                  </div>
                  <div style={{ padding:"8px 10px", background:"rgba(15,22,41,0.6)", border:"1px solid rgba(99,102,241,0.1)", borderRadius:6 }}>
                    Null-metric failures: <strong style={{ color:"#fbbf24" }}>{result.reasons.nullMetric}</strong> · Threshold misses: <strong style={{ color:"#94a3b8" }}>{result.reasons.thresholdNotMet}</strong>
                  </div>
                </div>
                {result.hitRate > 0.5 && (
                  <div style={{ marginTop:10, padding:"8px 12px", background:"rgba(245,158,11,0.08)", border:"1px solid rgba(245,158,11,0.25)", borderRadius:6, fontSize:11, color:"#fcd34d" }}>
                    ⚠ Hit rate is high ({(result.hitRate * 100).toFixed(1)}%). Consider tighter thresholds to avoid alert fatigue.
                  </div>
                )}
                {result.hitRate === 0 && (
                  <div style={{ marginTop:10, padding:"8px 12px", background:"rgba(239,68,68,0.08)", border:"1px solid rgba(239,68,68,0.25)", borderRadius:6, fontSize:11, color:"#fca5a5" }}>
                    ✕ No matches in {result.sampled} samples — rules may be too restrictive or reference unavailable metrics.
                  </div>
                )}
              </div>
            )}
          </div>
        );
      }

      function CreateRecommendationModal({ onClose, integrationState }) {
        const [step, setStep] = useState(1);
        const [formData, setFormData] = useState({ name:"", actionType:"rightsize", type:"cost_saving", category:"Compute", subcategory:"", description:"", csps:[], severity:"High", complexity:"Medium", resourceType:"", dataSources:[], sourceConfigs:{}, metrics:[], trendDays:14, ruleGroups:[], outerConnectors:[], trigger:"", suggestAlternativeSku:false, skuGroups:[], savingsPct:"", benefitDescription:"" });
        const [submittedRec, setSubmittedRec] = useState(null);

        const updateField = (field, value) => setFormData((prev) => ({ ...prev, [field]:value }));
        const toggleArrayField = (field, value) => setFormData((prev) => ({ ...prev, [field]:prev[field].includes(value)?prev[field].filter((v)=>v!==value):[...prev[field],value] }));
        const totalSteps = shouldSkipSkuMapping(formData.actionType) ? 5 : 6;

        function goNext() {
          if (shouldSkipSkuMapping(formData.actionType) && step === 4) { setStep(6); return; }
          if (step < 6) setStep(step + 1);
        }

          if (shouldSkipSkuMapping(formData.actionType) && step === 6) { setStep(4); return; }
          if (step > 1) setStep(step - 1);
          else onClose();
        }

        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:100, backdropFilter:"blur(4px)" }} onClick={onClose}>
            <div style={{ background:"linear-gradient(135deg, #0f1629, #1a1f3a)", border:"1px solid rgba(99,102,241,0.2)", borderRadius:16, width:step===3?780:680, maxHeight:"85vh", overflow:"auto", boxShadow:"0 24px 48px rgba(0,0,0,0.5)", transition:"width 0.25s ease" }} onClick={(e) => e.stopPropagation()}>
              <div style={{ padding:"20px 24px", borderBottom:"1px solid rgba(99,102,241,0.1)", display:"flex", alignItems:"center" }}>
                <div style={{ flex:1 }}>
                  <h3 style={{ margin:0, fontSize:16, fontWeight:700, color:"#f1f5f9" }}>Create New Recommendation</h3>
                  <div style={{ fontSize:11, color:"#64748b", marginTop:2 }}>Step {displayStep} of {totalSteps} · {selectedAction.label}</div>
                </div>
                <button onClick={onClose} style={{ background:"none", border:"none", color:"#64748b", cursor:"pointer", fontSize:18 }}>✕</button>
              </div>

              <div style={{ height:3, background:"rgba(99,102,241,0.08)" }}>
                <div style={{ height:"100%", width:`${(displayStep/totalSteps)*100}%`, background:"linear-gradient(90deg, #6366f1, #8b5cf6)", transition:"width 0.3s" }} />
              </div>

              <div style={{ padding:24 }}>
                {step === 1 && (
                  <div>
                    <StepTitle title="Basic Information" subtitle="Define the recommendation identity, classification, and action type" />
                    <FormField label="Recommendation Name" value={formData.name} onChange={(v) => updateField("name",v)} placeholder="e.g., VM / EC2 Instance Rightsizing" />
                    <FormField label="Description" value={formData.description} onChange={(v) => updateField("description",v)} placeholder="Describe what this recommendation does…" textarea />
                    <div style={{ marginBottom:16 }}>
                      <div style={{ fontSize:11, color:"#94a3b8", marginBottom:6, fontWeight:600 }}>Action Type <span style={{ color:"#ef4444" }}>*</span></div>
                      <div style={{ fontSize:10, color:"#475569", marginBottom:10 }}>Determines action delivery, savings model, and whether SKU mapping is needed. Canvas target actions are shown here; Basic review-only variants route through manual/ITSM approval.</div>
                      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(220px, 1fr))", gap:10 }}>
                        {ACTION_TYPES.map(at => {
                          const active = formData.actionType === at.id;
                          const executable = BASIC_EXECUTABLE_ACTIONS.includes(at.id);
                          return (
                            <div key={at.id} onClick={() => updateField("actionType", at.id)}
                              style={{ padding:"14px 16px", borderRadius:10, border:`2px solid ${active ? "#6366f1" : executable ? "rgba(99,102,241,0.12)" : "rgba(245,158,11,0.18)"}`,
                                background: active ? "rgba(99,102,241,0.1)" : executable ? "rgba(255,255,255,0.02)" : "rgba(245,158,11,0.035)",
                                cursor:"pointer", transition:"all 0.15s" }}>
                              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                                <span style={{ fontSize:18 }}>{at.icon}</span>

                                <span style={{ fontSize:9, padding:"2px 6px", borderRadius:4, background: executable ? "rgba(16,185,129,0.12)" : "rgba(245,158,11,0.12)", color: executable ? "#34d399" : "#fbbf24", marginLeft:"auto" }}>{at.tier}</span>
                                {active && <span style={{ marginLeft:"auto", fontSize:14, color:"#6366f1" }}>✓</span>}
                              </div>
                              <div style={{ fontSize:11, color:"#64748b", lineHeight:1.5, marginBottom:6 }}>{at.desc}</div>
                              <div style={{ fontSize:10, color: active ? "#818cf8" : "#475569", lineHeight:1.5, background: active ? "rgba(99,102,241,0.08)" : "transparent", padding: active ? "6px 8px" : "0", borderRadius:6 }}>
                                <strong>Savings:</strong> {at.savingsNote}
                              </div>
                            </div>

                      </div>
                    </div>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                      <FormSelect label="Type" value={formData.type} onChange={(v) => updateField("type",v)} options={RECOMMENDATION_TYPES.map((t) => ({ value:t, label:t.replace(/_/g," ").toUpperCase() }))} />

                {step === 2 && (
                  <div>
                    <StepTitle title="Cloud Providers & Classification" subtitle="Select the cloud provider this recommendation targets. Metrics in Step 3 are filtered to match your selection." />
                    <div style={{ marginBottom:16 }}>
                      <div style={{ fontSize:11, color:"#94a3b8", marginBottom:4, fontWeight:600 }}>Cloud Service Provider <span style={{ color:"#ef4444" }}>*</span></div>

                          );

                      </div>
                      {formData.csps.length === 0 && (
                        <div style={{ marginTop:8, fontSize:11, color:"#f59e0b" }}>⚠ Select a cloud provider to continue.</div>
                      )}
                      {formData.csps.length > 0 && (
                        <div style={{ marginTop:8, fontSize:11, color:"#64748b" }}>

                        </div>
                      )}
                    </div>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                      <FormSelect label="Problem Severity" value={formData.severity} onChange={(v) => updateField("severity",v)} options={SEVERITIES.map((s) => ({ value:s, label:s }))} />
                      <FormSelect label="Implementation Complexity" value={formData.complexity} onChange={(v) => updateField("complexity",v)} options={COMPLEXITIES.map((c) => ({ value:c, label:c }))} />
                    </div>
                  </div>
                )}

                {step === 3 && (
                  <Step3MetricPicker formData={formData} updateField={updateField} integrationState={integrationState || INITIAL_INTEGRATION_STATE} />
                )}

                {step === 4 && (
                  <div>
                    <StepTitle title="Rule Logic & Triggers" subtitle="Build conditions using metrics from Step 3. Use AND / OR to combine them, and groups for sub-expressions." />
                    <RuleBuilder formData={formData} updateField={updateField} />
                  </div>
                )}

                {step === 5 && isSkuMappingAction(formData.actionType) && (
                  <div>
                    <StepTitle title="SKU / Tier Mapping & Alternatives" subtitle="Define target SKUs, target tiers, or volume classes and the constraints that govern valid substitutions." />
                    <div style={{ padding:"8px 12px", background:"rgba(99,102,241,0.06)", border:"1px solid rgba(99,102,241,0.12)", borderRadius:8, fontSize:11, color:"#94a3b8", marginBottom:14, lineHeight:1.5 }}>
                      Product Catalog configuration only. End users will see the recommended SKU/tier and pricing snapshot in their advisory — not this group configuration.
                    </div>
                    <Step5SkuMapping formData={formData} updateField={updateField} />
                  </div>
                )}

                {step === 6 && (() => {
                  const isCostType = ["cost_saving"].includes(formData.type);
                  const isShutdown = formData.actionType === "shutdown";
                  const isRightsize = formData.actionType === "rightsize";
                  const isTierMove = formData.actionType === "tier_move";
                  const isDeleteOrphan = formData.actionType === "delete_orphan";
                  const isVolumeTypeSwap = formData.actionType === "volume_type_swap";
                  const isSchedule = formData.actionType === "schedule_pause";
                  const isModelRoute = formData.actionType === "model_route";
                  const isReviewOnly = ["commitment_review","tag_fix","budget_review","spot_review","license_review","commitment_purchase","spot_migrate","region_consolidate","license_byob"].includes(formData.actionType);
                  return (
                    <div>
                      <StepTitle title="Savings & Benefits" subtitle="Savings are calculated from the Product Catalog (list price). Only positive savings generate advisories." />

                      {/* Savings formula card — auto-configured */}

                        <div style={{ marginBottom:16, padding:16, background:"rgba(16,185,129,0.05)", border:"1px solid rgba(16,185,129,0.2)", borderRadius:10 }}>

                              savings_30d = <strong>current_sku_cost_per_hr</strong> × 720 hrs

                            </div>
                          )}
                          {isRightsize && (
                            <div style={{ fontFamily:"monospace", fontSize:13, color:"#34d399", lineHeight:2 }}>
                              savings_30d = (<strong>current_sku_cost_per_hr</strong> − <strong>recommended_sku_cost_per_hr</strong>) × 720 hrs
                              <div style={{ fontSize:10, color:"#64748b", marginTop:4, fontFamily:"inherit" }}>both costs from Product Catalog at list price · projection = 30 days</div>
                            </div>
                          )}
                          {isTierMove && (
                            <div style={{ fontFamily:"monospace", fontSize:13, color:"#34d399", lineHeight:2 }}>
                              savings_30d = (<strong>current_tier_rate</strong> − <strong>target_tier_rate</strong>) × usage_quantity
                              <div style={{ fontSize:10, color:"#64748b", marginTop:4, fontFamily:"inherit" }}>includes retrieval-fee guardrail and pricing snapshot from Product Catalog</div>
                            </div>
                          )}
                          {isDeleteOrphan && (
                            <div style={{ fontFamily:"monospace", fontSize:13, color:"#34d399", lineHeight:2 }}>

                <div>

                    const pct = totalNonAdvisory > 0 ? ((reason.count / totalNonAdvisory) * 100).toFixed(0) : 0;
                    const isExpanded = expandedReason === reason.code;

                    return (
                      <div key={reason.code} style={{ marginBottom:6 }}>

                          style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", background: isExpanded ? "rgba(245,158,11,0.06)" : "rgba(0,0,0,0.1)", border:`1px solid ${isExpanded ? "rgba(245,158,11,0.15)" : "rgba(255,255,255,0.04)"}`, borderRadius:8, cursor:"pointer", transition:"all 0.15s" }}>

                          <span style={{ fontSize:10, color:"#475569", minWidth:36, textAlign:"right" }}>{pct}%</span>
                          <span style={{ fontSize:10, color:"#64748b", transform: isExpanded ? "rotate(180deg)" : "rotate(0deg)", transition:"transform 0.2s" }}>▼</span>
                        </div>
                        {isExpanded && reason.breakdown.length > 0 && (
                          <div style={{ margin:"4px 0 4px 62px", padding:"8px 12px", background:"rgba(0,0,0,0.15)", borderRadius:6, border:"1px solid rgba(255,255,255,0.04)" }}>

                            <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>

                                  {b.label}: <strong>{b.count}</strong>
                                </span>
                              ))}
                            </div>

                        )}

                    );
                  })}
                </div>
              ) : <div style={{ fontSize:11, color:"#475569", padding:"16px 0", textAlign:"center" }}>No skipped resource data for this date</div>}
            </div>

            {/* ── Advisory List Table ── */}
            <div style={{ background:"rgba(15,22,41,0.8)", border:"1px solid rgba(16,185,129,0.12)", borderRadius:12, overflow:"hidden" }}>
              <div style={{ padding:"16px 20px", borderBottom:"1px solid rgba(99,102,241,0.06)", display:"flex", alignItems:"center", gap:12 }}>
                <div style={{ fontSize:12, fontWeight:600, color:"#6ee7b7", textTransform:"uppercase", letterSpacing:"0.06em" }}>
                  Advisories Created ({filteredAdvisories.length}{filteredAdvisories.length !== data.advisoryCount ? ` of ${data.advisoryCount}` : ""})
                </div>
                {(filterResType !== "All" || filterAdvType !== "All") && (
                  <span style={{ fontSize:10, color:"#475569", fontStyle:"italic" }}>
                    Filtered by: {filterResType !== "All" ? `resource=${filterResType}` : ""}{filterResType !== "All" && filterAdvType !== "All" ? ", " : ""}{filterAdvType !== "All" ? `type=${advTypeLabels[filterAdvType] || filterAdvType}` : ""}
                  </span>
                )}
                {filteredAdvisories.length > 0 && (
                  <span style={{ marginLeft:"auto", fontSize:11, color:"#10b981", fontWeight:600 }}>
                    Total Est. Savings: ₹ {filteredAdvisories.reduce((s, a) => s + a.savingsMonthly, 0).toLocaleString("en-IN")}/mo
                  </span>
                )}
              </div>
              {filteredAdvisories.length > 0 ? (
                <table style={{ width:"100%", borderCollapse:"collapse" }}>
                  <thead>
                    <tr>
                      {["Advisory ID","Resource","Resource Type","Recommendation","Advisory Type","Severity","Current SKU","Recommended SKU","Savings/mo"].map(h => (
                        <th key={h} style={{ padding:"10px 14px", textAlign:"left", fontSize:10, fontWeight:600, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.06em", background:"rgba(10,14,26,0.5)" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {filteredAdvisories.map((adv, i) => (
                      <tr key={adv.id} style={{ borderTop:"1px solid rgba(99,102,241,0.04)" }}>
                        <td style={{ padding:"10px 14px", fontSize:11, color:"#a5b4fc", fontFamily:"monospace", fontWeight:600 }}>{adv.id}</td>
                        <td style={{ padding:"10px 14px", fontSize:11, color:"#e2e8f0", fontFamily:"monospace" }}>{adv.resourceId}</td>
                        <td style={{ padding:"10px 14px", fontSize:11, color:"#94a3b8" }}>{adv.resourceIcon} {adv.resourceLabel}</td>
                        <td style={{ padding:"10px 14px" }}>
                          <div style={{ fontSize:11, color:"#e2e8f0" }}>{adv.recName}</div>
                          <div style={{ fontSize:9, color:"#6366f1", fontFamily:"monospace" }}>{adv.recId}</div>

                        <td style={{ padding:"10px 14px" }}>

                          </span>

                        <td style={{ padding:"10px 14px" }}>

                            {adv.severity}
                          </span>
                        </td>
                        <td style={{ padding:"10px 14px", fontSize:11, color:"#64748b", fontFamily:"monospace" }}>{adv.currentSku}</td>

                        <td style={{ padding:"10px 14px" }}>
                          <span style={{ fontSize:12, fontWeight:700, color:"#10b981", fontFamily:"monospace" }}>₹ {adv.savingsMonthly.toLocaleString("en-IN")}</span>
