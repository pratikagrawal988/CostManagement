              ) : (
                <div style={{ padding:"32px 0", textAlign:"center", color:"#475569", fontSize:12 }}>
                  {data.advisoryCount === 0 ? "No advisories were generated for this customer on the selected date." : "No advisories match the current filter combination."}
                </div>
              )}
            </div>
          </div>
        );
      }

      // ─── BATCH SIMULATION VIEW ─────────────────────────────────────────────
      function BatchSimulationView() {
        const [running, setRunning] = useState(false);
        const [progress, setProgress] = useState(0);
        const [results, setResults] = useState(null);
        const [expandedRec, setExpandedRec] = useState(null);
        const [filterResult, setFilterResult] = useState("all");

        function runBatch() {
          setRunning(true); setProgress(0); setResults(null);
          const allRecs = [...SAMPLE_RECOMMENDATIONS];
          const total = allRecs.length;
          const batchResults = [];
          let idx = 0;

          function processNext() {
            if (idx >= total) {
              setResults(batchResults);
              setRunning(false);
              return;
            }
            const rec = allRecs[idx];
            const rtKey = resolveResourceType(rec);
            const mockRows = MOCK_DATA_TEMPLATES[rtKey] || MOCK_DATA_TEMPLATES.vm;
            const rows = mockRows.map(row => {
              const m = row.metrics || {};
              const vals = Object.values(m).map(v => typeof v === "number" ? v : parseFloat(v)).filter(v => !isNaN(v));
              const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 50;
              const allFamilies = Object.values(SKU_CATALOG).flat();
              const sku = allFamilies.flatMap(f => f.skus).find(s => s.type === row.currentSku);
              const costPerHr = sku?.costPerHr ?? 0.096;
              const isCostRec = rec.type === "cost_saving";

              let triggers = false;
              if (rec.actionType === "shutdown") triggers = avg < 10 || (m.Invocations === 0) || (m.AssociationStatus === "disassociated") || (m.AssociatedVolumeExists === false);
              else if (rec.actionType === "rightsize") triggers = avg < 30 || rec.type === "security" || rec.type === "governance";
              else triggers = avg < 25 || rec.type === "security" || rec.type === "governance";

              const pct = parseFloat(rec.savingsPct) || 40;
              let savings = rec.actionType === "shutdown" ? costPerHr * 720 : costPerHr * (pct/100) * 720;
              if (!isCostRec) savings = 0;

              return {
                resourceId: row.resourceId, triggers, advisory: triggers && (isCostRec ? savings > 0 : true),
                savings30d: isCostRec && triggers ? savings : 0,
              };
            });

            const checked = rows.length;
            const generated = rows.filter(r => r.advisory).length;
            const suppressed = rows.filter(r => !r.advisory).length;
            const totalSavings = rows.reduce((s,r) => s + (r.savings30d || 0), 0);

            batchResults.push({
              recId: rec.id, recName: rec.name, actionType: rec.actionType,
              type: rec.type, severity: rec.severity, status: rec.status,
              category: rec.category, subcategory: rec.subcategory,
              resourceType: rtKey, checked, generated, suppressed,
              totalSavings, rows,
              pass: rec.status === "draft" ? "n/a" : generated > 0,
            });

            idx++;
            setProgress(Math.round((idx / total) * 100));
            setTimeout(processNext, 40);
          }
          setTimeout(processNext, 200);
        }

        const sevColors = { Top:"#ef4444", High:"#f59e0b", Medium:"#6366f1", Low:"#22c55e" };
        const typeColors = { cost_saving:"#10b981", performance:"#6366f1", security:"#ef4444", governance:"#f59e0b", saas_specialized:"#8b5cf6" };
        const statusBadge = s => ({ active:"#10b981", draft:"#64748b", pending_approval:"#f59e0b", disabled:"#ef4444" }[s] || "#64748b");

        const filteredResults = results ? (filterResult === "all" ? results : filterResult === "pass" ? results.filter(r=>r.pass===true) : filterResult === "fail" ? results.filter(r=>r.pass===false) : results.filter(r=>r.pass==="n/a")) : [];

        const summary = results ? {
          total: results.length,
          pass: results.filter(r=>r.pass===true).length,
          fail: results.filter(r=>r.pass===false).length,
          na: results.filter(r=>r.pass==="n/a").length,
          totalChecked: results.reduce((s,r)=>s+r.checked,0),
          totalGenerated: results.reduce((s,r)=>s+r.generated,0),
          totalSuppressed: results.reduce((s,r)=>s+r.suppressed,0),
          totalSavings: results.reduce((s,r)=>s+r.totalSavings,0),
          byType: Object.entries(results.reduce((acc,r) => { acc[r.type] = (acc[r.type]||0)+1; return acc; }, {})),
          byRT: Object.entries(results.reduce((acc,r) => { acc[r.resourceType] = (acc[r.resourceType]||0)+1; return acc; }, {})).sort((a,b) => b[1]-a[1]),
          bySeverity: Object.entries(results.reduce((acc,r) => { acc[r.severity] = (acc[r.severity]||0)+1; return acc; }, {})),
        } : null;

        return (
          <div>
            <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:20 }}>
              <div>
                <h2 style={{ fontSize:20, fontWeight:700, color:"#f1f5f9", margin:"0 0 4px" }}>Batch Simulation</h2>
                <p style={{ fontSize:12, color:"#64748b", margin:0 }}>Run all {SAMPLE_RECOMMENDATIONS.length} advisory rules against mock data for {Object.keys(MOCK_DATA_TEMPLATES).length} resource types. Validates rule logic, data completeness, and savings calculations.</p>
              </div>
              <button onClick={runBatch} disabled={running}
                style={{ padding:"10px 24px", borderRadius:9, border:"none", background: running ? "rgba(99,102,241,0.4)" : "linear-gradient(135deg, #6366f1, #8b5cf6)", color:"#fff", cursor: running?"default":"pointer", fontSize:13, fontWeight:700, flexShrink:0 }}>
                {running ? `Running… ${progress}%` : "▶ Run All Simulations"}
              </button>
            </div>

            {running && (
              <div style={{ marginBottom:20, borderRadius:8, overflow:"hidden", background:"rgba(255,255,255,0.05)", height:6 }}>
                <div style={{ width:`${progress}%`, height:"100%", background:"linear-gradient(90deg, #6366f1, #8b5cf6)", transition:"width 0.15s" }} />
              </div>
            )}

            {summary && (
              <div>
                {/* Summary cards */}
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12, marginBottom:20 }}>
                  {[
                    { label:"Total Rules Tested", val:summary.total, color:"#6366f1" },
                    { label:"Pass (generated advisories)", val:summary.pass, color:"#10b981" },
                    { label:"Fail (zero advisories)", val:summary.fail, color:"#ef4444" },
                    { label:"N/A (draft/not runnable)", val:summary.na, color:"#64748b" },
                  ].map(c => (
                    <div key={c.label} style={{ padding:16, background:`${c.color}10`, border:`1px solid ${c.color}25`, borderRadius:10, textAlign:"center" }}>
                      <div style={{ fontSize:28, fontWeight:700, color:c.color }}>{c.val}</div>
                      <div style={{ fontSize:11, color:"#94a3b8", marginTop:4 }}>{c.label}</div>
                    </div>
                  ))}
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12, marginBottom:20 }}>
                  {[
                    { label:"Resources Checked", val:fmt(summary.totalChecked), color:"#6366f1" },
                    { label:"Advisories Generated", val:fmt(summary.totalGenerated), color:"#10b981" },
                    { label:"Suppressed", val:fmt(summary.totalSuppressed), color:"#f59e0b" },
                    { label:"Est. Monthly Savings", val:`$${fmt(Math.round(summary.totalSavings))}`, color:"#22c55e" },
                  ].map(c => (
                    <div key={c.label} style={{ padding:14, background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:10, textAlign:"center" }}>
                      <div style={{ fontSize:20, fontWeight:700, color:c.color }}>{c.val}</div>
                      <div style={{ fontSize:10, color:"#64748b", marginTop:4 }}>{c.label}</div>
                    </div>
                  ))}
                </div>

                {/* Coverage breakdowns */}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14, marginBottom:20 }}>
                  <div style={{ padding:16, background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:10 }}>
                    <div style={{ fontSize:12, fontWeight:600, color:"#94a3b8", marginBottom:10 }}>By Resource Type ({summary.byRT.length})</div>
                    {summary.byRT.map(([rt, count]) => (
                      <div key={rt} style={{ display:"flex", justifyContent:"space-between", padding:"3px 0", fontSize:11 }}>
                        <span style={{ color:"#cbd5e1" }}>{rt}</span>
                        <span style={{ color:"#6366f1", fontWeight:600 }}>{count}</span>
                      </div>
                    ))}
                  </div>
                  <div style={{ padding:16, background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:10 }}>
                    <div style={{ fontSize:12, fontWeight:600, color:"#94a3b8", marginBottom:10 }}>By Type</div>
                    {summary.byType.map(([t, count]) => (
                      <div key={t} style={{ display:"flex", justifyContent:"space-between", padding:"3px 0", fontSize:11 }}>
                        <span style={{ color:typeColors[t] || "#cbd5e1" }}>{t}</span>
                        <span style={{ fontWeight:600, color:"#cbd5e1" }}>{count}</span>
                      </div>
                    ))}
                  </div>
                  <div style={{ padding:16, background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:10 }}>
                    <div style={{ fontSize:12, fontWeight:600, color:"#94a3b8", marginBottom:10 }}>By Severity</div>
                    {summary.bySeverity.map(([s, count]) => (
                      <div key={s} style={{ display:"flex", justifyContent:"space-between", padding:"3px 0", fontSize:11 }}>
                        <span style={{ color:sevColors[s] || "#cbd5e1" }}>{s}</span>
                        <span style={{ fontWeight:600, color:"#cbd5e1" }}>{count}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Filter tabs */}
                <div style={{ display:"flex", gap:8, marginBottom:14 }}>
                  {[{id:"all",label:`All (${summary.total})`},{id:"pass",label:`Pass (${summary.pass})`},{id:"fail",label:`Fail (${summary.fail})`},{id:"na",label:`N/A (${summary.na})`}].map(f => (
                    <button key={f.id} onClick={() => setFilterResult(f.id)}
                      style={{ padding:"6px 14px", borderRadius:7, border: filterResult===f.id ? "1px solid rgba(99,102,241,0.4)" : "1px solid rgba(255,255,255,0.08)", background: filterResult===f.id ? "rgba(99,102,241,0.15)" : "transparent", color: filterResult===f.id ? "#a5b4fc" : "#64748b", cursor:"pointer", fontSize:11, fontWeight:600 }}>
                      {f.label}
                    </button>
                  ))}
                </div>

                {/* Results table */}
                <div style={{ borderRadius:10, border:"1px solid rgba(255,255,255,0.08)", overflow:"hidden" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
                    <thead>
                      <tr style={{ background:"rgba(255,255,255,0.04)" }}>
                        {["ID","Recommendation","Type","Severity","Resource","Status","Checked","Advised","Savings","Result"].map(h => (
                          <th key={h} style={{ padding:"10px 10px", textAlign:"left", color:"#64748b", fontWeight:600, borderBottom:"1px solid rgba(255,255,255,0.06)", whiteSpace:"nowrap" }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {filteredResults.map((r, i) => (
                        <React.Fragment key={r.recId}>
                          <tr onClick={() => setExpandedRec(expandedRec === r.recId ? null : r.recId)}
                            style={{ cursor:"pointer", borderBottom:"1px solid rgba(255,255,255,0.04)", background: expandedRec === r.recId ? "rgba(99,102,241,0.05)" : (i%2===0 ? "transparent" : "rgba(255,255,255,0.015)") }}>
                            <td style={{ padding:"8px 10px", color:"#94a3b8", fontFamily:"monospace" }}>{r.recId}</td>
                            <td style={{ padding:"8px 10px", color:"#e2e8f0", fontWeight:500, maxWidth:220, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.recName}</td>
                            <td style={{ padding:"8px 10px" }}><span style={{ color:typeColors[r.type]||"#94a3b8", fontSize:10 }}>{r.type}</span></td>
                            <td style={{ padding:"8px 10px" }}><span style={{ color:sevColors[r.severity], fontWeight:600 }}>{r.severity}</span></td>
                            <td style={{ padding:"8px 10px", color:"#94a3b8" }}>{r.resourceType}</td>
                            <td style={{ padding:"8px 10px" }}><span style={{ display:"inline-block", padding:"2px 8px", borderRadius:4, fontSize:10, fontWeight:600, background:`${statusBadge(r.status)}20`, color:statusBadge(r.status) }}>{r.status}</span></td>
                            <td style={{ padding:"8px 10px", color:"#cbd5e1", textAlign:"right" }}>{r.checked}</td>
                            <td style={{ padding:"8px 10px", color:"#10b981", fontWeight:600, textAlign:"right" }}>{r.generated}</td>
                            <td style={{ padding:"8px 10px", color:"#22c55e", textAlign:"right" }}>{r.totalSavings > 0 ? `$${r.totalSavings.toFixed(0)}` : "—"}</td>
                            <td style={{ padding:"8px 10px" }}>
                              <span style={{ display:"inline-block", padding:"2px 10px", borderRadius:4, fontSize:10, fontWeight:700, background: r.pass === true ? "#10b98120" : r.pass === false ? "#ef444420" : "#64748b20", color: r.pass === true ? "#10b981" : r.pass === false ? "#ef4444" : "#64748b" }}>
                                {r.pass === true ? "PASS" : r.pass === false ? "FAIL" : "N/A"}
                              </span>
                            </td>
                          </tr>
                          {expandedRec === r.recId && (
                            <tr>
                              <td colSpan={10} style={{ padding:"12px 20px", background:"rgba(99,102,241,0.03)", borderBottom:"1px solid rgba(99,102,241,0.1)" }}>
                                <div style={{ fontSize:11, color:"#94a3b8", marginBottom:6 }}>Resource-level results:</div>
                                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(280px,1fr))", gap:8 }}>
                                  {r.rows.map((row, ri) => (
                                    <div key={ri} style={{ padding:8, background:"rgba(255,255,255,0.03)", borderRadius:6, border:`1px solid ${row.advisory ? "rgba(16,185,129,0.2)" : "rgba(255,255,255,0.06)"}` }}>
                                      <div style={{ fontSize:10, fontFamily:"monospace", color: row.advisory ? "#10b981" : "#64748b", marginBottom:2 }}>{row.advisory ? "✓ ADVISORY" : "✗ Suppressed"}</div>
                                      <div style={{ fontSize:11, color:"#e2e8f0" }}>{row.resourceId}</div>
                                      {row.savings30d > 0 && <div style={{ fontSize:10, color:"#22c55e", marginTop:2 }}>Savings: ${row.savings30d.toFixed(2)}/mo</div>}
                                    </div>
                                  ))}
                                </div>
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {!results && !running && (
              <div style={{ textAlign:"center", padding:60, color:"#475569" }}>
                <div style={{ fontSize:48, marginBottom:16 }}>🧪</div>
                <div style={{ fontSize:14, fontWeight:600, marginBottom:6 }}>No simulation results yet</div>
                <div style={{ fontSize:12 }}>Click "Run All Simulations" to test {SAMPLE_RECOMMENDATIONS.length} advisory rules against mock data for {Object.keys(MOCK_DATA_TEMPLATES).length} resource types.</div>
              </div>
            )}
          </div>
        );
      }

      function RecommendationEngine() {
        const [activeView, setActiveView]       = useState("dashboard");
        const [integrationState, setIntegrationState] = useState(INITIAL_INTEGRATION_STATE);
        const [selectedRec, setSelectedRec]     = useState(null);
        const [searchQuery, setSearchQuery]     = useState("");
        const [filterCategory, setFilterCategory] = useState("All");
        const [filterCSP, setFilterCSP]         = useState("All");
        const [filterType, setFilterType]       = useState("All");
        const [filterStatus, setFilterStatus]   = useState("All");
        const [showCreateModal, setShowCreateModal] = useState(false);
        const [customRecs, setCustomRecs]       = useState(() => loadCustomRecs());

        const ALL_RECS = useMemo(() => {
          const customIds = new Set(customRecs.map(r => r.id));
          return [...customRecs, ...SAMPLE_RECOMMENDATIONS.filter(r => !customIds.has(r.id))];
        }, [customRecs]);

        const filteredRecs = useMemo(() => ALL_RECS.filter((r) => {
          if (searchQuery && !r.name.toLowerCase().includes(searchQuery.toLowerCase()) && !r.id.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          if (filterCategory !== "All" && r.category !== filterCategory) return false;
          if (filterCSP !== "All" && !r.csps.includes(filterCSP)) return false;
          if (filterType !== "All" && r.type !== filterType) return false;
          if (filterStatus !== "All" && r.status !== filterStatus) return false;
          return true;
        }), [ALL_RECS, searchQuery, filterCategory, filterCSP, filterType, filterStatus]);

        const totalHits   = ALL_RECS.reduce((s,r) => s+(r.hitsLast30d||0), 0);
        const totalFails  = ALL_RECS.reduce((s,r) => s+(r.failedLast30d||0), 0);
        const activeCount = ALL_RECS.filter((r) => r.status==="active").length;
        const draftCount  = ALL_RECS.filter((r) => r.status==="draft" || r.status==="pending_approval").length;

        const NAV_ITEMS = [
          { id:"dashboard",       label:"Dashboard",            icon:"◻" },
          { id:"recommendations", label:"Recommendations",       icon:"⚙" },
          { id:"advisories",      label:"Production Monitor",    icon:"📊" },
          { id:"data_sources",    label:"Connection Health",     icon:"🔌" },
          { id:"aggregations",    label:"Aggregation Engine",    icon:"Σ" },
          { id:"failures",        label:"Failure Analysis",      icon:"⚠" },
          { id:"catalog",         label:"Product Catalog",       icon:"📦" },
          { id:"rec_library",     label:"Global Rec Library",    icon:"📚" },
          { id:"basic_readiness", label:"Basic Readiness",       icon:"🧭" },
          { id:"integrations",    label:"Integrations",          icon:"🔗" },
          { id:"batch_sim",       label:"Batch Simulation",      icon:"🧪" },
          { id:"customer_view",   label:"Customer Advisories",   icon:"👤" },
        ];

        return (
          <div style={{ fontFamily:"'IBM Plex Sans', 'SF Pro Display', -apple-system, sans-serif", background:"#0a0e1a", color:"#e2e8f0", minHeight:"100vh", fontSize:"13px" }}>
            {/* Top bar */}
            <div style={{ background:"linear-gradient(135deg, #0f1629 0%, #1a1f3a 100%)", borderBottom:"1px solid rgba(99,102,241,0.15)", padding:"0 24px", display:"flex", alignItems:"center", height:56, gap:16, position:"sticky", top:0, zIndex:50 }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <div style={{ width:32, height:32, borderRadius:8, background:"linear-gradient(135deg, #6366f1, #8b5cf6)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:16, fontWeight:700 }}>⚡</div>
                <div>
                  <div style={{ fontWeight:700, fontSize:15, letterSpacing:"-0.02em", color:"#f1f5f9" }}>FinOps Recommendation Engine</div>
                  <div style={{ fontSize:10, color:"#64748b", letterSpacing:"0.05em", textTransform:"uppercase" }}>Internal Configuration Console</div>
                </div>
              </div>
              <div style={{ flex:1 }} />
              <NavPill items={NAV_ITEMS} active={activeView} onChange={setActiveView} />
              <div style={{ width:1, height:24, background:"rgba(99,102,241,0.2)" }} />
              <div style={{ fontSize:11, color:"#64748b" }}>v3.0.0</div>
            </div>

            {/* Content */}
            <div style={{ padding:"24px 24px 48px" }}>
              {activeView==="dashboard" && <DashboardView totalHits={totalHits} totalFails={totalFails} activeCount={activeCount} draftCount={draftCount} recs={ALL_RECS} onNavigate={setActiveView} />}
              {activeView==="recommendations" && (
                <RecommendationsView
                  recs={filteredRecs} search={searchQuery} onSearch={setSearchQuery}
                  filterCategory={filterCategory} onFilterCategory={setFilterCategory}
                  filterCSP={filterCSP}           onFilterCSP={setFilterCSP}
                  filterType={filterType}         onFilterType={setFilterType}
                  filterStatus={filterStatus}     onFilterStatus={setFilterStatus}
                  onSelect={setSelectedRec}       selectedRec={selectedRec}
                  onCreate={() => setShowCreateModal(true)}
                />
              )}
              {activeView==="advisories"    && <ProductionMonitorView />}
              {activeView==="data_sources"  && <DataSourcesView />}
              {activeView==="aggregations"  && <AggregationEngineView />}
              {activeView==="failures"      && <FailureAnalysisView failures={FAILURE_REASONS} />}
              {activeView==="catalog"       && <ProductCatalogView />}
              {activeView==="rec_library"   && <RecommendationLibraryView onImport={() => setCustomRecs(loadCustomRecs())} />}
              {activeView==="basic_readiness" && <BasicReadinessView />}
              {activeView==="integrations"  && <IntegrationsView integrationState={integrationState} setIntegrationState={setIntegrationState} />}
              {activeView==="batch_sim"    && <BatchSimulationView />}
              {activeView==="customer_view" && <CustomerAdvisoryView />}
            </div>

            {showCreateModal && <CreateRecommendationModal integrationState={integrationState} onClose={() => { setCustomRecs(loadCustomRecs()); setShowCreateModal(false); }} />}
          </div>
        );
      }

      // ─── ERROR BOUNDARY ──────────────────────────────────────────────────
      class ErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { hasError:false, error:null, errorInfo:null }; }
        static getDerivedStateFromError(error) { return { hasError:true, error }; }
        componentDidCatch(error, errorInfo) { this.setState({ errorInfo }); console.error("React Error Boundary:", error, errorInfo); }
        render() {
          if (this.state.hasError) {
            return React.createElement("div", { style:{ padding:40, background:"#0a0e1a", color:"#fca5a5", fontFamily:"monospace", minHeight:"100vh" } },
              React.createElement("h1", { style:{ color:"#ef4444" } }, "Application Error"),
              React.createElement("pre", { style:{ whiteSpace:"pre-wrap", fontSize:13, lineHeight:1.6, color:"#fbbf24" } }, String(this.state.error)),
              React.createElement("pre", { style:{ whiteSpace:"pre-wrap", fontSize:11, color:"#94a3b8", marginTop:16 } }, this.state.errorInfo?.componentStack || "")
            );
          }
          return this.props.children;
        }
      }

      // ─── MOUNT ───────────────────────────────────────────────────────────
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<ErrorBoundary><RecommendationEngine /></ErrorBoundary>);
    </script>
  </body>
</html>
