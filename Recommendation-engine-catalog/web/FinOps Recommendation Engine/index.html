      // ─── PERSISTENCE: LOCALSTORAGE-BACKED RULE REGISTRY ──────────────────
      // The Basic engine persists user-authored Hypotheses into a registry. This SPA uses
      // localStorage as a mock backend; the prod implementation writes to the Advisory Service
      // DB and emits CREATE / UPDATE / PUBLISH events on the advisory bus.
      const LS_KEY_CUSTOM_RECS = "cxp_basic_custom_recs_v1";
      function loadCustomRecs() {
        try {
          const raw = window.localStorage.getItem(LS_KEY_CUSTOM_RECS);
          if (!raw) return [];
          const arr = JSON.parse(raw);
          return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
      }
      function saveCustomRecs(recs) {
        try { window.localStorage.setItem(LS_KEY_CUSTOM_RECS, JSON.stringify(recs || [])); } catch (e) {}
      }
      function appendCustomRec(rec) {
        const all = loadCustomRecs();
        const idx = all.findIndex(r => r.id === rec.id);
        if (idx >= 0) all[idx] = rec; else all.push(rec);
        saveCustomRecs(all);
        return all;
      }

      const CATALOG_CSV_PATH = "data/basic-recommendation-catalog-global.csv";

      function parseCsv(text) {
        const rows = [];
        let row = [], cell = "", inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i], next = text[i+1];
          if (ch === '"' && inQuotes && next === '"') { cell += '"'; i++; continue; }
          if (ch === '"') { inQuotes = !inQuotes; continue; }
          if (ch === "," && !inQuotes) { row.push(cell); cell = ""; continue; }
          if ((ch === "\n" || ch === "\r") && !inQuotes) {
            if (ch === "\r" && next === "\n") i++;
            row.push(cell); cell = "";
            if (row.some(v => v !== "")) rows.push(row);
            row = [];
            continue;
          }
          cell += ch;
        }
        if (cell || row.length) { row.push(cell); rows.push(row); }
        const headers = rows.shift() || [];
        return rows.map(cols => Object.fromEntries(headers.map((h, i) => [h, cols[i] || ""])));
      }

      function catalogActionId(type) {
        const map = {
          Shutdown:"shutdown",
          RightsizeSku:"rightsize",
          SchedulePause:"schedule_pause",
          TierMove:"tier_move",
          DeleteOrphan:"delete_orphan",
          VolumeTypeSwap:"volume_type_swap",
          CommitmentReview:"commitment_review",
          TagFix:"tag_fix",
          BudgetReview:"budget_review",
          ModelRoute:"model_route",
          SpotReview:"spot_review",
          LicenseReview:"license_review",
        };
        return map[type] || String(type || "").replace(/[A-Z]/g, m => "_" + m.toLowerCase()).replace(/^_/, "");
      }

      function resourceTypeForCatalogRow(row) {
        const sub = row.sub_category || "";
        if (["VM","Dev/Test","ASG/VMSS/MIG","Spot"].includes(sub)) return "vm";
        if (sub === "GPU") return "gpu_compute";
        if (sub === "Kubernetes") return "k8s_node";
        if (sub === "Functions") return "serverless";
        if (sub === "Block") return "block_disk";
        if (sub === "Object") return "object_storage";
        if (sub === "Snapshots" || sub === "AI Artifacts") return "snapshot_backup";
        if (sub === "RDS/SQL") return "rds";
        if (sub === "NoSQL") return "nosql_db";
        if (sub === "Cache") return "cache_redis";
        if (sub === "Warehouse") return "data_warehouse";
        if (["NAT","Load Balancer","IP","CDN"].includes(sub)) return "network";
        if (sub === "Commitments") return "commitment_portfolio";
        if (["Tokens","Model Routing","Inference","Context","Embeddings","RAG","Agents","Rate Limits","Guardrails"].includes(sub)) return "ai_usage";
        if (["Tags","Budgets"].includes(sub)) return "governance_scope";
        if (["Metrics","Logs"].includes(sub)) return "observability_signal";
        return "";
      }

      function formulaForCatalogRow(row) {
        const action = catalogActionId(row.recommendation_type);
        if (action === "shutdown") return "source_rate × idle_hours";
        if (action === "rightsize") return "(source_rate − target_rate) × usage_hours";
        if (action === "schedule_pause") return "source_rate × scheduled_off_hours";
        if (action === "tier_move") return "(source_tier_rate − target_tier_rate) × eligible_usage − retrieval/early_delete_cost";
        if (action === "delete_orphan") return "orphaned_resource_rate × retention_window";
        if (action === "volume_type_swap") return "(source_volume_rate − target_volume_rate) × provisioned_capacity";
        if (action === "model_route") return "source_model_token_cost − target_model_token_cost";
        if (action === "commitment_review") return "provider_commitment_estimate reconciled against eligible spend";
        if (action === "spot_review") return "(on_demand_rate − spot_rate) × eligible_hours";
        if (action === "budget_review") return "forecast_spend − budget_threshold";
        return row.product_catalog_dependency || "N/A";
      }

      function dataSourcesForCatalogRow(row) {
        const txt = `${row.native_or_saas_data_source || ""} ${row.source_provider || ""}`.toLowerCase();
        const ds = [];
        if (txt.includes("cloudwatch") || txt.includes("azure monitor") || txt.includes("monitoring") || txt.includes("advisor") || txt.includes("recommender")) ds.push("csp_api");
        if (txt.includes("cur") || txt.includes("billing") || txt.includes("cost")) ds.push("billing_api");
        if (txt.includes("kubecost") || txt.includes("opencost") || row.category === "Containers") ds.push("k8s_api");
        if (txt.includes("saas") || txt.includes("datadog") || txt.includes("densify") || txt.includes("cloudhealth") || txt.includes("cloudability") || row.provider_scope === "SaaS") ds.push("third_party");
        if (row.provider_scope === "FinOps") ds.push("finops_obs");
        return Array.from(new Set(ds.length ? ds : ["csp_api"]));
      }

      function simulateCatalogTemplate(row) {
        const actionId = catalogActionId(row.recommendation_type);
        const metrics = (row.primary_metrics || "").split(";").map(s => s.trim()).filter(Boolean);
        const thresholds = (row.baseline_thresholds || "").split(";").map(s => s.trim()).filter(Boolean);
        const gaps = [];
        if (!ACTION_TYPES.some(a => a.id === actionId)) gaps.push(`Action type not exposed: ${row.recommendation_type}`);
        if (!resourceTypeForCatalogRow(row)) gaps.push(`No resource type mapping for sub-category: ${row.sub_category}`);
        if (metrics.length === 0) gaps.push("No metrics configured");
        if (thresholds.length === 0) gaps.push("No thresholds configured");
        if (!row.product_catalog_dependency) gaps.push("Missing Product Catalog dependency");
        if (!row.compatibility_group) gaps.push("Missing compatibility group");
        if (["rightsize","tier_move","volume_type_swap","model_route"].includes(actionId) && !row.compatibility_group) gaps.push("Movement action lacks compatibility group");
        return {
          actionId,
          resourceType: resourceTypeForCatalogRow(row),
          metrics,
          thresholds,
          dataSources:dataSourcesForCatalogRow(row),
          formula:formulaForCatalogRow(row),
          gaps,
          status:gaps.length ? "Needs UI/contract work" : "Configurable",
        };
      }

      function templateToRecommendation(row) {
        const sim = simulateCatalogTemplate(row);
        return {
          id: row.id,
          name: row.recommendation_name,
          actionType: sim.actionId,
          type: row.recommendation_type === "TagFix" ? "governance" : "cost_saving",
          category: row.category === "Containers" ? "Container" : row.category,
          subcategory: row.sub_category,
          csps: row.provider_scope === "AWS" ? ["aws"] : row.provider_scope === "Azure" ? ["azure"] : row.provider_scope === "GCP" ? ["gcp"] : ["aws","azure","gcp"],
          severity: row.priority === "P0" ? "Top" : "High",
          complexity: row.implementation_complexity,
          savingsPct: row.end_user_value,
          status:"draft",
          rulesCount: sim.thresholds.length,
          hitsLast30d:0,
          failedLast30d:0,
          suppressedLast30d:0,
          lastRun:null,
          description:row.recommendation_definition || `Imported from Basic catalog. Source: ${row.source_provider}. Guardrails: ${row.notes_and_guardrails}`,
          trendDays: parseInt(row.lookback_window, 10) || 14,
          metrics: sim.metrics,
          dataSources: sim.dataSources,
          triggers: row.baseline_thresholds,
          savingsFormula: sim.formula,
          aggregations:["avg","p95","max"],
          compatibilityGroup: row.compatibility_group,

      // ─── BASIC EVALUATOR ─────────────────────────────────────────────────
      // Deterministic rule-group interpreter. Walks the formData.ruleGroups array and
      // evaluates each condition against a resource record. Supports: avg/peak/p95/min
      // aggregation hints (matched by metric name substring), operators <,≤,>,≥,=,≠,
      // AND/OR combination within a group, AND/OR outer connectors between groups.
      // Returns { match:boolean, evidence:[{metric,value,op,threshold,passed}] }.
      function resolveMetricValue(record, metricName) {
        if (!record || !metricName) return null;
        const m = String(metricName).toLowerCase();
        const direct = record.metrics && (record.metrics[metricName] ?? record.metrics[m]);
        if (direct !== undefined && direct !== null) return Number(direct);
        // heuristic aliasing for common metric names → template fields
        const keys = Object.keys(record.metrics || {});
        const hit = keys.find(k => m.includes(k.toLowerCase()) || k.toLowerCase().includes(m));
        return hit ? Number(record.metrics[hit]) : null;
      }
      function compareOp(op, value, threshold) {
        const v = Number(value), t = Number(threshold);
        if (Number.isNaN(v) || Number.isNaN(t)) return false;
        switch (op) {
          case "<":  return v <  t;
          case "<=": case "≤": return v <= t;
          case ">":  return v >  t;
          case ">=": case "≥": return v >= t;
          case "=":  case "==": return v === t;
          case "!=": case "≠": return v !== t;
          default: return false;
        }
      }
      function evaluateRuleGroups(record, ruleGroups, outerConnectors) {
        if (!ruleGroups || ruleGroups.length === 0) return { match:false, evidence:[], reason:"no rule groups" };
        const evidence = [];
        const groupResults = ruleGroups.map(group => {
          if (!group.conditions || group.conditions.length === 0) return true;
          const condResults = group.conditions.map(c => {
            const val = resolveMetricValue(record, c.metric);
            const passed = val !== null && compareOp(c.operator || c.op, val, c.value ?? c.threshold);
            evidence.push({ group:group.id || "g", metric:c.metric, op:c.operator || c.op, threshold:c.value ?? c.threshold, value:val, passed });
            return passed;
          });
          const conn = (group.connector || "AND").toUpperCase();
          return conn === "OR" ? condResults.some(Boolean) : condResults.every(Boolean);
        });
        let match = groupResults[0] || false;
        for (let i = 1; i < groupResults.length; i++) {
          const outer = ((outerConnectors && outerConnectors[i-1]) || "AND").toUpperCase();
          match = outer === "OR" ? (match || groupResults[i]) : (match && groupResults[i]);
        }
        return { match, evidence, reason: match ? "matched" : "conditions not met" };
      }

      // ─── BACKTEST-ON-PUBLISH ─────────────────────────────────────────────
      // Runs the candidate Hypothesis against a synthetic 30-day sample and returns
      // projected hit count, projected 30-day savings, and distribution by severity.
      // In production this queries the last 30 days from the CSP metrics warehouse.
      function runBacktest(formData, sampleSize) {
        const N = sampleSize || 300;
        const samples = [];
        for (let i = 0; i < N; i++) {
          samples.push({
            id:`sim-${i}`,
            metrics:{
              "CPU Utilization % (avg)": Math.random() < 0.22 ? Math.random() * 10 : 20 + Math.random() * 65,
              "Peak CPU %":              Math.random() < 0.22 ? Math.random() * 30 : 40 + Math.random() * 55,
              "Memory Utilization %":    Math.random() < 0.28 ? Math.random() * 30 : 35 + Math.random() * 55,
              "Network In (bytes)":      Math.random() < 0.15 ? Math.random() * 1e5 : 1e7 + Math.random() * 5e8,
              "Network Out (bytes)":     Math.random() < 0.15 ? Math.random() * 1e5 : 1e7 + Math.random() * 5e8,
              "GPU Utilization %":       Math.random() < 0.4  ? Math.random() * 8  : 30 + Math.random() * 60,
              "GPU Memory Utilization %":Math.random() < 0.4  ? Math.random() * 10 : 40 + Math.random() * 50,
              "Database connections":    Math.random() < 0.25 ? Math.random() * 2  : 5 + Math.random() * 200,
              "IOPS":                    Math.random() < 0.3  ? Math.random() * 5  : 50 + Math.random() * 10000,
              "CPU request usage %":     Math.random() < 0.35 ? Math.random() * 40 : 50 + Math.random() * 45,
              "Memory limit usage %":    Math.random() < 0.35 ? Math.random() * 50 : 55 + Math.random() * 40,
            },
            currentRate: 0.08 + Math.random() * 4.2,
            targetRate:  0.04 + Math.random() * 2.0,
          });
        }
        let hits = 0, failed = 0, suppressed = 0, savings30d = 0;
        const reasons = { nullMetric:0, thresholdNotMet:0 };
        for (const s of samples) {
          const r = evaluateRuleGroups(s, formData.ruleGroups || [], formData.outerConnectors || []);
          if (r.match) {
            const delta = formData.actionType === "shutdown"
              ? s.currentRate * 720
              : Math.max(0, (s.currentRate - s.targetRate) * 720);
            if (delta <= 0) suppressed++;
            else { hits++; savings30d += delta; }
          } else {
            failed++;
            if (r.evidence.some(e => e.value === null)) reasons.nullMetric++;
            else reasons.thresholdNotMet++;
          }
        }
        return {
          sampled:N,
          hits, failed, suppressed,
          hitRate: hits / N,
          savings30d,
          reasons,
        };
      }

      function generateAdvisoryData(customerId, dateStr) {
        const seed = (customerId + dateStr).split("").reduce((a,c) => a + c.charCodeAt(0), 0);
        const rng = (i) => ((seed * 9301 + 49297 + i * 1327) % 233280) / 233280;

        const cust = CUSTOMERS.find(c => c.id === customerId);
        if (!cust) return { advisories:[], evaluations:[], nonAdvisory:[] };

        const rTypes = RESOURCE_TYPES;
        const recList = SAMPLE_RECOMMENDATIONS.filter(r => r.status === "active");
        const totalChecked = Math.floor(cust.resourceCount * (0.6 + rng(1) * 0.35));

        const evaluations = rTypes.map((rt, i) => {
          const count = Math.floor(totalChecked * (rng(i * 10 + 2) * 0.4));
          return count > 0 ? { resourceType: rt.id, label: rt.label, icon: rt.icon, checked: count } : null;
        }).filter(Boolean);

        const actualTotal = evaluations.reduce((s, e) => s + e.checked, 0) || totalChecked;

        const advisoryCount = Math.floor(actualTotal * (0.08 + rng(3) * 0.12));
        const advisories = [];
        for (let i = 0; i < advisoryCount; i++) {
          const rec = recList[Math.floor(rng(i * 7 + 100) * recList.length)];
          const rt = rTypes.find(r => r.category === rec.category) || rTypes[0];
          const savAmt = Math.floor(500 + rng(i * 11 + 200) * 9500);
          advisories.push({
            id: `ADV-${dateStr.replace(/-/g,"")}-${String(i+1).padStart(3,"0")}`,
            recId: rec.id, recName: rec.name, type: rec.type, severity: rec.severity,
            resourceType: rt.id, resourceLabel: rt.label, resourceIcon: rt.icon,
            resourceId: `${cust.csp}-${rt.id}-${String(Math.floor(rng(i*3+50)*9999)).padStart(4,"0")}`,
            currentSku: `${rt.id === "vm" ? (cust.csp==="aws"?"m6i.xlarge":cust.csp==="azure"?"Standard_D4s_v5":"n2-standard-4") : "—"}`,
            recommendedSku: `${rt.id === "vm" ? (cust.csp==="aws"?"m6i.large":cust.csp==="azure"?"Standard_D2s_v5":"n2-standard-2") : "—"}`,
            savingsMonthly: savAmt,
            category: rec.category,
          });
        }

        const skipped = actualTotal - advisoryCount;
        const nonAdvisory = NON_ADVISORY_REASONS.map((r, i) => {
          const share = rng(i * 13 + 300);
          const count = Math.floor(skipped * share * 0.35);
          const rtBreakdown = rTypes.slice(0, 3 + Math.floor(rng(i * 5 + 400) * 4)).map((rt, j) => ({
            resourceType: rt.id, label: rt.label, count: Math.floor(count * rng(i * 20 + j * 3 + 500) * 0.6),
          })).filter(x => x.count > 0);
          return { ...r, count, breakdown: rtBreakdown };
        }).filter(x => x.count > 0).sort((a, b) => b.count - a.count);

        return { advisories, evaluations, nonAdvisory, totalChecked: actualTotal, advisoryCount, skippedCount: skipped };
      }

      // ─── DASHBOARD VIEW ─────────────────────────────────────────────────
      function DashboardView({ totalHits, totalFails, activeCount, draftCount, recs, onNavigate }) {
        const categoryCounts = {};
        recs.forEach((r) => { categoryCounts[r.category] = (categoryCounts[r.category]||0) + r.hitsLast30d; });
        const topCategories = Object.entries(categoryCounts).sort((a,b) => b[1]-a[1]);

                <div style={{ fontSize:12, fontWeight:600, color:"#94a3b8", marginBottom:16, textTransform:"uppercase", letterSpacing:"0.06em" }}>Hits by Cloud Provider</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:20 }}>
                  {CSP_LIST.map((csp) => (

      // ─── RECOMMENDATION DETAIL PANEL ────────────────────────────────────
      // ─── SIMULATE MODAL ────────────────────────────────────────────────────
      function SimulateModal({ rec, onClose }) {
        const { useState: _us, useMemo: _um, useRef: _ur } = React;
        const rtKey = resolveResourceType(rec);
        const defaultData = JSON.parse(JSON.stringify(MOCK_DATA_TEMPLATES[rtKey] || MOCK_DATA_TEMPLATES.vm));
        const [mockData, setMockData] = _us(defaultData);
        const [simResults, setSimResults] = _us(null);
        const [running, setRunning]       = _us(false);
        const [importErr, setImportErr]   = _us(null);
        const fileRef = _ur(null);

        function exportJson() {
          const blob = new Blob([JSON.stringify(mockData, null, 2)], { type:"application/json" });
          const url  = URL.createObjectURL(blob);
          const a    = document.createElement("a");
          a.href = url; a.download = `mock-${rec.id}-${rtKey}.json`;
          a.click(); URL.revokeObjectURL(url);
        }

        function importJson(e) {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            try { setMockData(JSON.parse(ev.target.result)); setImportErr(null); }
            catch { setImportErr("Invalid JSON — could not parse the imported file."); }
          };
          reader.readAsText(file);
        }

        function updateCell(rowIdx, field, value) {
          setMockData(d => d.map((r,i) => i !== rowIdx ? r : (() => {
            if (field in (r.metrics || {})) return { ...r, metrics: { ...r.metrics, [field]: value } };
            return { ...r, [field]: value };
          })()));
        }

        function evaluateRule(row, recDef) {
          const m = row.metrics || {};
          const vals = Object.values(m).map(v => typeof v === "number" ? v : parseFloat(v)).filter(v => !isNaN(v));
          const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 50;
          const maxVal = vals.length ? Math.max(...vals) : 50;
          const at = recDef.actionType;
          const sub = recDef.subcategory;

          if (at === "shutdown") {
            if (sub === "Elastic IP") return m.AssociationStatus === "disassociated" || m.IdleDays > 7;
            if (sub === "Backup") return m.AssociatedVolumeExists === false && (m.SnapshotAge || 0) > 90;
            if (sub === "NAT Gateway") return (m.BytesProcessed || m.ByteCount || 0) < 1048576 && (m.ActiveConnectionCount || 0) < 1;
            if (sub === "Cache") return (m.CurrConnections || 0) === 0 && (m.CacheHitRate || 0) === 0;
            if (sub === "Data Warehouse") return (m.QueryExecutionTime || m.BuiltinSqlPoolLoginAttempts || 0) === 0;
            if (sub === "NoSQL") return ((m.ConsumedReadCapacityUnits || 0) + (m.ConsumedWriteCapacityUnits || 0)) < 1;
            if (sub === "Serverless") return (m.Invocations || 0) === 0;
            if (sub === "Load Balancing") return (m.RequestCount || 0) === 0 && (m.HealthyTargets || 0) === 0;
            return avg < 10;
          }
          if (at === "rightsize") {
            if (sub === "Kubernetes") return (m.node_cpu_usage_percentage || avg) < 30;
            if (sub === "Workloads") return (m.cpu_request_utilization_pct || avg) < 25;
            if (sub === "Cache") return (m.BytesUsedForCache || 0) > 0 && maxVal < 45;
            if (sub === "NoSQL") return avg < 35;
            if (sub === "Data Warehouse") return (m.SlotUtilization || m.DWUUsedPercent || avg) < 45;
            if (sub === "GPU Compute") return (m.GPUUtilization || m.gpu_utilization_pct || avg) < 40;
            if (sub === "Block Storage") return (m.VolumeReadOps || 0) === 0 && (m.VolumeWriteOps || 0) === 0 ? false : avg < 35;
            if (sub === "NAT Gateway") return maxVal < 30;
            if (recDef.type === "security") return true;
            if (recDef.type === "governance") return true;
            return avg < 20;
          }
          if (["archive","migrate","configure","encrypt","pause","delete","release"].includes(at)) {
            if (recDef.type === "security" || recDef.type === "governance") return true;
            return avg < 25;
          }
          return avg < 20;
        }

        function runSimulation() {
          setRunning(true);
          setTimeout(() => {
            const results = mockData.map(row => {
              const allFamilies = Object.values(SKU_CATALOG).flat();
              const currentSku = allFamilies.flatMap(f => f.skus).find(s => s.type === row.currentSku);
              const currentCostPerHr = currentSku?.costPerHr ?? 0.096;
              const triggersRule = evaluateRule(row, rec);
              const isCostRec = rec.type === "cost_saving";

              if (!triggersRule) return { ...row, advisory:false, reason:"Metric above threshold — no advisory" };

              let savings30d = 0;
              let detail = "";
              if (isCostRec) {
                if (rec.actionType === "shutdown") {
                  savings30d = currentCostPerHr * 720;
                  detail = "Shut down — no meaningful activity detected";
                } else if (rec.actionType === "rightsize") {
                  const pct = parseFloat(rec.savingsPct) || 40;
                  savings30d = currentCostPerHr * (pct / 100) * 720;

                } else {
                  savings30d = currentCostPerHr * 0.30 * 720;
                  detail = `${actionById(rec.actionType).label} — est. 30% reduction`;
                }
              } else {
                detail = rec.type === "security" ? "Security: remediation required" :
                         rec.type === "governance" ? "Governance: policy violation detected" :
                         "Performance: improvement opportunity";
              }

              if (isCostRec && savings30d <= 0) return { ...row, advisory:false, reason:"Savings ≤ 0 — suppressed" };

              return {
                ...row, advisory:true,
                savings30d: isCostRec ? savings30d.toFixed(2) : "—",
                recommendation: detail,
              };
            });
            setSimResults(results);
            setRunning(false);
          }, 1200);
        }

        const allKeys = mockData.length > 0 ? ["resourceId","currentSku",...Object.keys(mockData[0].metrics||{})] : [];

        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", display:"flex", alignItems:"flex-start", justifyContent:"center", zIndex:150, backdropFilter:"blur(4px)", overflowY:"auto", padding:"32px 16px" }} onClick={onClose}>

                </div>
                <button onClick={onClose} style={{ background:"none", border:"none", color:"#64748b", cursor:"pointer", fontSize:18 }}>✕</button>
              </div>

              <div style={{ padding:24 }}>
                {/* Mock data toolbar */}
                <div style={{ display:"flex", gap:10, marginBottom:14, alignItems:"center" }}>
                  <div style={{ fontSize:12, fontWeight:600, color:"#94a3b8", flex:1 }}>Mock Dataset — {rtKey.toUpperCase()} ({mockData.length} resources)</div>
                  <button onClick={exportJson} style={{ padding:"6px 14px", borderRadius:7, border:"1px solid rgba(99,102,241,0.3)", background:"rgba(99,102,241,0.1)", color:"#a5b4fc", cursor:"pointer", fontSize:11 }}>⬇ Export JSON</button>
                  <button onClick={() => fileRef.current?.click()} style={{ padding:"6px 14px", borderRadius:7, border:"1px solid rgba(16,185,129,0.3)", background:"rgba(16,185,129,0.08)", color:"#86efac", cursor:"pointer", fontSize:11 }}>⬆ Import JSON</button>
                  <input type="file" accept=".json" ref={fileRef} onChange={importJson} style={{ display:"none" }} />
                </div>
                {importErr && <div style={{ marginBottom:10, fontSize:11, color:"#fca5a5" }}>⚠ {importErr}</div>}

                {/* Mock data table */}
                <div style={{ overflowX:"auto", marginBottom:16, borderRadius:8, border:"1px solid rgba(255,255,255,0.08)" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
                    <thead>
                      <tr style={{ background:"rgba(255,255,255,0.04)" }}>
                        {allKeys.map(k => <th key={k} style={{ padding:"8px 12px", textAlign:"left", color:"#64748b", fontWeight:600, whiteSpace:"nowrap", borderBottom:"1px solid rgba(255,255,255,0.06)" }}>{k}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {mockData.map((row, ri) => (
                        <tr key={ri} style={{ borderBottom:"1px solid rgba(255,255,255,0.04)" }}>
                          {allKeys.map(k => {
                            const val = k in (row.metrics||{}) ? row.metrics[k] : row[k];
                            return (
                              <td key={k} style={{ padding:"4px 8px" }}>
                                <input value={val ?? ""} onChange={e => updateCell(ri, k, e.target.value)}
                                  style={{ width:"100%", minWidth:80, padding:"3px 6px", background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:4, color:"#e2e8f0", fontSize:11, fontFamily:"monospace", outline:"none", boxSizing:"border-box" }} />
                              </td>
                            );
                          })}
                        </tr>

                    </tbody>
                  </table>

      // ─── RUN NOW MODAL ──────────────────────────────────────────────────────
      function RunNowModal({ rec, onClose }) {
        const { useState: _us } = React;
        const [running, setRunning] = _us(false);
        const [results, setResults] = _us(null);

        function execute() {
          setRunning(true);
          setTimeout(() => {
            const rtKey = resolveResourceType(rec);
            const sample = (MOCK_DATA_TEMPLATES[rtKey] || MOCK_DATA_TEMPLATES.vm).slice(0, 3);
            const res = sample.map(row => {
              const allFamilies = Object.values(SKU_CATALOG).flat();
              const currentSku = allFamilies.flatMap(f => f.skus).find(s => s.type === row.currentSku);
              const costPerHr = currentSku?.costPerHr ?? 0.096;
              const isCostRec = rec.type === "cost_saving";
              const m = row.metrics || {};
              const vals = Object.values(m).map(v => typeof v === "number" ? v : parseFloat(v)).filter(v => !isNaN(v));
              const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 50;
              const triggers = avg < 25 || rec.type === "security" || rec.type === "governance";
              const pct = parseFloat(rec.savingsPct) || 40;
              const savings = rec.actionType === "shutdown" ? costPerHr * 720 : costPerHr * (pct/100) * 720;
              return {
                resourceId: row.resourceId, currentSku: row.currentSku,
                checked: true, advisory: triggers && (isCostRec ? savings > 0 : true),
                savings30d: triggers && isCostRec ? savings.toFixed(2) : (triggers ? "—" : null),
              };
            });
            setResults({ checked: res.length, generated: res.filter(r=>r.advisory).length, suppressed: res.filter(r=>!r.advisory).length, rows: res });
            setRunning(false);
          }, 1500);
        }

        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:160, backdropFilter:"blur(4px)" }} onClick={onClose}>
            <div style={{ background:"linear-gradient(135deg, #0f1629, #1a1f3a)", border:"1px solid rgba(99,102,241,0.2)", borderRadius:16, padding:28, maxWidth:560, width:"100%" }} onClick={e => e.stopPropagation()}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16 }}>
                <div>
                  <div style={{ fontSize:16, fontWeight:700, color:"#f1f5f9" }}>Run Now — {rec.name}</div>
                  <div style={{ fontSize:11, color:"#64748b", marginTop:2 }}>Executes against demo customer 636. Live execution uses real integration data.</div>
                </div>
                <button onClick={onClose} style={{ background:"none", border:"none", color:"#64748b", cursor:"pointer", fontSize:18 }}>✕</button>
              </div>
              {!results ? (
                <button onClick={execute} disabled={running}
                  style={{ width:"100%", padding:"11px", borderRadius:9, border:"none", background:"linear-gradient(135deg, #6366f1, #8b5cf6)", color:"#fff", cursor:"pointer", fontSize:13, fontWeight:700 }}>
                  {running ? "Executing…" : "▶ Execute Against Customer 636"}
                </button>
              ) : (
                <div>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:14 }}>
                    {[["Checked", results.checked, "#6366f1"], ["Advisories", results.generated, "#10b981"], ["No Advisory", results.suppressed, "#f59e0b"]].map(([l,v,c]) => (
                      <div key={l} style={{ padding:12, background:`${c}10`, border:`1px solid ${c}25`, borderRadius:8, textAlign:"center" }}>
                        <div style={{ fontSize:22, fontWeight:700, color:c }}>{v}</div>
                        <div style={{ fontSize:10, color:"#64748b" }}>{l}</div>
                      </div>
                    ))}
                  </div>
                  {results.rows.map((r,i) => (
                    <div key={i} style={{ display:"flex", gap:10, alignItems:"center", padding:"6px 10px", borderRadius:6, background: r.advisory?"rgba(16,185,129,0.05)":"rgba(255,255,255,0.02)", marginBottom:4 }}>
                      <code style={{ flex:1, fontSize:11, color:"#a5b4fc" }}>{r.resourceId}</code>
                      <span style={{ fontSize:10, color:"#64748b" }}>{r.currentSku}</span>
                      {r.advisory ? <span style={{ color:"#10b981", fontWeight:700, fontSize:11 }}>Advisory: ${r.savings30d}/30d</span> : <span style={{ color:"#475569", fontSize:11 }}>No Advisory</span>}
                    </div>
                  ))}
                  <button onClick={onClose} style={{ width:"100%", marginTop:16, padding:"9px", borderRadius:8, border:"none", background:"rgba(99,102,241,0.15)", color:"#a5b4fc", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                    Close
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

                      <div style={{ color:"#94a3b8", marginBottom:4 }}>Submitted for Approval</div>
                      <div style={{ color:"#e2e8f0" }}><strong>{recState.submittedBy || "—"}</strong> · {recState.submittedAt ? new Date(recState.submittedAt).toLocaleString() : "—"}</div>
                    </div>
                  )}

                  {/* Pending approval action */}
                  {recState.status === "pending_approval" && (
                    <div style={{ padding:16, background:"rgba(245,158,11,0.05)", border:"1px solid rgba(245,158,11,0.2)", borderRadius:10, marginBottom:16 }}>
                      <div style={{ fontSize:12, fontWeight:600, color:"#fcd34d", marginBottom:10 }}>⚡ Awaiting Approval</div>
                      <div style={{ fontSize:11, color:"#94a3b8", marginBottom:12, lineHeight:1.5 }}>
                        Review the recommendation configuration across all steps, then approve. Your identity and timestamp will be recorded.
                      </div>
                      <div style={{ marginBottom:10 }}>
                        <label style={{ fontSize:11, color:"#94a3b8", marginBottom:4, display:"block", fontWeight:600 }}>
                          Approver SSO Group <span style={{ color:"#ef4444" }}>*</span>
                        </label>
                        <select value={approverGroup} onChange={e => setApproverGroup(e.target.value)}
                          style={{ width:"100%", padding:"7px 12px", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(245,158,11,0.3)", borderRadius:6, color:"#e2e8f0", fontSize:12, outline:"none", boxSizing:"border-box" }}>
                          {SSO_APPROVER_GROUPS.map(g => <option key={g.id} value={g.id} style={{ background:"#0f1629" }}>{g.label} · {g.members} members</option>)}
                        </select>
                        {(() => {
                          const g = SSO_APPROVER_GROUPS.find(x => x.id === approverGroup);
                          return g ? (
                            <div style={{ marginTop:6, padding:"6px 10px", background:"rgba(99,102,241,0.06)", border:"1px solid rgba(99,102,241,0.15)", borderRadius:6, fontSize:10, color:"#94a3b8" }}>
                              <span style={{ color:"#a5b4fc", fontWeight:600 }}>{g.email}</span> · {g.policy}
                            </div>
                          ) : null;
                        })()}
                      </div>
                      <div style={{ marginBottom:10 }}>
                        <label style={{ fontSize:11, color:"#94a3b8", marginBottom:4, display:"block", fontWeight:600 }}>Approver Name / Email (must be a member of the selected group)</label>
                        <input value={approverName} onChange={e => setApproverName(e.target.value)} placeholder="your.name@company.com"
                          style={{ width:"100%", padding:"7px 12px", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(245,158,11,0.3)", borderRadius:6, color:"#e2e8f0", fontSize:12, outline:"none", boxSizing:"border-box" }} />
                      </div>
                      <button onClick={() => {
                        if (!approverName.trim()) return;
                        setApproving(true);
                        const grp = SSO_APPROVER_GROUPS.find(x => x.id === approverGroup);
                        setTimeout(() => {
                          setRecState(s => ({ ...s, status:"approved", approvedBy:approverName, approvedByGroup: grp?.label || approverGroup, approvedAt: new Date().toISOString() }));
                          setApproving(false);
                        }, 800);
                      }} disabled={!approverName.trim() || approving}
                        style={{ padding:"8px 20px", borderRadius:8, border:"none", background:"linear-gradient(135deg, #10b981, #14b8a6)", color:"#fff", cursor: approverName.trim()?"pointer":"not-allowed", fontSize:12, fontWeight:600, opacity: approverName.trim()?1:0.5 }}>
                        {approving ? "Approving…" : "✓ Approve Recommendation"}
                      </button>
                    </div>
                  )}

                  {/* Approved state */}
                  {recState.status === "approved" && (
                    <div>
                      <div style={{ padding:12, background:"rgba(16,185,129,0.06)", border:"1px solid rgba(16,185,129,0.2)", borderRadius:8, marginBottom:16, fontSize:11 }}>
                        <div style={{ color:"#10b981", fontWeight:600, marginBottom:4 }}>✓ Approved</div>
                        <div style={{ color:"#94a3b8" }}>By <strong style={{ color:"#e2e8f0" }}>{recState.approvedBy}</strong>{recState.approvedByGroup ? <> · member of <strong style={{ color:"#a5b4fc" }}>{recState.approvedByGroup}</strong></> : null} · {recState.approvedAt ? new Date(recState.approvedAt).toLocaleString() : "—"}</div>
                      </div>
                      <div style={{ padding:12, background:"rgba(99,102,241,0.05)", border:"1px solid rgba(99,102,241,0.15)", borderRadius:8, marginBottom:16, fontSize:11, color:"#a5b4fc" }}>
                        💡 Execute "Run Now" to activate this recommendation. Status transitions to <strong>Active</strong> after first successful production run.
                      </div>
                      <div style={{ fontSize:11, fontWeight:600, color:"#94a3b8", marginBottom:10 }}>Run Options</div>
                      <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
                        <button onClick={() => {
                          setShowRunNow(true);
                          setTimeout(() => setRecState(s => ({ ...s, status:"active", lastRun:new Date().toISOString() })), 3000);
                        }}
                          style={{ padding:"9px 18px", borderRadius:8, border:"none", background:"linear-gradient(135deg, #6366f1, #8b5cf6)", color:"#fff", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                          ▶ Run Now → Activate
                        </button>
                        <button onClick={() => setShowSimulate(true)}
                          style={{ padding:"9px 18px", borderRadius:8, border:"1px solid rgba(99,102,241,0.3)", background:"rgba(99,102,241,0.1)", color:"#a5b4fc", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                          ⚗ Simulate Now
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Active state — disable control */}
                  {recState.status === "active" && (
                    <div>
                      <div style={{ padding:12, background:"rgba(16,185,129,0.06)", border:"1px solid rgba(16,185,129,0.2)", borderRadius:8, marginBottom:16, fontSize:11 }}>
                        <div style={{ color:"#10b981", fontWeight:600, marginBottom:4 }}>✓ Active — running on schedule</div>
                        <div style={{ color:"#94a3b8" }}>{recState.approvedBy ? <>Approved by <strong style={{ color:"#e2e8f0" }}>{recState.approvedBy}</strong></> : "System-activated"} · Last run: {recState.lastRun ? new Date(recState.lastRun).toLocaleString() : "—"}</div>
                      </div>
                      <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
                        <button onClick={() => setShowRunNow(true)}
                          style={{ padding:"9px 18px", borderRadius:8, border:"none", background:"linear-gradient(135deg, #6366f1, #8b5cf6)", color:"#fff", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                          ▶ Run Now
                        </button>
                        <button onClick={() => setShowSimulate(true)}
                          style={{ padding:"9px 18px", borderRadius:8, border:"1px solid rgba(99,102,241,0.3)", background:"rgba(99,102,241,0.1)", color:"#a5b4fc", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                          ⚗ Simulate Now
                        </button>
                        <button onClick={() => setRecState(s => ({...s, status:"disabled"}))}
                          style={{ padding:"9px 18px", borderRadius:8, border:"1px solid rgba(239,68,68,0.3)", background:"rgba(239,68,68,0.08)", color:"#fca5a5", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                          ⏸ Disable
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Disabled state — re-enable control */}
                  {recState.status === "disabled" && (
                    <div>
                      <div style={{ padding:12, background:"rgba(239,68,68,0.05)", border:"1px solid rgba(239,68,68,0.2)", borderRadius:8, marginBottom:16, fontSize:11 }}>
                        <div style={{ color:"#fca5a5", fontWeight:600, marginBottom:4 }}>⏸ Disabled</div>
                        <div style={{ color:"#94a3b8" }}>This recommendation is paused and will not run on schedule.</div>
                      </div>
                      <button onClick={() => setRecState(s => ({...s, status:"active"}))}
                        style={{ padding:"9px 18px", borderRadius:8, border:"none", background:"linear-gradient(135deg, #10b981, #14b8a6)", color:"#fff", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                        ▶ Re-enable
                      </button>
                    </div>
                  )}
                </div>
              )}

              {activeTab === "audit" && (
                <div>
                  <div style={{ fontSize:12, fontWeight:600, color:"#94a3b8", marginBottom:12 }}>Audit Trail</div>
                  <div style={{ fontSize:10, color:"#475569", marginBottom:16 }}>Immutable log of all lifecycle events. Retained for 2 years per compliance policy.</div>
                  {auditLog.map((evt, i) => (
                    <div key={i} style={{ display:"flex", gap:12, marginBottom:12 }}>
                      <div style={{ width:2, background: i === 0 ? "#6366f1" : "rgba(99,102,241,0.2)", flexShrink:0, borderRadius:1 }} />
                      <div style={{ flex:1 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:2 }}>
                          <span style={{ fontSize:10, color:"#64748b" }}>{new Date(evt.ts).toLocaleString()}</span>
                          <span style={{ padding:"1px 6px", borderRadius:3, fontSize:9, fontWeight:700, background: evt.action === "approved" ? "rgba(16,185,129,0.15)" : evt.action === "execution_completed" ? "rgba(99,102,241,0.15)" : "rgba(245,158,11,0.15)", color: evt.action === "approved" ? "#10b981" : evt.action === "execution_completed" ? "#a5b4fc" : "#f59e0b" }}>{evt.action}</span>
                        </div>
                        <div style={{ fontSize:11, color:"#e2e8f0" }}>{evt.detail}</div>
                        <div style={{ fontSize:10, color:"#475569", marginTop:2 }}>Actor: {evt.actor}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {activeTab === "schedule" && (
                <div>
                  <div style={{ fontSize:12, fontWeight:600, color:"#94a3b8", marginBottom:12 }}>Execution Schedule</div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:20 }}>
                    <div>
                      <label style={{ fontSize:11, color:"#94a3b8", display:"block", marginBottom:4, fontWeight:600 }}>Frequency</label>
                      <select value={schedule.freq} onChange={e => setSchedule(s=>({...s,freq:e.target.value}))}
                        style={{ width:"100%", padding:"8px 12px", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(99,102,241,0.2)", borderRadius:6, color:"#e2e8f0", fontSize:12, outline:"none" }}>
                        <option value="hourly">Hourly</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                      </select>
                    </div>
                    <div>
                      <label style={{ fontSize:11, color:"#94a3b8", display:"block", marginBottom:4, fontWeight:600 }}>Execution Window</label>
                      <select value={schedule.window} onChange={e => setSchedule(s=>({...s,window:e.target.value}))}
                        style={{ width:"100%", padding:"8px 12px", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(99,102,241,0.2)", borderRadius:6, color:"#e2e8f0", fontSize:12, outline:"none" }}>
                        <option value="02:00-06:00">02:00 – 06:00 (low-traffic)</option>
                        <option value="00:00-04:00">00:00 – 04:00 (overnight)</option>
                        <option value="06:00-10:00">06:00 – 10:00 (morning)</option>
                        <option value="anytime">Anytime (no window restriction)</option>
                      </select>
                    </div>
                    <div>
                      <label style={{ fontSize:11, color:"#94a3b8", display:"block", marginBottom:4, fontWeight:600 }}>Timezone</label>
                      <select value={schedule.tz} onChange={e => setSchedule(s=>({...s,tz:e.target.value}))}
                        style={{ width:"100%", padding:"8px 12px", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(99,102,241,0.2)", borderRadius:6, color:"#e2e8f0", fontSize:12, outline:"none" }}>
                        <option value="UTC">UTC</option>
                        <option value="US/Eastern">US/Eastern</option>
                        <option value="US/Pacific">US/Pacific</option>
                        <option value="Europe/London">Europe/London</option>
                        <option value="Asia/Tokyo">Asia/Tokyo</option>
                      </select>
                    </div>
                    <div>
                      <label style={{ fontSize:11, color:"#94a3b8", display:"block", marginBottom:4, fontWeight:600 }}>Status</label>
                      <div style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 0" }}>
                        <button onClick={() => setSchedule(s=>({...s,enabled:!s.enabled}))}
                          style={{ width:36, height:20, borderRadius:10, border:"none", cursor:"pointer", background: schedule.enabled ? "#10b981" : "#334155", position:"relative", transition:"background 0.2s" }}>
                          <div style={{ width:16, height:16, borderRadius:8, background:"#fff", position:"absolute", top:2, left: schedule.enabled ? 18 : 2, transition:"left 0.2s" }} />
                        </button>
                        <span style={{ fontSize:12, color: schedule.enabled ? "#10b981" : "#64748b", fontWeight:600 }}>{schedule.enabled ? "Enabled" : "Paused"}</span>
                      </div>
                    </div>
                  </div>
                  <div style={{ padding:12, background:"rgba(99,102,241,0.05)", border:"1px solid rgba(99,102,241,0.15)", borderRadius:8, fontSize:11, color:"#94a3b8", lineHeight:1.6 }}>
                    {schedule.enabled
                      ? <>Next execution: <strong style={{ color:"#a5b4fc" }}>{schedule.freq === "hourly" ? "~1 hour" : schedule.freq === "daily" ? "Tomorrow " + schedule.window.split("-")[0] + " " + schedule.tz : schedule.freq === "weekly" ? "Next Monday " + schedule.window.split("-")[0] : "1st of next month"}</strong>. The pipeline will evaluate all matching customer resources within the {schedule.window} {schedule.tz} window.</>
                      : "Schedule is paused. Enable to resume automated execution."}
                  </div>
                </div>
              )}
            </div>
          </div>
          {showSimulate && <SimulateModal rec={recState} onClose={() => setShowSimulate(false)} />}
          {showRunNow   && <RunNowModal   rec={recState} onClose={() => setShowRunNow(false)} />}
          </>
        );
      }

      // ─── RECOMMENDATIONS VIEW ────────────────────────────────────────────
      function RecommendationsView({ recs, search, onSearch, filterCategory, onFilterCategory, filterCSP, onFilterCSP, filterType, onFilterType, filterStatus, onFilterStatus, onSelect, selectedRec, onCreate }) {
        return (
          <div style={{ display:"flex", gap:16, height:"calc(100vh - 140px)" }}>
            <div style={{ width:selectedRec?"45%":"100%", display:"flex", flexDirection:"column", transition:"width 0.3s" }}>
              <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>
                <h2 style={{ fontSize:20, fontWeight:700, color:"#f1f5f9", margin:0, flex:1 }}>Recommendations</h2>
                <button onClick={onCreate} style={{ padding:"8px 16px", borderRadius:8, border:"none", background:"linear-gradient(135deg, #6366f1, #8b5cf6)", color:"#fff", cursor:"pointer", fontSize:12, fontWeight:600 }}>+ New Recommendation</button>
              </div>

              <div style={{ display:"flex", gap:8, marginBottom:12, flexWrap:"wrap" }}>
                <input value={search} onChange={(e) => onSearch(e.target.value)} placeholder="Search by name or ID…" style={{ padding:"7px 12px", borderRadius:8, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(15,22,41,0.8)", color:"#e2e8f0", fontSize:12, flex:1, minWidth:180, outline:"none" }} />
                <FilterSelect value={filterCategory} onChange={onFilterCategory} options={["All",...CATEGORIES]} label="Category" />
                <FilterSelect value={filterCSP} onChange={onFilterCSP} options={["All","aws","azure","gcp","oci"]} label="CSP" />
                <FilterSelect value={filterType} onChange={onFilterType} options={["All",...RECOMMENDATION_TYPES]} label="Type" />
                <FilterSelect value={filterStatus} onChange={onFilterStatus} options={["All","active","pending_approval","approved","draft","disabled"]} label="Status" />
              </div>

              <div style={{ fontSize:11, color:"#64748b", marginBottom:8 }}>{recs.length} recommendations</div>

              <div style={{ flex:1, overflow:"auto", borderRadius:10, border:"1px solid rgba(99,102,241,0.1)" }}>
                <table style={{ width:"100%", borderCollapse:"collapse" }}>
                  <thead>
                    <tr style={{ background:"rgba(15,22,41,0.9)", position:"sticky", top:0, zIndex:5 }}>
                      {["ID","Recommendation","Type","Category","CSPs","Severity","Savings","Hits (30d)","Fails","Status"].map((h) => (
                        <th key={h} style={{ padding:"10px 12px", textAlign:"left", fontSize:10, fontWeight:600, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.08em", borderBottom:"1px solid rgba(99,102,241,0.1)" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {recs.map((r) => (
                      <tr key={r.id} onClick={() => onSelect(r)} style={{ cursor:"pointer", background:selectedRec?.id===r.id?"rgba(99,102,241,0.08)":"transparent", transition:"background 0.15s" }}
                        onMouseEnter={(e) => { if (selectedRec?.id !== r.id) e.currentTarget.style.background="rgba(99,102,241,0.04)"; }}
                        onMouseLeave={(e) => { if (selectedRec?.id !== r.id) e.currentTarget.style.background="transparent"; }}>
                        <td style={{ padding:"10px 12px", fontSize:11, color:"#8b5cf6", fontWeight:600, fontFamily:"monospace", borderBottom:"1px solid rgba(99,102,241,0.05)" }}>{r.id}</td>
                        <td style={{ padding:"10px 12px", fontSize:12, color:"#e2e8f0", fontWeight:500, borderBottom:"1px solid rgba(99,102,241,0.05)", maxWidth:240, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.name}</td>
                        <td style={{ padding:"10px 12px", borderBottom:"1px solid rgba(99,102,241,0.05)" }}><TypeBadge type={r.type} /></td>
                        <td style={{ padding:"10px 12px", fontSize:11, color:"#94a3b8", borderBottom:"1px solid rgba(99,102,241,0.05)" }}>{r.category}</td>
                        <td style={{ padding:"10px 12px", borderBottom:"1px solid rgba(99,102,241,0.05)" }}><div style={{ display:"flex", gap:3 }}>{r.csps.map((c) => <CSPBadge key={c} csp={c} />)}</div></td>
                        <td style={{ padding:"10px 12px", borderBottom:"1px solid rgba(99,102,241,0.05)" }}><SeverityDot level={r.severity} /></td>
                        <td style={{ padding:"10px 12px", fontSize:11, color:"#10b981", fontWeight:600, borderBottom:"1px solid rgba(99,102,241,0.05)" }}>{r.savingsPct}</td>
                        <td style={{ padding:"10px 12px", fontSize:11, color:"#e2e8f0", fontWeight:600, borderBottom:"1px solid rgba(99,102,241,0.05)" }}>{fmt(r.hitsLast30d)}</td>
                        <td style={{ padding:"10px 12px", fontSize:11, color:r.failedLast30d>100?"#f59e0b":"#64748b", borderBottom:"1px solid rgba(99,102,241,0.05)" }}>{fmt(r.failedLast30d)}</td>
                        <td style={{ padding:"10px 12px", borderBottom:"1px solid rgba(99,102,241,0.05)" }}><StatusBadge status={r.status} /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {selectedRec && <RecommendationDetailPanel rec={selectedRec} onClose={() => onSelect(null)} />}
          </div>
        );
      }

      // ─── DATA SOURCES VIEW ───────────────────────────────────────────────
      function DataSourcesView() {
        const [expandedSource, setExpandedSource] = useState(null);

        const sources = [
          { ...DATA_SOURCE_TYPES[0], status:"connected", details:[
            { name:"AWS CloudWatch",       endpoint:"monitoring.{region}.amazonaws.com",     auth:"IAM Role",            status:"healthy",  latency:"120ms" },
            { name:"Azure Monitor",        endpoint:"management.azure.com/metrics",           auth:"Service Principal",   status:"healthy",  latency:"180ms" },
            { name:"GCP Cloud Monitoring", endpoint:"monitoring.googleapis.com/v3",           auth:"Service Account",     status:"healthy",  latency:"150ms" },
            { name:"OCI Monitoring",       endpoint:"telemetry.{region}.oraclecloud.com",     auth:"OCI API Key",         status:"degraded", latency:"340ms" },
          ]},
          { ...DATA_SOURCE_TYPES[6], status:"connected", details:[
            { name:"AWS Cost Explorer",      endpoint:"ce.us-east-1.amazonaws.com",            auth:"IAM Role",            status:"healthy",  latency:"200ms" },
            { name:"Azure Cost Management",  endpoint:"management.azure.com/costs",            auth:"Service Principal",   status:"healthy",  latency:"250ms" },
            { name:"GCP Billing Export",     endpoint:"bigquery.googleapis.com/v2",            auth:"Service Account",     status:"healthy",  latency:"300ms" },
            { name:"OCI Cost Management",    endpoint:"usageapi.{region}.oraclecloud.com",     auth:"OCI API Key",         status:"healthy",  latency:"220ms" },
          ]},
          { ...DATA_SOURCE_TYPES[7], status:"connected", details:[
            { name:"EKS (Metrics Server)",   endpoint:"eks.{region}.amazonaws.com",            auth:"kubeconfig",          status:"healthy",  latency:"90ms" },
            { name:"AKS (Azure Monitor)",    endpoint:"management.azure.com/k8s",              auth:"Service Principal",   status:"healthy",  latency:"130ms" },
            { name:"GKE Monitoring",         endpoint:"container.googleapis.com/v1",           auth:"Service Account",     status:"healthy",  latency:"110ms" },
          ]},
          { ...DATA_SOURCE_TYPES[4], status:"connected", details:[
            { name:"FinOps Metrics Store",  endpoint:"obs.internal.finops.io/v2",            auth:"Internal mTLS",       status:"healthy",  latency:"45ms" },
          ]},
          { ...DATA_SOURCE_TYPES[1], status:"connected", details:[
            { name:"FinOps Analytics DB",   endpoint:"analytics-rw.internal.finops.io:5432", auth:"Vault Secret",        status:"healthy",  latency:"15ms" },
            { name:"Cost Warehouse",         endpoint:"dw-ro.internal.finops.io:5432",        auth:"Vault Secret",        status:"healthy",  latency:"25ms" },
          ]},
          { ...DATA_SOURCE_TYPES[2], status:"connected", details:[
            { name:"FinOps Log Index",      endpoint:"es.internal.finops.io:9200",           auth:"API Key",             status:"healthy",  latency:"35ms" },
          ]},
          { ...DATA_SOURCE_TYPES[5], status:"available", details:[
            { name:"Datadog API",            endpoint:"api.datadoghq.com/v2",                  auth:"API Key + App Key",   status:"not_configured", latency:"—" },
            { name:"Prometheus Remote Read", endpoint:"configurable",                          auth:"Bearer Token",        status:"not_configured", latency:"—" },
          ]},
        ];

        return (
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:24 }}>
              <h2 style={{ fontSize:20, fontWeight:700, color:"#f1f5f9", margin:0, flex:1 }}>Data Source Integrations</h2>
              <span style={{ padding:"8px 16px", borderRadius:8, border:"1px solid rgba(100,116,139,0.3)", background:"transparent", color:"#64748b", fontSize:12, fontWeight:600, display:"inline-flex", alignItems:"center", gap:6 }}>🔒 Read-Only — sources configured in Integrations</span>
            </div>

            <div style={{ display:"flex", gap:12, marginBottom:20, flexWrap:"wrap" }}>
              <StatCard label="Connected Sources"  value={sources.filter((s)=>s.status==="connected").length} accent="#10b981" />
              <StatCard label="Total Endpoints"    value={sources.reduce((s,src)=>s+src.details.filter((d)=>d.status!=="not_configured").length,0)} accent="#6366f1" />
              <StatCard label="Degraded"           value={sources.reduce((s,src)=>s+src.details.filter((d)=>d.status==="degraded").length,0)} accent="#f59e0b" />
            </div>

            <div style={{ display:"grid", gap:12 }}>
              {sources.map((src) => (
                <div key={src.id} style={{ background:"rgba(15,22,41,0.8)", border:`1px solid ${src.color}20`, borderRadius:12, overflow:"hidden" }}>
                  <div onClick={() => setExpandedSource(expandedSource===src.id?null:src.id)} style={{ padding:"16px 20px", display:"flex", alignItems:"center", gap:12, cursor:"pointer" }}>

                    <div style={{ flex:1 }}>

      // ─── AGGREGATION ENGINE VIEW ─────────────────────────────────────────
      function AggregationEngineView() {
        const [selectedAgg, setSelectedAgg] = useState("avg");
        const [testData, setTestData] = useState("72, 45, 38, 91, 67, 55, 83, 29, 44, 60, 78, 33, 50, 41, 86, 52, 39, 71, 48, 63");
        const [result, setResult] = useState(null);
        const [selectedCustomFn, setSelectedCustomFn] = useState(0);

        const compute = useCallback(() => {
          const nums = testData.split(",").map((n) => parseFloat(n.trim())).filter((n) => !isNaN(n));
          if (nums.length===0) { setResult(null); return; }
          nums.sort((a,b) => a-b);
          const sum = nums.reduce((s,n) => s+n, 0);
          const avg = sum / nums.length;
          const percentile = (p) => {
            const idx = (p/100)*(nums.length-1);
            const lo = Math.floor(idx), hi = Math.ceil(idx);
            return lo===hi ? nums[lo] : nums[lo]+(nums[hi]-nums[lo])*(idx-lo);
          };
          const stddev = Math.sqrt(nums.reduce((s,n) => s+Math.pow(n-avg,2),0)/nums.length);
          const rate = nums.length>1 ? (nums[nums.length-1]-nums[0])/(nums.length-1) : 0;
          setResult({
            avg:    { value:avg.toFixed(2),              label:"Average" },
            min:    { value:Math.min(...nums).toFixed(2), label:"Minimum" },
            max:    { value:Math.max(...nums).toFixed(2), label:"Maximum" },
            p50:    { value:percentile(50).toFixed(2),   label:"P50 (Median)" },
            p90:    { value:percentile(90).toFixed(2),   label:"P90" },
            p95:    { value:percentile(95).toFixed(2),   label:"P95" },
            p99:    { value:percentile(99).toFixed(2),   label:"P99" },
            sum:    { value:sum.toFixed(2),               label:"Sum" },
            count:  { value:nums.length,                  label:"Count" },
            stddev: { value:stddev.toFixed(2),            label:"Std Deviation" },
            rate:   { value:rate.toFixed(4),              label:"Rate of Change" },
            custom_fn: { value:"f(ts)", label:"Custom Function" },
          });
        }, [testData]);

        useEffect(() => { compute(); }, [compute]);

        const activeFn = CUSTOM_FUNCTION_SPEC.exampleFunctions[selectedCustomFn];

        return (
          <div>
            <h2 style={{ fontSize:20, fontWeight:700, color:"#f1f5f9", margin:"0 0 4px" }}>Aggregation Engine</h2>
            <p style={{ fontSize:12, color:"#64748b", margin:"0 0 24px" }}>Configure and test aggregation functions applied to time-series metric data</p>

            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
              <div style={{ background:"rgba(15,22,41,0.8)", border:"1px solid rgba(99,102,241,0.1)", borderRadius:12, padding:20 }}>
                <div style={{ fontSize:12, fontWeight:600, color:"#94a3b8", marginBottom:16, textTransform:"uppercase", letterSpacing:"0.06em" }}>Available Aggregation Functions</div>
                <div style={{ display:"grid", gap:8 }}>
                  {AGGREGATION_FUNCTIONS.map((fn) => (
                    <div key={fn.id} onClick={() => setSelectedAgg(fn.id)} style={{ padding:"12px 14px", background:selectedAgg===fn.id?"rgba(99,102,241,0.1)": fn.id==="custom_fn" ? "rgba(16,185,129,0.04)" : "rgba(99,102,241,0.03)", border:`1px solid ${selectedAgg===fn.id?"rgba(99,102,241,0.25)": fn.id==="custom_fn" ? "rgba(16,185,129,0.15)" : "rgba(99,102,241,0.06)"}`, borderRadius:8, cursor:"pointer", display:"flex", alignItems:"center", gap:10, transition:"all 0.15s" }}>
                      <div style={{ width:32, height:32, borderRadius:6, background: fn.id==="custom_fn" ? "rgba(16,185,129,0.15)" : "rgba(139,92,246,0.1)", display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"monospace", fontSize:11, color: fn.id==="custom_fn" ? "#6ee7b7" : "#c4b5fd", fontWeight:700 }}>{fn.id==="custom_fn" ? "f(x)" : fn.id.toUpperCase().slice(0,3)}</div>
                      <div style={{ flex:1 }}>
                        <div style={{ fontSize:12, color:"#e2e8f0", fontWeight:500 }}>{fn.label} {fn.id==="custom_fn" && <span style={{ fontSize:9, padding:"2px 6px", borderRadius:4, background:"rgba(16,185,129,0.12)", color:"#6ee7b7", marginLeft:4 }}>NEW</span>}</div>
                        <div style={{ fontSize:10, color: fn.id==="custom_fn" ? "#10b981" : "#7c3aed", fontFamily:"monospace" }}>{fn.formula}</div>
                      </div>
                      {result && fn.id!=="custom_fn" && <div style={{ fontSize:14, fontWeight:700, color:"#a5b4fc", fontFamily:"monospace" }}>{result[fn.id]?.value}</div>}
                      {fn.id==="custom_fn" && <div style={{ fontSize:10, color:"#6ee7b7", fontStyle:"italic" }}>time-series I/O</div>}
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <div style={{ background:"rgba(15,22,41,0.8)", border:"1px solid rgba(99,102,241,0.1)", borderRadius:12, padding:20, marginBottom:16 }}>
                  <div style={{ fontSize:12, fontWeight:600, color:"#94a3b8", marginBottom:12, textTransform:"uppercase", letterSpacing:"0.06em" }}>Test Data (comma-separated values)</div>
                  <textarea value={testData} onChange={(e) => setTestData(e.target.value)} rows={3} style={{ width:"100%", padding:12, borderRadius:8, border:"1px solid rgba(99,102,241,0.15)", background:"rgba(10,14,26,0.8)", color:"#e2e8f0", fontSize:12, fontFamily:"monospace", resize:"vertical", outline:"none", boxSizing:"border-box" }} />
                  <div style={{ fontSize:10, color:"#64748b", marginTop:6 }}>Enter sample metric values to test aggregation computations</div>
                </div>

                {result && (
                  <div style={{ background:"rgba(15,22,41,0.8)", border:"1px solid rgba(99,102,241,0.1)", borderRadius:12, padding:20 }}>
                    <div style={{ fontSize:12, fontWeight:600, color:"#94a3b8", marginBottom:16, textTransform:"uppercase", letterSpacing:"0.06em" }}>Results Summary</div>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10 }}>
                      {Object.entries(result).filter(([key]) => key !== "custom_fn").map(([key, val]) => (
                        <div key={key} style={{ padding:"10px 12px", background:"rgba(99,102,241,0.04)", borderRadius:8, border:"1px solid rgba(99,102,241,0.06)" }}>
                          <div style={{ fontSize:9, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.06em" }}>{val.label}</div>
                          <div style={{ fontSize:16, fontWeight:700, color:"#a5b4fc", fontFamily:"monospace", marginTop:2 }}>{val.value}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div style={{ background:"rgba(15,22,41,0.8)", border:"1px solid rgba(99,102,241,0.1)", borderRadius:12, padding:20, marginTop:16 }}>
                  <div style={{ fontSize:12, fontWeight:600, color:"#94a3b8", marginBottom:12, textTransform:"uppercase", letterSpacing:"0.06em" }}>Data Manipulation Pipeline</div>
                  {[
                    ["Filter",          "remove outliers, null values, or data outside time window"],
                    ["Resample",        "align irregular time series to fixed intervals (1m, 5m, 1h, 1d)"],
                    ["Interpolate",     "fill gaps using linear, forward-fill, or zero-fill strategies"],
                    ["Aggregate",       "apply min/max/avg/percentile/stddev/rate over the window"],
                    ["Custom Function", "pass full time-series to a registered custom function; receive transformed series or scalar fields as output"],
                    ["Compare",         "evaluate aggregated or custom-function output against configured threshold"],
                  ].map(([name, desc], i) => (
                    <div key={i} style={{ display:"flex", alignItems:"flex-start", gap:8, marginBottom:8 }}>
                      <span style={{ width:20, height:20, borderRadius:"50%", background: name==="Custom Function" ? "rgba(16,185,129,0.15)" : "rgba(99,102,241,0.1)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, color: name==="Custom Function" ? "#6ee7b7" : "#a5b4fc", fontWeight:700, flexShrink:0 }}>{i+1}</span>
                      <span style={{ fontSize:11, color:"#94a3b8", lineHeight:1.6 }}><strong style={{ color: name==="Custom Function" ? "#6ee7b7" : "#e2e8f0" }}>{name}</strong> — {desc}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* ── Custom Function — Detail Section ── */}
            <div style={{ marginTop:24, background:"linear-gradient(135deg, rgba(16,185,129,0.04) 0%, rgba(99,102,241,0.04) 100%)", border:"1px solid rgba(16,185,129,0.15)", borderRadius:12, padding:24 }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:6 }}>
                <div style={{ width:36, height:36, borderRadius:8, background:"rgba(16,185,129,0.15)", display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"monospace", fontSize:14, color:"#6ee7b7", fontWeight:700 }}>f(x)</div>
                <div>
                  <h3 style={{ fontSize:16, fontWeight:700, color:"#f1f5f9", margin:0 }}>Custom Function</h3>
                  <p style={{ fontSize:11, color:"#64748b", margin:0 }}>User-defined transformation — accepts metric time series, returns transformed series or scalar fields for the Recommendation Engine</p>
                </div>
              </div>
              <p style={{ fontSize:12, color:"#94a3b8", lineHeight:1.7, margin:"12px 0 20px", borderLeft:"3px solid rgba(16,185,129,0.3)", paddingLeft:12 }}>
                {CUSTOM_FUNCTION_SPEC.description}
              </p>

              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:20 }}>
                {/* Input Data Points */}
                <div style={{ background:"rgba(10,14,26,0.6)", border:"1px solid rgba(99,102,241,0.1)", borderRadius:10, padding:16 }}>
                  <div style={{ fontSize:11, fontWeight:700, color:"#f59e0b", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:12, display:"flex", alignItems:"center", gap:6 }}>
                    <span style={{ fontSize:14 }}>⬇</span> Input Data Points
                  </div>
                  <div style={{ display:"grid", gap:6 }}>
                    {CUSTOM_FUNCTION_SPEC.inputDataPoints.map((dp, i) => (
                      <div key={i} style={{ padding:"8px 10px", background:"rgba(245,158,11,0.04)", border:"1px solid rgba(245,158,11,0.08)", borderRadius:6, display:"flex", gap:8, alignItems:"flex-start" }}>
                        <div style={{ minWidth:90 }}>
                          <div style={{ fontSize:11, fontWeight:600, color:"#fbbf24", fontFamily:"monospace" }}>{dp.field}</div>
                          <div style={{ fontSize:9, color:"#64748b", marginTop:1 }}>{dp.type}</div>
                        </div>
                        <div style={{ fontSize:10, color:"#94a3b8", lineHeight:1.5 }}>{dp.desc}</div>
                      </div>

                </div>

                {/* Output Data Points */}
                <div style={{ background:"rgba(10,14,26,0.6)", border:"1px solid rgba(99,102,241,0.1)", borderRadius:10, padding:16 }}>
                  <div style={{ fontSize:11, fontWeight:700, color:"#10b981", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:12, display:"flex", alignItems:"center", gap:6 }}>
                    <span style={{ fontSize:14 }}>⬆</span> Output Data Points
                  </div>
                  <div style={{ display:"grid", gap:6 }}>
                    {CUSTOM_FUNCTION_SPEC.outputDataPoints.map((dp, i) => (
                      <div key={i} style={{ padding:"8px 10px", background:"rgba(16,185,129,0.04)", border:"1px solid rgba(16,185,129,0.08)", borderRadius:6 }}>
                        <div style={{ display:"flex", gap:8, alignItems:"flex-start" }}>

                <div style={{ fontSize:11, fontWeight:700, color:"#a5b4fc", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:12 }}>Example Custom Functions</div>
                <div style={{ display:"flex", gap:8, marginBottom:16 }}>
                  {CUSTOM_FUNCTION_SPEC.exampleFunctions.map((fn, i) => (
                    <div key={i} onClick={() => setSelectedCustomFn(i)} style={{ padding:"6px 14px", borderRadius:6, cursor:"pointer", fontSize:11, fontWeight:600, fontFamily:"monospace", background: selectedCustomFn===i ? "rgba(16,185,129,0.15)" : "rgba(99,102,241,0.05)", color: selectedCustomFn===i ? "#6ee7b7" : "#94a3b8", border:`1px solid ${selectedCustomFn===i ? "rgba(16,185,129,0.3)" : "rgba(99,102,241,0.08)"}`, transition:"all 0.15s" }}>
                      {fn.name}
                    </div>
                  ))}
                </div>
                {activeFn && (
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                    <div>
                      <div style={{ fontSize:10, fontWeight:600, color:"#94a3b8", textTransform:"uppercase", marginBottom:6 }}>Function</div>
                      <div style={{ fontSize:13, fontWeight:600, color:"#e2e8f0", fontFamily:"monospace" }}>{activeFn.name}()</div>
                      <div style={{ fontSize:11, color:"#94a3b8", lineHeight:1.6, marginTop:6 }}>{activeFn.desc}</div>

                      <div style={{ fontSize:10, fontWeight:600, color:"#94a3b8", textTransform:"uppercase", marginBottom:6 }}>Output Fields</div>

                <div style={{ display:"grid", gap:6 }}>
                  {[
                    { code:"custom_fn_timeout",       desc:"Function execution exceeded the configured timeout threshold" },
                    { code:"custom_fn_invalid_input",  desc:"Input time-series data did not meet function requirements (insufficient data points, wrong unit, NaN values)" },
                    { code:"custom_fn_invalid_output", desc:"Output schema validation failed — missing required fields, NaN scalars, or mismatched array lengths" },

                    <div key={i} style={{ padding:"8px 10px", display:"flex", gap:10, alignItems:"flex-start", background:"rgba(239,68,68,0.03)", borderRadius:6, border:"1px solid rgba(239,68,68,0.06)" }}>

                </p>
              </div>
            </div>
          </div>
        );

      // ─── FAILURE ANALYSIS VIEW ───────────────────────────────────────────
      function FailureAnalysisView({ failures }) {
        const reasonCounts = {};
        failures.forEach((f) => { const key = f.reason.split("—")[0].trim(); reasonCounts[key] = (reasonCounts[key]||0)+1; });
        const topReasons = Object.entries(reasonCounts).sort((a,b) => b[1]-a[1]);
        const maxReasonCount = topReasons[0]?.[1]||1;

        return (
          <div>
            <h2 style={{ fontSize:20, fontWeight:700, color:"#f1f5f9", margin:"0 0 4px" }}>Failure Analysis</h2>
            <p style={{ fontSize:12, color:"#64748b", margin:"0 0 24px" }}>Why resources fail to comply with recommendation rules</p>

            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:24 }}>
              <div style={{ background:"rgba(15,22,41,0.8)", border:"1px solid rgba(245,158,11,0.12)", borderRadius:12, padding:20 }}>
                <div style={{ fontSize:12, fontWeight:600, color:"#fbbf24", marginBottom:16, textTransform:"uppercase", letterSpacing:"0.06em" }}>Top Failure Reasons</div>
                {topReasons.map(([reason, count]) => (
                  <div key={reason} style={{ marginBottom:12 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, marginBottom:4 }}>
                      <span style={{ color:"#cbd5e1", flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{reason}</span>
                      <span style={{ color:"#f59e0b", fontWeight:600, marginLeft:8 }}>{count}</span>
                    </div>
                    <div style={{ height:4, background:"rgba(245,158,11,0.08)", borderRadius:2, overflow:"hidden" }}>
                      <div style={{ height:"100%", width:`${(count/maxReasonCount)*100}%`, background:"linear-gradient(90deg, #f59e0b, #f97316)", borderRadius:2 }} />
                    </div>
                  </div>
                ))}
              </div>

              <div style={{ background:"rgba(15,22,41,0.8)", border:"1px solid rgba(245,158,11,0.12)", borderRadius:12, padding:20 }}>
                <div style={{ fontSize:12, fontWeight:600, color:"#fbbf24", marginBottom:16, textTransform:"uppercase", letterSpacing:"0.06em" }}>Failures by Provider</div>
                {CSP_LIST.map((csp) => {
                  const count = failures.filter((f) => f.csp===csp.id).length;
                  return (
                    <div key={csp.id} style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10, padding:"8px 12px", background:`${csp.color}06`, borderRadius:8 }}>
                      <CSPBadge csp={csp.id} />
                      <div style={{ flex:1, height:4, background:"rgba(99,102,241,0.06)", borderRadius:2, overflow:"hidden" }}>
                        <div style={{ height:"100%", width:`${(count/failures.length)*100}%`, background:csp.color, borderRadius:2 }} />
                      </div>
                      <span style={{ fontSize:12, fontWeight:600, color:"#e2e8f0", minWidth:24, textAlign:"right" }}>{count}</span>
                    </div>
                  );
                })}
              </div>
            </div>

              <div style={{ padding:"16px 20px", borderBottom:"1px solid rgba(99,102,241,0.06)" }}>

            <div style={{ background:"rgba(15,22,41,0.8)", border:"1px solid rgba(99,102,241,0.12)", borderRadius:12, overflow:"hidden", marginBottom:16 }}>
              <div style={{ padding:"12px 16px", borderBottom:"1px solid rgba(99,102,241,0.08)", fontSize:12, fontWeight:700, color:"#f1f5f9" }}>Integration Onboarding Readiness</div>
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead>
                  <tr style={{ background:"rgba(99,102,241,0.05)" }}>
                    {["Provider","Status","Integrations","Required Details","Customer Cost / Challenge","Coverage"].map(h => <th key={h} style={{ padding:"9px 12px", textAlign:"left", fontSize:10, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.06em" }}>{h}</th>)}

                <tbody>

                    <tr key={p.provider} style={{ borderTop:"1px solid rgba(99,102,241,0.05)" }}>

                      <td style={{ padding:"10px 12px" }}><span style={{ padding:"2px 8px", borderRadius:4, background:p.status.includes("Ready")?"rgba(16,185,129,0.12)":"rgba(245,158,11,0.12)", color:p.status.includes("Ready")?"#34d399":"#fbbf24", fontSize:10, fontWeight:700 }}>{p.status}</span></td>
                      <td style={{ padding:"10px 12px", fontSize:11, color:"#94a3b8" }}>{p.integrations}</td>

            <div style={{ background:"rgba(15,22,41,0.8)", border:"1px solid rgba(99,102,241,0.12)", borderRadius:12, overflow:"hidden" }}>

              {criticalFixes.map(item => (
                <div key={item.gap} style={{ display:"grid", gridTemplateColumns:"180px 130px 1fr 150px", gap:12, padding:"10px 16px", borderTop:"1px solid rgba(99,102,241,0.05)", alignItems:"center" }}>
                  <div style={{ fontSize:12, fontWeight:600, color:"#e2e8f0" }}>{item.gap}</div>
                  <span style={{ justifySelf:"start", padding:"2px 8px", borderRadius:4, background:item.status==="Completed"?"rgba(16,185,129,0.12)":"rgba(245,158,11,0.12)", color:item.status==="Completed"?"#34d399":"#fbbf24", fontSize:10, fontWeight:700 }}>{item.status}</span>
