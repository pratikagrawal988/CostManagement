// Tiny dashed/dotted bar — for budget rails
function ProgressBar({ value, max, color = 'var(--accent)', height = 8, marker, label }) {
  const w = Math.min(1, value / max);
  return (
    <div style={{ position: 'relative', height, background: 'var(--hairline)', borderRadius: 999 }}>
      <div style={{ position: 'absolute', inset: 0, width: `${w * 100}%`, background: color, borderRadius: 'inherit' }} />
      {marker != null && (
        <div style={{ position: 'absolute', top: -2, bottom: -2, left: `${(marker / max) * 100}%`, width: 2, background: 'var(--ink)' }} />
      )}
      {label && <div style={{ position: 'absolute', right: 4, top: -14, fontFamily: 'var(--font-num)', fontSize: 10, color: 'var(--muted)' }}>{label}</div>}
    </div>
  );
}

function ForecastCard({ forecast }) {
  // Forecast cone visualization: realized line then forecast cone widening.
  const W = 360, H = 90, padL = 6, padR = 6, padT = 4, padB = 14;
  const w = W - padL - padR, h = H - padT - padB;
  const realized = [0.1, 0.16, 0.22, 0.28, 0.33, 0.39, 0.44, 0.48];
  const fcastMid = [0.48, 0.55, 0.62, 0.7, 0.78, 0.86, 0.94, 1.00];
  const fcastHi  = [0.48, 0.57, 0.66, 0.76, 0.86, 0.96, 1.05, 1.08];
  const fcastLo  = [0.48, 0.53, 0.58, 0.64, 0.7, 0.76, 0.84, 0.92];
  const x = (i, n) => padL + (i / (n - 1)) * w * 0.5; // realized in first half
  const xF = (i, n) => padL + w * 0.5 + (i / (n - 1)) * w * 0.5;
  const y = (v) => padT + h - v * h;
  const realPath = realized.map((v, i) => `${i === 0 ? 'M' : 'L'}${x(i, realized.length)},${y(v)}`).join(' ');
  const midPath = fcastMid.map((v, i) => `${i === 0 ? 'M' : 'L'}${xF(i, fcastMid.length)},${y(v)}`).join(' ');
  const cone = fcastHi.map((v, i) => `${i === 0 ? 'M' : 'L'}${xF(i, fcastHi.length)},${y(v)}`).join(' ')
             + ' ' + fcastLo.slice().reverse().map((v, i) => `L${xF(fcastLo.length - 1 - i, fcastLo.length)},${y(v)}`).join(' ') + ' Z';
  return (
    <div className="card" style={{ padding: '12px 14px', display: 'flex', flexDirection: 'column', gap: 4 }}>
      <div style={{ display: 'flex', alignItems: 'center' }}>
        <div className="section-title">Forecast · end of May</div>
        <div style={{ flex: 1 }} />
        <Tag tone="info">92% conf.</Tag>
      </div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
        <div className="num" style={{ fontSize: 22, color: 'var(--ink)', fontWeight: 500, letterSpacing: '-0.02em' }}>{fmtUSD(forecast, { compact: true })}</div>
        <span style={{ fontSize: 11, color: 'var(--muted)' }}>± $48k · 14d Holt-Winters</span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
        {/* y grid */}
        {[0.25, 0.5, 0.75, 1.0].map(t => (
          <line key={t} x1={padL} x2={W - padR} y1={y(t)} y2={y(t)} stroke="var(--hairline)" strokeWidth="1" vectorEffect="non-scaling-stroke" />
        ))}
        {/* divider */}
        <line x1={padL + w * 0.5} x2={padL + w * 0.5} y1={padT} y2={padT + h} stroke="var(--border)" strokeDasharray="2 3" vectorEffect="non-scaling-stroke" />
        <text x={padL + w * 0.5 + 4} y={padT + 9} fontSize="9" fill="var(--muted)" fontFamily="var(--font-num)">today</text>
        {/* cone */}
        <path d={cone} fill="var(--accent)" opacity="0.13" />
        {/* mid */}
        <path d={midPath} fill="none" stroke="var(--accent)" strokeWidth="1.4" strokeDasharray="3 2" vectorEffect="non-scaling-stroke" />
        {/* realized */}
        <path d={realPath} fill="none" stroke="var(--ink)" strokeWidth="1.6" vectorEffect="non-scaling-stroke" />
        {/* budget line */}
        <line x1={padL} x2={W - padR} y1={y(0.95)} y2={y(0.95)} stroke="var(--negative)" strokeWidth="1" strokeDasharray="4 3" vectorEffect="non-scaling-stroke" />
        <text x={W - padR - 4} y={y(0.95) - 3} textAnchor="end" fontSize="9" fill="var(--negative)" fontFamily="var(--font-num)">budget $2.49M</text>
      </svg>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// SANKEY — providers → services → teams. Simple custom rendering.
// ─────────────────────────────────────────────────────────────────
function Sankey() {
  const W = 760, H = 168;
  const left = [
    { id: 'aws', label: 'AWS', value: 612, color: 'var(--aws)' },
    { id: 'gcp', label: 'GCP', value: 348, color: 'var(--gcp)' },
    { id: 'az',  label: 'Azure', value: 218, color: 'var(--azure)' },
  ];
  const mid = [
    { id: 'compute', label: 'Compute',     value: 482, color: 'var(--d1)' },
    { id: 'ai',      label: 'AI / GPU',    value: 184, color: 'var(--d5)' },
    { id: 'data',    label: 'Data',        value: 218, color: 'var(--d4)' },
    { id: 'storage', label: 'Storage',     value: 188, color: 'var(--d2)' },
    { id: 'network', label: 'Network',     value: 106, color: 'var(--d3)' },
  ];
  const right = [
    { id: 'platform',  label: 'Platform',     value: 384, color: 'oklch(0.7 0.08 230)' },
    { id: 'data',      label: 'Data',         value: 268, color: 'oklch(0.7 0.08 145)' },
    { id: 'product',   label: 'Product',      value: 218, color: 'oklch(0.7 0.08 80)' },
    { id: 'ml',        label: 'ML Research',  value: 184, color: 'oklch(0.7 0.08 320)' },
    { id: 'corp',      label: 'Corp IT',      value: 124, color: 'oklch(0.7 0.08 30)' },
  ];
  // Links: provider→service, service→team. Manually crafted weights.
  const lp = [
    ['aws','compute',280], ['aws','storage',128], ['aws','network',88], ['aws','data',76], ['aws','ai',40],
    ['gcp','compute',132], ['gcp','data',98], ['gcp','ai',82], ['gcp','storage',24], ['gcp','network',12],
    ['az','compute',70], ['az','data',44], ['az','ai',62], ['az','storage',36], ['az','network',6],
  ];
  const ls = [
    ['compute','platform',180], ['compute','product',120], ['compute','data',92], ['compute','ml',60], ['compute','corp',30],
    ['ai','ml',104], ['ai','platform',38], ['ai','product',28], ['ai','data',14],
    ['data','data',120], ['data','platform',60], ['data','product',28], ['data','corp',10],
    ['storage','platform',82], ['storage','data',40], ['storage','product',30], ['storage','corp',36],
    ['network','platform',24], ['network','product',22], ['network','ml',12], ['network','corp',48],
  ];

  // Layout columns
  const colsX = [10, 240, 510, 700];
  const colW = 12;
  const padY = 6;
  const totalLeft = left.reduce((a, b) => a + b.value, 0);
  const scale = (H - padY * 2 - (left.length - 1) * 4) / totalLeft;

  const layoutCol = (col, x) => {
    let y = padY;
    return col.map((n) => {
      const h = n.value * scale;
      const ny = y;
      y += h + 4;
      return { ...n, x, y: ny, h };
    });
  };
  const L = layoutCol(left, colsX[0]);
  const totalMid = mid.reduce((a, b) => a + b.value, 0);
  const scaleM = (H - padY * 2 - (mid.length - 1) * 4) / totalMid;
  let my = padY;
  const M = mid.map((n) => { const h = n.value * scaleM; const ny = my; my += h + 4; return { ...n, x: colsX[1], y: ny, h }; });
  const totalR = right.reduce((a, b) => a + b.value, 0);
  const scaleR = (H - padY * 2 - (right.length - 1) * 4) / totalR;
  let ry = padY;
  const R = right.map((n) => { const h = n.value * scaleR; const ny = ry; ry += h + 4; return { ...n, x: colsX[2], y: ny, h }; });

  // Build link offsets within each node
  const leftCursor = Object.fromEntries(L.map(n => [n.id, 0]));
  const midCursorIn = Object.fromEntries(M.map(n => [n.id, 0]));
  const midCursorOut = Object.fromEntries(M.map(n => [n.id, 0]));
  const rightCursor = Object.fromEntries(R.map(n => [n.id, 0]));

  const linkPath = (x0, y0, h0, x1, y1, h1) => {
    const cx0 = x0 + (x1 - x0) * 0.5;
    return `M${x0},${y0} C${cx0},${y0} ${cx0},${y1} ${x1},${y1} L${x1},${y1 + h1} C${cx0},${y1 + h1} ${cx0},${y0 + h0} ${x0},${y0 + h0} Z`;
  };

  const links1 = lp.map(([pid, sid, v]) => {
    const p = L.find(n => n.id === pid);
    const s = M.find(n => n.id === sid);
    const h0 = v * scale;
    const h1 = v * scaleM;
    const y0 = p.y + leftCursor[pid];
    const y1 = s.y + midCursorIn[sid];
    leftCursor[pid] += h0;
    midCursorIn[sid] += h1;
    return { d: linkPath(p.x + colW, y0, h0, s.x, y1, h1), color: p.color };
  });
  const links2 = ls.map(([sid, tid, v]) => {
    const s = M.find(n => n.id === sid);
    const t = R.find(n => n.id === tid);
    const h0 = v * scaleM;
    const h1 = v * scaleR;
    const y0 = s.y + midCursorOut[sid];
    const y1 = t.y + rightCursor[tid];
    midCursorOut[sid] += h0;
    rightCursor[tid] += h1;
    return { d: linkPath(s.x + colW, y0, h0, t.x, y1, h1), color: s.color };
  });

  return (
    <div style={{ position: 'relative' }}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
        {/* column headers */}
        {['Provider', 'Service', 'Team'].map((t, i) => (
          <text key={t} x={colsX[i]} y={H + 0} fontSize="9.5" fill="var(--muted)" fontFamily="var(--font-num)" style={{ textTransform: 'uppercase', letterSpacing: '0.12em' }}>{t}</text>
        ))}
        {/* links */}
        {links1.map((l, i) => <path key={'a' + i} d={l.d} fill={l.color} opacity="0.32" />)}
        {links2.map((l, i) => <path key={'b' + i} d={l.d} fill={l.color} opacity="0.32" />)}
        {/* nodes */}
        {[...L, ...M, ...R].map((n) => (
          <g key={n.id + n.x}>
            <rect x={n.x} y={n.y} width={colW} height={n.h} fill={n.color} rx="2" />
            <text x={n.x + colW + 4} y={n.y + Math.min(11, n.h - 2)} fontSize="10.5" fill="var(--ink)" fontWeight="500">{n.label}</text>
            <text x={n.x + colW + 4} y={n.y + Math.min(22, n.h - 2)} fontSize="9" fill="var(--muted)" fontFamily="var(--font-num)">${n.value}k</text>
          </g>
        ))}
      </svg>
      {/* footer summary */}
      <div style={{ display: 'flex', gap: 14, paddingTop: 16, fontSize: 11, color: 'var(--muted)' }}>
        <span>Top spender · <span className="mono" style={{ color: 'var(--ink)' }}>Platform team / EC2 compute</span> · $284k (23.7%)</span>
        <span style={{ flex: 1 }} />
        <span>Untagged share <span className="mono" style={{ color: 'var(--negative)' }}>4.8%</span> · $56k</span>
      </div>
    </div>
  );
}

function Lens({ days, labels, lensStart, lensEnd, data }) {
  const W = 960, H = 46, padL = 38, padR = 12;
  const w = W - padL - padR;
  const x = (i) => padL + (i / (days - 1)) * w;
  // Build cumulative stacked points
  const totals = Array.from({ length: days }, (_, i) => data.reduce((a, s) => a + s.data[i], 0));
  const max = Math.max(...totals);
  const stackedAreas = [];
  for (let si = 0; si < data.length; si++) {
    const top = [], bot = [];
    let acc;
    for (let i = 0; i < days; i++) {
      acc = 0;
      for (let k = 0; k < si; k++) acc += data[k].data[i];
      const yBot = H - (acc / max) * (H - 6) - 2;
      const yTop = H - ((acc + data[si].data[i]) / max) * (H - 6) - 2;
      top.push([x(i), yTop]); bot.push([x(i), yBot]);
    }
    const d = top.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]},${p[1]}`).join(' ')
            + bot.reverse().map(p => ` L${p[0]},${p[1]}`).join(' ') + ' Z';
    stackedAreas.push({ d, color: data[si].color });
  }
  const xS = x(lensStart), xE = x(lensEnd);

  return (
    <div className="card" style={{ padding: '8px 14px 6px', display: 'flex', flexDirection: 'column', gap: 4 }}>

        <span className="chip ghost" style={{ fontSize: 10.5 }}>7d</span>
        <span className="chip" style={{ fontSize: 10.5 }}>14d</span>
        <span className="chip ghost" style={{ fontSize: 10.5 }}>30d</span>
        <span className="chip ghost" style={{ fontSize: 10.5 }}>QTD</span>
        <span className="chip ghost" style={{ fontSize: 10.5 }}>YTD</span>
        <span className="chip ghost" style={{ fontSize: 10.5 }}>Custom…</span>
      </div>
      <div style={{ position: 'relative' }}>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} preserveAspectRatio="none">
          {stackedAreas.map((s, i) => <path key={i} d={s.d} fill={s.color} opacity="0.6" />)}
          {/* unselected mask */}
          <rect x={padL} y="0" width={xS - padL} height={H} fill="var(--panel)" opacity="0.7" />
          <rect x={xE} y="0" width={W - padR - xE} height={H} fill="var(--panel)" opacity="0.7" />
          {/* selection borders */}
          <line x1={xS} x2={xS} y1="0" y2={H} stroke="var(--ink)" strokeWidth="1.5" />
          <line x1={xE} x2={xE} y1="0" y2={H} stroke="var(--ink)" strokeWidth="1.5" />
          {/* x ticks */}
          {labels.map((l, i) => i % 5 === 0 && (
            <text key={i} x={x(i)} y={H - 1} textAnchor="middle" fontSize="9" fill="var(--muted)" fontFamily="var(--font-num)">May {l}</text>
          ))}
        </svg>
        {/* handles */}
        {[xS, xE].map((px, i) => (
          <div key={i} style={{
            position: 'absolute', left: `${(px / W) * 100}%`, top: 0, bottom: 0,
            width: 8, marginLeft: -4,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <div style={{ width: 4, height: 18, background: 'var(--ink)', borderRadius: 2, boxShadow: '0 0 0 1px var(--bg)' }} />
          </div>
        ))}
      </div>
    </div>
  );
}

function AnomalySparkBig() {
  // 14 points; baseline band ~ 4.6, spike at 10, 11
  const W = 320, H = 88, padL = 0, padR = 0, padT = 4, padB = 16;
  const w = W - padL - padR, h = H - padT - padB;
  const data = [4.6, 4.8, 4.5, 4.7, 4.6, 4.9, 4.7, 5.0, 5.2, 6.4, 6.6, 5.4, 5.0, 4.9];
  const upperBand = data.map(() => 5.6);
  const lowerBand = data.map(() => 3.8);
  const max = 7.2, min = 3.0;
  const x = (i) => padL + (i / (data.length - 1)) * w;
  const y = (v) => padT + h - ((v - min) / (max - min)) * h;
  const line = data.map((v, i) => `${i === 0 ? 'M' : 'L'}${x(i)},${y(v)}`).join(' ');
  const bandPath = upperBand.map((v, i) => `${i === 0 ? 'M' : 'L'}${x(i)},${y(v)}`).join(' ')
    + lowerBand.slice().reverse().map((v, i) => `L${x(lowerBand.length - 1 - i)},${y(v)}`).join(' ') + ' Z';
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
      <path d={bandPath} fill="var(--accent)" opacity="0.10" />
      {/* anomaly highlight */}
      <rect x={x(9) - 8} y={padT} width={x(11) - x(9) + 16} height={h} fill="var(--negative)" opacity="0.08" rx="4" />
      <path d={line} fill="none" stroke="var(--ink)" strokeWidth="1.6" vectorEffect="non-scaling-stroke" />
      {[9, 10].map(i => <circle key={i} cx={x(i)} cy={y(data[i])} r="3" fill="var(--negative)" />)}

    </svg>
  );
}

function RunwayChart() {
  const W = 970, H = 220, padL = 44, padR = 16, padT = 8, padB = 22;
  const w = W - padL - padR, h = H - padT - padB;
  // 90 days in Q2: Apr 1 → Jun 30. We're at day 44 (May 14).
  const today = 44;
  const total = 90;
  // Plan line (linear from 0 → 2.49)
  const plan = (i) => (i / total) * 2.49;
  // Realized: faster burn
  const realized = Array.from({ length: today + 1 }, (_, i) => (i / total) * 2.49 * (1 + 0.05 * (i / total)));
  // Forecast mid: continues at slightly faster rate
  const fcMid = Array.from({ length: total - today + 1 }, (_, k) => {
    const i = today + k;
    return realized[today] + ((i - today) / total) * 2.49 * 1.05;
  });
  const fcHi = fcMid.map((v, k) => v * (1 + 0.04 * (k / (total - today))));
  const fcLo = fcMid.map((v, k) => v * (1 - 0.04 * (k / (total - today))));
  const max = 2.85;
  const x = (i) => padL + (i / total) * w;
  const y = (v) => padT + h - (v / max) * h;

  const planPath = Array.from({ length: total + 1 }, (_, i) => `${i === 0 ? 'M' : 'L'}${x(i)},${y(plan(i))}`).join(' ');
  const realPath = realized.map((v, i) => `${i === 0 ? 'M' : 'L'}${x(i)},${y(v)}`).join(' ');
  const midPath  = fcMid.map((v, k) => `${k === 0 ? 'M' : 'L'}${x(today + k)},${y(v)}`).join(' ');
  const cone     = fcHi.map((v, k) => `${k === 0 ? 'M' : 'L'}${x(today + k)},${y(v)}`).join(' ')
                 + fcLo.slice().reverse().map((v, k) => `L${x(total - k)},${y(v)}`).join(' ') + ' Z';

  // Where forecast hits 100% plan
  const overrun = fcMid.findIndex((v) => v > 2.49) + today;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{ marginTop: 4 }}>
      {/* y gridlines */}
      {[0.5, 1.0, 1.5, 2.0, 2.49].map((t, i) => (
        <g key={i}>
          <line x1={padL} x2={W - padR} y1={y(t)} y2={y(t)} stroke="var(--hairline)" strokeWidth="1" vectorEffect="non-scaling-stroke" />
          <text x={padL - 6} y={y(t) + 3} textAnchor="end" fontSize="9.5" fill="var(--muted)" fontFamily="var(--font-num)">{t === 2.49 ? '2.49M' : `${t.toFixed(1)}M`}</text>
        </g>
      ))}
      {/* month dividers */}
      {[0, 30, 60, 90].map(d => (
        <g key={d}>
          <line x1={x(d)} x2={x(d)} y1={padT} y2={padT + h} stroke="var(--hairline)" strokeWidth="1" vectorEffect="non-scaling-stroke" />
          <text x={x(d) + 4} y={H - 6} fontSize="10" fill="var(--muted)" fontFamily="var(--font-num)">{['Apr 1','May 1','Jun 1','Jun 30'][[0,30,60,90].indexOf(d)]}</text>
        </g>
      ))}
      {/* today divider */}
      <line x1={x(today)} x2={x(today)} y1={padT} y2={padT + h} stroke="var(--ink)" strokeWidth="1" strokeDasharray="3 3" vectorEffect="non-scaling-stroke" />
      <text x={x(today) + 4} y={padT + 11} fontSize="10" fill="var(--ink)" fontFamily="var(--font-num)" fontWeight="500">today · May 14</text>

      {/* plan line */}
      <path d={planPath} fill="none" stroke="var(--muted)" strokeWidth="1.4" strokeDasharray="4 3" vectorEffect="non-scaling-stroke" />
      <text x={x(total) - 4} y={y(2.49) - 4} textAnchor="end" fontSize="10" fill="var(--muted)" fontFamily="var(--font-num)">plan $2.49M</text>

      {/* cone */}
      <path d={cone} fill="var(--negative)" opacity="0.12" />
      {/* forecast mid */}
      <path d={midPath} fill="none" stroke="var(--negative)" strokeWidth="1.6" strokeDasharray="2 2" vectorEffect="non-scaling-stroke" />
      {/* realized */}
      <path d={realPath} fill="none" stroke="var(--ink)" strokeWidth="2" vectorEffect="non-scaling-stroke" />

      {/* overrun marker */}
      {overrun > today && (
        <g>
          <circle cx={x(overrun)} cy={y(2.49)} r="4" fill="var(--negative)" stroke="var(--bg)" strokeWidth="1.5" />
          <line x1={x(overrun)} x2={x(overrun)} y1={padT} y2={y(2.49)} stroke="var(--negative)" strokeWidth="1" strokeDasharray="2 2" vectorEffect="non-scaling-stroke" />
          <rect x={x(overrun) - 60} y={padT + 16} width="120" height="36" rx="4" fill="var(--surface)" stroke="var(--border)" />
          <text x={x(overrun)} y={padT + 30} textAnchor="middle" fontSize="10.5" fill="var(--negative)" fontFamily="var(--font-num)" fontWeight="500">Plan hit · Jun 24</text>
          <text x={x(overrun)} y={padT + 44} textAnchor="middle" fontSize="9" fill="var(--muted)" fontFamily="var(--font-num)">−6 days early</text>
        </g>
      )}

      {/* legend */}
      <g transform={`translate(${padL}, ${H - h - 8})`}>
        {[
          { c: 'var(--ink)', l: 'Realized', dash: false },
          { c: 'var(--muted)', l: 'Plan', dash: true },
          { c: 'var(--negative)', l: 'Forecast (likely)', dash: true },
        ].map((it, i) => (
          <g key={i} transform={`translate(${i * 110}, 0)`}>
            <line x1={0} x2={16} y1={0} y2={0} stroke={it.c} strokeWidth="2" strokeDasharray={it.dash ? '3 2' : ''} />
            <text x={20} y={3} fontSize="10" fill="var(--muted)">{it.l}</text>
          </g>
        ))}
      </g>
    </svg>
  );
}

function CostMixCard() {
  const data = [
    { label: 'Inference',         v: 132, c: 'var(--d1)' },
    { label: 'Fine-tune / train', v:  38, c: 'var(--d4)' },
    { label: 'Eval + guardrails', v:  14, c: 'var(--d3)' },
    { label: 'Dev tools (seats)', v:  18, c: 'var(--d6)' },
    { label: 'Vector + storage',  v:  12, c: 'var(--d2)' },
  ];
  const total = data.reduce((a, b) => a + b.v, 0);
  // donut
  const R = 52, r = 32, cx = 60, cy = 60;
  let acc = 0;
  const segs = data.map((d) => {
    const start = acc / total * Math.PI * 2 - Math.PI / 2;
    acc += d.v;
    const end = acc / total * Math.PI * 2 - Math.PI / 2;
    const large = end - start > Math.PI ? 1 : 0;
    const x0 = cx + R * Math.cos(start), y0 = cy + R * Math.sin(start);
    const x1 = cx + R * Math.cos(end),   y1 = cy + R * Math.sin(end);
    const xi0 = cx + r * Math.cos(end),  yi0 = cy + r * Math.sin(end);
    const xi1 = cx + r * Math.cos(start),yi1 = cy + r * Math.sin(start);
    const path = `M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${xi0},${yi0} A${r},${r} 0 ${large} 0 ${xi1},${yi1} Z`;
    return { d, path };

// ─────────────────────────────────────────────────────────────────
// Seat heatmap — Cursor seats, activity over 14 days
// 142 seats; show as 12-col grid of 12 rows = 144. Color = activity
// ─────────────────────────────────────────────────────────────────
function SeatHeatmap() {
  // generate seed-based activity 0..1
  let s = 11;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const cells = Array.from({ length: 142 }, (_, i) => {
    const r = rnd();
    // 13% idle, 18% under, 50% healthy, 19% heavy
    if (r < 0.13) return { v: 0, label: 'idle ≥14d' };
    if (r < 0.31) return { v: 1, label: 'low' };
    if (r < 0.81) return { v: 2, label: 'healthy' };
    return { v: 3, label: 'heavy' };
  });
  const colorOf = (v) => v === 0 ? 'oklch(0.85 0.04 28)' : v === 1 ? 'oklch(0.85 0.04 80)' : v === 2 ? 'oklch(0.72 0.13 150)' : 'oklch(0.5 0.13 280)';
  return (
    <div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(24, 1fr)', gap: 2 }}>
        {cells.map((c, i) => (
          <div key={i} style={{ aspectRatio: '1 / 1', background: colorOf(c.v), borderRadius: 2 }} title={c.label} />
        ))}
      </div>
      <div style={{ display: 'flex', gap: 8, fontSize: 10, color: 'var(--muted)', marginTop: 4 }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3 }}><i style={{ width: 8, height: 8, background: 'oklch(0.85 0.04 28)' }} /> idle</span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3 }}><i style={{ width: 8, height: 8, background: 'oklch(0.85 0.04 80)' }} /> low</span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3 }}><i style={{ width: 8, height: 8, background: 'oklch(0.72 0.13 150)' }} /> healthy</span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3 }}><i style={{ width: 8, height: 8, background: 'oklch(0.5 0.13 280)' }} /> heavy</span>
        <span style={{ flex: 1 }} />
        <span>142 seats · 14d</span>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// TREEMAP — squarified-ish layout. Manually packed rectangles for
// realism, with utilization-based color.
// ─────────────────────────────────────────────────────────────────
function Treemap() {
  // Total area: roughly 820 x 460. Bigger boxes = more cost.
  // Color encodes CPU utilization: red = under-utilized (waste), green = healthy mid, blue = high (saturated).
  const utilColor = (util) => {
    if (util < 25) return 'oklch(0.68 0.17 28)';       // red
    if (util < 45) return 'oklch(0.75 0.14 50)';       // amber
    if (util < 65) return 'oklch(0.8 0.12 95)';        // yellow-green
    if (util < 85) return 'oklch(0.7 0.13 150)';       // green
    return 'oklch(0.6 0.13 210)';                       // blue-ish
  };
  const utilColorTxt = (util) => util < 45 ? 'oklch(0.25 0.05 28)' : 'oklch(0.18 0.05 150)';

  // Manually packed layout (so the result actually reads like a treemap, not random rectangles)
  // Each item: { x, y, w, h, name, cost, util, pods, ns }
  // Coordinate space 100 x 100 — we'll scale to container.
  const items = [
    // Big block — checkout namespace
    { x:  0, y:  0, w: 38, h: 56, name: 'checkout-api',    cost: 12840, util: 16, pods: 14, ns: 'checkout', selected: true },
    { x:  0, y: 56, w: 20, h: 44, name: 'checkout-worker', cost:  6420, util: 38, pods:  8, ns: 'checkout' },
    { x: 20, y: 56, w: 18, h: 44, name: 'checkout-cron',   cost:  3210, util: 22, pods:  3, ns: 'checkout' },

    // Search namespace
    { x: 38, y:  0, w: 24, h: 44, name: 'search-svc',      cost:  8120, util: 62, pods:  6, ns: 'search' },
    { x: 38, y: 44, w: 24, h: 22, name: 'search-indexer',  cost:  4060, util: 54, pods:  4, ns: 'search' },
    { x: 38, y: 66, w: 14, h: 34, name: 'embed-svc',       cost:  2820, util: 71, pods:  3, ns: 'search' },
    { x: 52, y: 66, w: 10, h: 34, name: 'query-cache',     cost:  1820, util: 89, pods:  2, ns: 'search' },

    // Payments
    { x: 62, y:  0, w: 22, h: 36, name: 'payments-api',    cost:  6840, util: 58, pods:  8, ns: 'payments' },
    { x: 62, y: 36, w: 22, h: 22, name: 'fraud-detector',  cost:  4220, util: 64, pods:  4, ns: 'payments' },
    { x: 62, y: 58, w: 12, h: 24, name: 'ledger',          cost:  2640, util: 42, pods:  3, ns: 'payments' },
    { x: 74, y: 58, w: 10, h: 24, name: 'risk-stream',     cost:  1980, util: 48, pods:  2, ns: 'payments' },
    { x: 62, y: 82, w: 22, h: 18, name: 'payouts',         cost:  1620, util: 28, pods:  2, ns: 'payments' },

    // Platform shared
    { x: 84, y:  0, w: 16, h: 24, name: 'auth-svc',        cost:  3280, util: 36, pods:  4, ns: 'platform' },
    { x: 84, y: 24, w: 16, h: 22, name: 'gateway',         cost:  3120, util: 81, pods:  4, ns: 'platform' },
    { x: 84, y: 46, w: 16, h: 22, name: 'notify-svc',      cost:  1840, util: 18, pods:  3, ns: 'platform' },
    { x: 84, y: 68, w: 16, h: 16, name: 'config-svc',      cost:    920, util: 12, pods:  2, ns: 'platform' },
    { x: 84, y: 84, w: 16, h: 16, name: 'cron-runner',     cost:    640, util:  8, pods:  2, ns: 'platform' },
  ];

  return (
    <div style={{ position: 'relative', flex: 1, minHeight: 0, borderRadius: 4, overflow: 'hidden' }}>
      <div style={{ position: 'absolute', inset: 0, padding: 2 }}>
        <div style={{ position: 'relative', width: '100%', height: '100%' }}>
          {items.map((it, i) => {
            const bg = utilColor(it.util);
            return (
              <div key={i} style={{
                position: 'absolute',
                left: `${it.x}%`, top: `${it.y}%`,
                width: `calc(${it.w}% - 2px)`, height: `calc(${it.h}% - 2px)`,
                background: bg,
                outline: it.selected ? '2px solid var(--ink)' : 'none',
                outlineOffset: it.selected ? -2 : 0,
                borderRadius: 3,
                padding: 8,
                display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
                overflow: 'hidden',
                color: utilColorTxt(it.util),
                cursor: 'pointer',
                boxShadow: 'inset 0 0 0 1px rgba(255,255,255,0.18)',
              }}>
                {/* hatch overlay for waste */}
                {it.util < 25 && (
                  <div style={{ position: 'absolute', inset: 0, backgroundImage: 'repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0 3px, transparent 3px 8px)' }} />
                )}
                <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', gap: 2 }}>
                  <div style={{ fontSize: it.w * it.h > 800 ? 13 : 11, fontWeight: 500, lineHeight: 1.1, letterSpacing: '-0.005em' }}>{it.name}</div>
                  {it.w * it.h > 600 && (
                    <div style={{ display: 'flex', gap: 6, fontSize: 9.5, fontFamily: 'var(--font-num)', opacity: 0.85 }}>
                      <span>ns/{it.ns}</span>
                      <span>· {it.pods}p</span>
                    </div>
                  )}
                </div>
                <div style={{ position: 'relative', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', fontFamily: 'var(--font-num)', fontSize: it.w * it.h > 800 ? 12 : 10 }}>
                  <span style={{ fontWeight: 600 }}>${(it.cost / 1000).toFixed(1)}k</span>
                  <span style={{ opacity: 0.8 }}>{it.util}%</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function UtilBar({ label, used, req, color, tone }) {
  const pct = (used / req) * 100;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '3px 0' }}>
      <span style={{ width: 56, fontSize: 11, color: 'var(--muted)' }}>{label}</span>
      <div style={{ flex: 1, position: 'relative', height: 14 }}>
        <div style={{ position: 'absolute', inset: 0, height: 8, marginTop: 3, background: 'var(--hairline)', borderRadius: 2 }} />
        <div style={{ position: 'absolute', height: 8, marginTop: 3, width: `${pct}%`, background: color, borderRadius: 2 }} />
        {/* request marker */}
        <div style={{ position: 'absolute', left: '100%', top: 0, bottom: 0, width: 1, background: 'var(--ink)', marginLeft: -1 }} />
      </div>
      <span className="mono" style={{ fontSize: 11, width: 70, textAlign: 'right', color: `var(--${tone})` }}>{used}% / 100%</span>
    </div>
  );
}

function CompBar({ segs }) {
  const total = segs.reduce((a, b) => a + b.v, 0);
  return (
    <div>
      <div style={{ display: 'flex', height: 12, borderRadius: 999, overflow: 'hidden', background: 'var(--hairline)' }}>
        {segs.map((s, i) => (
          <div key={i} style={{ width: `${(s.v / total) * 100}%`, background: s.c }} />
        ))}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 4, marginTop: 6, fontSize: 11 }}>
        {segs.map((s) => (
          <div key={s.label} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <span className="legend-dot" style={{ background: s.c, width: 7, height: 7 }} />
            <span style={{ color: 'var(--muted)', flex: 1 }}>{s.label}</span>
            <span className="mono" style={{ color: 'var(--ink)', fontWeight: 500 }}>${s.v.toLocaleString()}</span>
            <span className="mono" style={{ color: 'var(--muted)', width: 36, textAlign: 'right', fontSize: 10 }}>{((s.v / total) * 100).toFixed(0)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

                      <div style={{ marginTop:8, padding:'8px 12px', background:'var(--warning-soft)', borderRadius:6, border:'1px solid var(--warning)', fontSize:11.5, color:'var(--warning)' }}>
                        ⚠ BigQuery export delay detected (18m vs 5m target). Check billing export dataset permissions.
                      </div>
                    )}
                  </div>
                ))}

                {/* Summary stats */}
                <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12 }}>
                  {[
                    { label:'Total MTD spend',     val:'$2.41M',  sub:'3 providers · 12 accounts' },
                    { label:'Data freshness',       val:'99.2%',   sub:'uptime last 30d' },
                    { label:'Avg sync latency',     val:'8.7m',    sub:'target: < 10m' },
                    { label:'Active ingestion jobs', val:'6 / 6',  sub:'all pipelines healthy' },
                  ].map(s => (
                    <div key={s.label} className="card" style={{ padding:'12px 14px' }}>
                      <div style={{ fontSize:10.5, color:'var(--muted)', marginBottom:2 }}>{s.label}</div>
                      <div className="mono" style={{ fontSize:18, fontWeight:600, color:'var(--ink)' }}>{s.val}</div>
                      <div style={{ fontSize:10.5, color:'var(--muted)', marginTop:2 }}>{s.sub}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeSection === 'users' && (
              <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <div>
                    <div style={{ fontSize:14, fontWeight:600, color:'var(--ink)', marginBottom:4 }}>User management & RBAC</div>
                    <div style={{ fontSize:12, color:'var(--muted)' }}>6 users · role-based access · SSO via Okta</div>
                  </div>
                  <div style={{ flex:1 }} />
                  <button className="btn ghost" style={{ fontSize:11 }}><Ico name="plus" size={11} /> Invite user</button>
                  <button className="btn ghost" style={{ fontSize:11 }}>Manage roles</button>
                </div>

                <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10 }}>
                  {[
                    { role:'FinOps Admin',    count:1, desc:'Full access · all dashboards + config + user mgmt' },
                    { role:'Finance Manager', count:1, desc:'Budget mgmt · finance + exec dashboards' },
                    { role:'FinOps Engineer', count:1, desc:'All dashboards · create recs · no user mgmt' },
                    { role:'Team Lead',       count:1, desc:'Own team costs only · read-only' },
                    { role:'Finance Analyst', count:1, desc:'All dashboards · read-only · export' },
                    { role:'Viewer',          count:1, desc:'Executive Summary only' },
                  ].map(r => {
                    const rc = roleColors[r.role] || { bg:'var(--hairline)', fg:'var(--muted)' };
                    return (
                      <div key={r.role} className="card" style={{ padding:'10px 12px' }}>
                        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
                          <span style={{ padding:'1px 8px', borderRadius:4, background:rc.bg, color:rc.fg, fontSize:11, fontWeight:500 }}>{r.role}</span>
                          <span style={{ fontSize:11, color:'var(--muted)', marginLeft:'auto' }}>{r.count} user{r.count!==1?'s':''}</span>
                        </div>
                        <div style={{ fontSize:11, color:'var(--muted)' }}>{r.desc}</div>
                      </div>
                    );
                  })}
                </div>

                <div className="card" style={{ overflow:'hidden' }}>
                  <div style={{ padding:'8px 14px', borderBottom:'1px solid var(--hairline)', display:'flex', alignItems:'center' }}>
                    <div className="section-title">Users</div>
                    <div style={{ flex:1 }} />
                    <span style={{ fontSize:11, color:'var(--muted)' }}>SSO: Okta · SCIM provisioning active</span>
                  </div>
                  <table className="tbl">
                    <thead><tr>
                      <th>Name</th><th>Email</th><th>Role</th><th>Access scope</th><th>Last active</th><th>Actions</th>
                    </tr></thead>
                    <tbody>
                      {users.map(u => {
                        const rc = roleColors[u.role] || { bg:'var(--hairline)', fg:'var(--muted)' };
                        const initials = u.name.split(' ').map(s=>s[0]).join('');
                        return (
                          <tr key={u.email}>
                            <td>
                              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                                <div style={{ width:24, height:24, borderRadius:999, background:'oklch(0.85 0.05 80)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, fontWeight:600, color:'oklch(0.35 0.05 80)' }}>{initials}</div>
                                <span style={{ fontWeight:500, color:'var(--ink)' }}>{u.name}</span>
                              </div>
                            </td>
                            <td><span className="mono" style={{ fontSize:11, color:'var(--muted)' }}>{u.email}</span></td>
                            <td><span style={{ padding:'1px 8px', borderRadius:4, background:rc.bg, color:rc.fg, fontSize:10.5, fontWeight:500 }}>{u.role}</span></td>
                            <td>{u.scopes.map(s=><Tag key={s} tone="neutral">{s}</Tag>)}</td>
                            <td><span className="mono" style={{ fontSize:11, color:'var(--muted)' }}>{u.last}</span></td>
                            <td>
                              <div style={{ display:'flex', gap:6 }}>
                                <button className="btn ghost" style={{ fontSize:10, padding:'1px 6px' }}>Edit</button>
                                <button className="btn ghost" style={{ fontSize:10, padding:'1px 6px', color:'var(--negative)' }}>Revoke</button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeSection === 'audit' && (
              <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
                <div style={{ display:'flex', alignItems:'center' }}>
                  <div>
                    <div style={{ fontSize:14, fontWeight:600, color:'var(--ink)', marginBottom:4 }}>Audit log</div>
                    <div style={{ fontSize:12, color:'var(--muted)' }}>All admin actions · immutable · exported to SIEM nightly</div>
                  </div>
                  <div style={{ flex:1 }} />
                  <button className="btn ghost" style={{ fontSize:11 }}><Ico name="download" size={11} /> Export log</button>
                </div>
                <div className="card" style={{ overflow:'hidden' }}>
                  <table className="tbl">
                    <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Scope</th><th>Type</th></tr></thead>
                    <tbody>
                      {auditLog.map((e,i) => (
                        <tr key={i}>
                          <td><span className="mono" style={{ fontSize:11, color:'var(--muted)' }}>Today {e.time}</span></td>
                          <td><span style={{ fontWeight:500, color: e.user==='System'?'var(--muted)':'var(--ink)' }}>{e.user}</span></td>
                          <td><span style={{ color:'var(--ink)' }}>{e.action}</span></td>
                          <td><span className="mono" style={{ fontSize:11, color:'var(--muted)' }}>{e.scope}</span></td>
                          <td>
                            <Tag tone={
                              e.type==='alert'?'negative' : e.type==='export'?'info' :
                              e.type==='user'?'warning' : e.type==='sync'?'positive' : 'neutral'
                            }>{e.type}</Tag>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}
Object.assign(window, { AdminScreen });
  </script>

  <!-- 12. App root — mounts the DesignCanvas with all 12 artboards -->
  <script type="text/babel" data-presets="react">
/* global React, ReactDOM, DesignCanvas, DCSection, DCArtboard, useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakToggle, TweakColor, OverviewScreen, ExplorerScreen, AnomaliesScreen, BudgetsScreen, RecommendationsScreen, DrilldownScreen, AIScreen, AWSScreen, AzureScreen, GCPScreen, FOCUSScreen, AdminScreen */

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme":      "light",
  "chartMode":  "area",
  "density":    "regular",
  "accent":     "#3b5bdb"
}/*EDITMODE-END*/;

const ACCENT_MAP = {
  '#3b5bdb': { accent: 'oklch(0.55 0.13 250)', brand: 'oklch(0.28 0.06 250)' }, // indigo
  '#c2410c': { accent: 'oklch(0.58 0.16 35)',  brand: 'oklch(0.32 0.08 35)' },  // ember
  '#3f7d56': { accent: 'oklch(0.55 0.11 150)', brand: 'oklch(0.30 0.06 150)' }, // sage
  '#475569': { accent: 'oklch(0.4 0.02 270)',  brand: 'oklch(0.22 0.01 270)' }, // graphite
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const themeClass = t.theme === 'dark' ? 'theme-dark' : '';
  const densClass = t.density === 'comfy' ? 'dens-comfy' : t.density === 'compact' ? 'dens-compact' : '';
  const wrapClass = `${themeClass} ${densClass}`.trim();
  const accentVars = ACCENT_MAP[t.accent] || ACCENT_MAP.indigo;
  const wrapStyle = { '--accent': accentVars.accent, '--brand': accentVars.brand, width: '100%', height: '100%' };

  // Each artboard wraps its screen in the theme+density+accent overrides.
  const W = 1440, H = 900;
  const wrap = (Screen, extra = {}) => (
    <div className={wrapClass} style={wrapStyle}>
      <Screen chartMode={t.chartMode} {...extra} />
    </div>
  );

  return (
    <>
      <DesignCanvas>
        <DCSection id="finops" title="Lumen · FinOps OS" subtitle="A cloud cost intelligence platform for CFO + FinOps · AWS, GCP, Azure — 12 flows, side by side. Use the toolbar to pan/zoom, double-click any artboard to focus.">
          <DCArtboard id="overview"        label="01 · Executive Overview"      width={W} height={H}>{wrap(OverviewScreen)}</DCArtboard>
          <DCArtboard id="explorer"        label="02 · Cost Explorer"           width={W} height={H}>{wrap(ExplorerScreen)}</DCArtboard>
          <DCArtboard id="anomalies"       label="03 · Anomaly Detection"       width={W} height={H}>{wrap(AnomaliesScreen)}</DCArtboard>
          <DCArtboard id="budgets"         label="04 · Budgets & Forecast"      width={W} height={H}>{wrap(BudgetsScreen)}</DCArtboard>
          <DCArtboard id="recommendations" label="05 · Recommendations"         width={W} height={H}>{wrap(RecommendationsScreen)}</DCArtboard>
          <DCArtboard id="ai"              label="06 · AI Cost · vendors + GPU" width={W} height={H}>{wrap(AIScreen)}</DCArtboard>
          <DCArtboard id="drilldown"       label="07 · Resource Drill-down"     width={W} height={H}>{wrap(DrilldownScreen)}</DCArtboard>
          <DCArtboard id="aws"             label="08 · AWS Dashboard"           width={W} height={H}>{wrap(AWSScreen)}</DCArtboard>
          <DCArtboard id="azure"           label="09 · Azure Dashboard"         width={W} height={H}>{wrap(AzureScreen)}</DCArtboard>
          <DCArtboard id="gcp"             label="10 · GCP Dashboard"           width={W} height={H}>{wrap(GCPScreen)}</DCArtboard>
          <DCArtboard id="focus"           label="11 · FOCUS Normalized"        width={W} height={H}>{wrap(FOCUSScreen)}</DCArtboard>
          <DCArtboard id="admin"           label="12 · Admin Hub"               width={W} height={H}>{wrap(AdminScreen)}</DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Lumen tweaks">
        <TweakSection label="Theme" />
        <TweakRadio label="Mode" value={t.theme} options={['light', 'dark']}
                    onChange={(v) => setTweak('theme', v)} />
        <TweakColor label="Accent" value={t.accent}
                    options={['#3b5bdb', '#c2410c', '#3f7d56', '#475569']}
                    onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Charts" />
        <TweakRadio label="Chart style" value={t.chartMode} options={['area', 'bar', 'line']}
                    onChange={(v) => setTweak('chartMode', v)} />

        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density} options={['compact', 'regular', 'comfy']}
                    onChange={(v) => setTweak('density', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
