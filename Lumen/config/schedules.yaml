jobs:
  metrics_ingest:
    description: Pull CSP, Kubernetes, SaaS, and AI aggregate metrics into Signal Catalog.
    interval: 5m
    hot_retention_days: 7
    warm_retention_days: 90
    cold_retention_days: 730

  cost_ingest:
    description: Ingest AWS CUR Parquet files from S3 in 5-minute polling intervals.
    interval: 5m
    batch_size: 100
    retry_on_failure: true
    warm_retention_days: 365
    cold_retention_days: 730

  azure_ingest:
    description: Ingest Azure Cost Management API data in 5-minute polling intervals.
    interval: 5m
    batch_size: 100
    retry_on_failure: true
    warm_retention_days: 365
    cold_retention_days: 730

  gcp_ingest:
    description: Ingest GCP BigQuery cost data in 5-minute polling intervals.
    interval: 5m
    batch_size: 100
    retry_on_failure: true
    warm_retention_days: 365
    cold_retention_days: 730

  focus_transform:
    description: Transform CostDetail to FOCUS schema and create daily aggregations for dashboards. Handles AWS, Azure, and GCP data.
    interval: 1h
    batch_size: 1000
    retry_on_failure: true

  billing_ingest:
    description: Pull CUR, Azure Cost Export, GCP Billing Export, and SaaS cost rows.
    interval: 24h
    warm_retention_days: 90
    cold_retention_days: 730

  product_catalog_refresh:
    description: Refresh Product Catalog rates for AWS, Azure, and GCP with incremental updates.
    interval: 30d
    stale_after: 30d
    incremental_updates: true

  native_recommendation_import:
    description: Import CSP-native and third-party SaaS recommendations as FinOps Findings.
    interval: 12h

  evaluator_run:
    description: Evaluate active hypotheses against current customer signals.
    interval: 1h
    minimum_history: 14d

  backtest:
    description: Replay a hypothesis against historical signals before publish.
    interval: on_demand
    default_window: 30d
    minimum_coverage_pct: 90

  reconciler:
    description: Reconcile applied actions against billing at T+30, T+60, and T+90.
    interval: 24h
    windows: [30, 60, 90]
